<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>FL Life 27 — Football Life</title>
<meta name="description" content="FL Life 27 — Football Life RPG">
<style>
:root{
  --bg:#07090d;--panel:#11141b;--panel2:#171b23;--panel3:#1d222c;
  --gold:#d6ad45;--gold2:#f0cf68;--line:#2a3443;--text:#f5f6f8;--muted:#9da5b3;
  --green:#52d38a;--red:#ff6570;--blue:#78a9ff;--purple:#b995ff;
  --shadow:0 14px 40px rgba(0,0,0,.28);--radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{border:0;color:inherit}
.app{max-width:760px;margin:0 auto;padding-bottom:96px}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  min-height:92px;padding:12px 14px;background:rgba(7,9,13,.94);backdrop-filter:blur(18px);
  border-bottom:1px solid #202733
}
.logo{width:88px;height:54px;object-fit:contain;flex:0 0 auto}
.player-mini{min-width:0;flex:1}
.player-name{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats-mini{display:flex;gap:6px}
.mini-stat{width:54px;height:54px;border:1px solid var(--line);border-radius:15px;background:#11141a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px}
.mini-stat b{font-size:15px;line-height:16px}.gold{color:var(--gold2)}.heart{color:#ff5964}.money{color:#f0ca61}.energy{color:#ffd85e}
main{padding:18px 14px}
.section{margin-bottom:18px}
.card{background:linear-gradient(180deg,#12161d,#101319);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.gold-card{border-color:#735b24}
.eyebrow{color:var(--gold2);font-size:13px;letter-spacing:3px;font-weight:900;text-transform:uppercase}
h1{font-size:32px;line-height:1.05;margin:8px 0 8px}h2{font-size:24px;margin:0 0 10px}h3{margin:0;font-size:17px}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#171b22;border:1px solid #293240;border-radius:18px;padding:13px}
.metric span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.metric b{display:block;font-size:22px;margin-top:3px}
.btn{width:100%;padding:13px 15px;border-radius:16px;background:#1a1f28;border:1px solid #303a49;text-align:left;cursor:pointer}
.btn:hover{border-color:#58667b}.btn.goldbtn{background:linear-gradient(180deg,#332b1b,#211c13);border-color:#816625}.btn:disabled{opacity:.4;cursor:not-allowed}
.action{display:flex;align-items:center;gap:13px;width:100%;padding:14px 14px;margin:9px 0;background:#171b22;border:1px solid #293240;border-radius:18px;text-align:left;cursor:pointer}
.action:active,.btn:active{transform:scale(.99)}
.action .ico{font-size:27px;width:38px;text-align:center}.action .body{flex:1;min-width:0}.action .title{font-size:17px;font-weight:750}.action .desc{font-size:12px;color:var(--muted);margin-top:4px}.action .right{text-align:right;white-space:nowrap}.action .time{font-size:13px;color:var(--gold2);font-weight:800}.action .cost{font-size:11px;color:var(--muted);margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.badge{padding:6px 9px;border-radius:999px;background:#1a1f28;border:1px solid #303a49;font-size:11px;color:#cbd1dc}.badge.gold{border-color:#705923;background:#2a2417}
.notice{display:flex;gap:12px;align-items:center;background:linear-gradient(100deg,#2c2619,#17191e);border:1px solid #755d26;border-radius:19px;padding:15px;margin-top:10px;cursor:pointer}
.notice .ico{font-size:25px}.notice b{font-size:15px}.notice span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);z-index:40;padding:8px 9px max(8px,env(safe-area-inset-bottom));background:rgba(12,15,20,.96);border-top:1px solid #28313e;backdrop-filter:blur(18px)}
.tab{background:transparent;border-radius:15px;padding:8px 3px;color:#8f98a8;cursor:pointer;font-size:11px}.tab .ico{display:block;font-size:22px;margin-bottom:3px}.tab.active{background:#1b2029;color:#fff}.tab.active .ico{filter:saturate(1.2)}
.fab{position:fixed;right:max(14px,calc((100vw - 760px)/2 + 14px));bottom:92px;z-index:35;width:58px;height:58px;border-radius:18px;background:#28251c;border:1px solid #8b6b28;color:var(--gold2);font-size:26px;cursor:pointer;box-shadow:var(--shadow)}
.drawer{position:fixed;inset:0;z-index:80;pointer-events:none}
.drawer.open{pointer-events:auto}.drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,.65);opacity:0;transition:.2s}.drawer.open .drawer-bg{opacity:1}
.drawer-panel{position:absolute;top:0;bottom:0;right:0;width:min(90%,380px);background:#0f1218;border-left:1px solid #3b4554;transform:translateX(100%);transition:.25s;padding:22px 16px;overflow:auto}.drawer.open .drawer-panel{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{width:42px;height:42px;border-radius:13px;background:#1c212a;cursor:pointer}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menu-item{padding:15px;border-radius:17px;background:#171b22;border:1px solid #2b3441;cursor:pointer;text-align:left}.menu-item .ico{font-size:23px}.menu-item b{display:block;margin-top:6px}.menu-item span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,4,7,.78);display:none;align-items:flex-end}.modal.show{display:flex}.modal-sheet{width:min(760px,100%);max-height:92vh;overflow:auto;margin:auto auto 0;background:#11141b;border:1px solid #3a4554;border-radius:28px 28px 0 0;padding:20px 16px 28px;box-shadow:0 -20px 80px rgba(0,0,0,.5)}
.modal.full .modal-sheet{height:100%;max-height:none;border-radius:0;margin:0}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.modal-actions{display:grid;gap:10px;margin-top:16px}.choice{padding:16px;border-radius:18px;background:#191e27;border:1px solid #303a49;text-align:left;cursor:pointer}.choice b{display:block}.choice span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.list{display:grid;gap:10px}.person,.property,.post,.history-item,.job{background:#171b22;border:1px solid #293240;border-radius:18px;padding:15px}.person h3,.property h3,.job h3{margin-bottom:5px}.divider{height:1px;background:#293240;margin:16px 0}
.progress{height:8px;background:#242a34;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);opacity:0;z-index:120;background:#1a2029;border:1px solid #3a4554;border-radius:14px;padding:12px 15px;box-shadow:var(--shadow);transition:.25s;max-width:90%;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
.form{display:grid;gap:9px}.input,.select,.textarea{width:100%;background:#171b22;color:#fff;border:1px solid #303a49;border-radius:14px;padding:12px}.textarea{min-height:90px;resize:vertical}
.kpi{font-size:13px;color:var(--muted)}.kpi b{color:#fff}
@media(min-width:761px){.app{border-left:1px solid #161c25;border-right:1px solid #161c25;min-height:100vh}.topbar{padding-left:24px;padding-right:24px}}

.fl-run-loading{position:relative;height:12px;overflow:visible;margin-top:2px}
.fl-run-loading #flLoadBar{position:absolute;left:0;top:0;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#a9832f,#f0cf68,#fff1a3);box-shadow:0 0 16px rgba(240,207,104,.35);transition:width .2s linear}
.fl-load-runner{position:absolute;left:0;top:50%;width:48px;height:54px;transform:translate(-22px,-70%);z-index:3;pointer-events:none;transition:left .2s linear;filter:drop-shadow(0 5px 8px rgba(0,0,0,.45))}
.fl-load-person{position:absolute;left:2px;top:0;font-size:35px;line-height:1;display:block;transform:scaleX(-1);animation:flMiniRun .22s infinite alternate}
.fl-load-ball{position:absolute;right:0;bottom:1px;font-size:15px;line-height:1;animation:flMiniBall .45s ease-in-out infinite alternate}
@keyframes flMiniRun{from{transform:scaleX(-1) translateY(1px)}to{transform:scaleX(-1) translateY(-2px)}}
@keyframes flMiniBall{from{transform:translateY(0) rotate(0)}to{transform:translateY(-3px) rotate(20deg)}}

<style id="fl-runner-art">
.fl-load-person{font-size:0!important;width:76px;height:86px;position:relative;display:block!important}
.fl-load-person:before{
 content:"";position:absolute;left:30px;top:4px;width:20px;height:20px;border-radius:50%;
 background:#e9edf2;box-shadow:0 0 0 1px rgba(255,255,255,.12);
}
.fl-load-person:after{
 content:"";position:absolute;left:27px;top:24px;width:27px;height:37px;border-radius:9px 9px 6px 6px;
 background:linear-gradient(145deg,#f0cf68,#b08a35);box-shadow:14px 27px 0 -8px #e9edf2,-13px 29px 0 -8px #e9edf2;
}
</style>
<style id="responsive-fl-life">
*{box-sizing:border-box}html,body{width:100%;min-height:100%;overflow-x:hidden}
button,.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mobile-menu-btn,.mobile-menu-backdrop{display:none}
@media(max-width:760px){
.mobile-menu-btn{display:flex;position:fixed;z-index:10001;left:12px;top:12px;width:46px;height:46px;border:1px solid rgba(212,175,55,.35);border-radius:14px;align-items:center;justify-content:center;background:#101319;color:#e9c85b;font-size:22px}
.mobile-menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:9998;opacity:0;pointer-events:none;transition:opacity .2s}
.mobile-menu-backdrop.open{opacity:1;pointer-events:auto}
.side-menu{position:fixed!important;z-index:10000!important;left:0!important;top:0!important;bottom:0!important;width:min(86vw,330px)!important;overflow-y:auto!important;transform:translateX(-105%);padding:18px 14px 24px!important;background:linear-gradient(180deg,#101319,#151922)!important;border-right:1px solid rgba(212,175,55,.24);box-shadow:18px 0 50px rgba(0,0,0,.42);transition:transform .24s ease}
.side-menu.open{transform:translateX(0)}
.side-menu-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 18px}
.side-close{background:transparent;border:0;color:#ddd;font-size:22px;padding:8px}

.zone-title{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px;background:transparent;border:0;color:#f5f5f5;font-weight:800;text-align:left}
.zone-items{display:none;padding:0 8px 8px}.side-zone.open .zone-items{display:grid;gap:4px}
.zone-items button{border:0;border-radius:11px;background:rgba(255,255,255,.045);color:#cfd3da;text-align:left;padding:12px;min-height:44px}
#app,.app,.main,.content,.page,.container{max-width:100%!important;width:100%!important;min-width:0!important}
.grid,.grid2,.grid3,.stats-grid{grid-template-columns:1fr!important}
.card,.section,.panel{min-width:0!important}table{display:block;width:100%;overflow-x:auto}
input,select,textarea{max-width:100%;font-size:16px!important}.btn,.action,.activity,.choice,.tile{min-height:46px}
}
</style>
<style id="fl-life-startscreen">
#flStartScreen{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(214,173,69,.14),transparent 28%),linear-gradient(145deg,#05070b,#090c12 48%,#05070b);overflow:hidden;transition:opacity .65s ease,visibility .65s ease}
#flStartScreen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.fl-start-noise{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(rgba(255,255,255,.12) .7px,transparent .7px);background-size:7px 7px}
.fl-start-glow{position:absolute;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(214,173,69,.12),transparent 65%);filter:blur(8px);animation:flGlow 4s ease-in-out infinite}
.fl-start-inner{position:relative;width:min(620px,92vw);display:flex;flex-direction:column;align-items:center;text-align:center}
.fl-start-brand{display:flex;flex-direction:column;align-items:center;gap:10px;transform:translateY(25px) scale(.58);opacity:0;animation:flLogoLand 1.65s cubic-bezier(.2,.85,.2,1) .15s forwards}
.fl-start-logo{width:min(360px,68vw);height:auto;max-height:210px;object-fit:contain;filter:drop-shadow(0 18px 38px rgba(0,0,0,.6))}
.fl-start-title{font-size:clamp(30px,7vw,52px);font-weight:950;letter-spacing:7px;line-height:1;background:linear-gradient(180deg,#fff,#f0cf68 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.fl-start-subtitle{font-size:11px;letter-spacing:4px;color:#8e97a7;text-transform:uppercase}
.fl-runner{width:min(520px,84vw);height:130px;margin:10px auto 0;position:relative;opacity:0;animation:flAppear .7s ease 1s forwards}
.fl-runner-track{position:absolute;left:3%;right:3%;bottom:25px;height:2px;background:linear-gradient(90deg,transparent,#39404b 12%,#39404b 88%,transparent)}
.fl-player{position:absolute;left:5%;bottom:25px;width:74px;height:82px;animation:flRunAcross 2.7s linear infinite}
.fl-head{position:absolute;width:18px;height:18px;border-radius:50%;background:#e9c39b;left:29px;top:1px}
.fl-body{position:absolute;width:28px;height:37px;border-radius:10px 10px 7px 7px;background:linear-gradient(135deg,#f0cf68,#8d6c29);left:24px;top:19px;transform:skew(-6deg)}
.fl-leg,.fl-arm{position:absolute;width:8px;border-radius:8px;background:#d7dbe2;transform-origin:top center}
.fl-leg{height:31px;top:50px}.fl-leg.l{left:27px;transform:rotate(25deg);animation:flLeg1 .32s infinite alternate}.fl-leg.r{left:42px;transform:rotate(-25deg);animation:flLeg2 .32s infinite alternate}
.fl-arm{height:27px;top:22px}.fl-arm.l{left:20px;transform:rotate(38deg);animation:flArm1 .32s infinite alternate}.fl-arm.r{left:48px;transform:rotate(-35deg);animation:flArm2 .32s infinite alternate}
.fl-ball{position:absolute;width:19px;height:19px;border-radius:50%;background:#f4f4f4;border:2px solid #222;left:68px;top:67px;box-shadow:0 0 10px rgba(255,255,255,.2);animation:flBall 1.35s ease-in-out infinite}
.fl-loading{width:min(520px,84vw);margin-top:0;opacity:0;animation:flAppear .7s ease 1.15s forwards}
.fl-loading-line{height:12px;border-radius:99px;background:#151a22;overflow:visible;border:1px solid #303846;position:relative}
.fl-loading-line i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a9832f,#f0cf68,#fff1a3);box-shadow:0 0 18px rgba(240,207,104,.4);transition:width .18s ease}
.fl-loading-row{display:flex;justify-content:space-between;margin-top:11px;font-size:11px;color:#8992a1;letter-spacing:.2px}
#flLoadStatus{color:#d9b95b}.fl-start-menu{width:min(440px,86vw);display:grid;gap:9px;margin-top:22px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.35s ease}.fl-start-menu.ready{opacity:1;transform:none;pointer-events:auto}
.fl-start-btn{width:100%;min-height:58px;border-radius:17px;border:1px solid #303a49;background:rgba(20,25,33,.86);color:#f5f6f8;text-align:left;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:13px;box-shadow:0 10px 28px rgba(0,0,0,.16);transition:transform .15s,border-color .15s,background .15s}
.fl-start-btn:hover{transform:translateY(-1px);border-color:#806727;background:#191e27}.fl-start-btn.primary{border-color:#846b2b;background:linear-gradient(180deg,#302718,#1c1811)}
.fl-start-btn .sico{font-size:25px;width:34px;text-align:center}.fl-start-btn b{display:block;font-size:16px}.fl-start-btn span{display:block;font-size:11px;color:#929aa8;margin-top:2px}.fl-start-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.fl-start-foot{margin-top:18px;color:#596273;font-size:10px;letter-spacing:1px;opacity:0;animation:flAppear .6s ease 1.5s forwards}
@keyframes flLogoLand{0%{opacity:0;transform:translateY(55px) scale(.28)}55%{opacity:1;transform:translateY(-10px) scale(1.08)}78%{transform:translateY(3px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes flAppear{to{opacity:1}}@keyframes flGlow{0%,100%{transform:scale(.96);opacity:.7}50%{transform:scale(1.05);opacity:1}}
@keyframes flRunAcross{0%{left:5%;transform:scaleX(1)}49%{left:80%;transform:scaleX(1)}50%{left:80%;transform:scaleX(-1)}99%{left:5%;transform:scaleX(-1)}100%{left:5%;transform:scaleX(1)}}
@keyframes flLeg1{to{transform:rotate(-32deg)}}@keyframes flLeg2{to{transform:rotate(32deg)}}@keyframes flArm1{to{transform:rotate(-32deg)}}@keyframes flArm2{to{transform:rotate(32deg)}}
@keyframes flBall{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(180deg)}}
@media(max-width:520px){.fl-start-logo{width:250px}.fl-start-title{font-size:31px;letter-spacing:5px}.fl-start-subtitle{font-size:9px}.fl-start-menu{margin-top:18px}}
</style>

<body><button class="fl-quick-save" onclick="flSaveAs()" title="Zapisz karierę">💾 Zapisz</button>

<div id="flStartScreen" aria-label="FL Life 27 — ekran startowy">
  <div class="fl-start-noise"></div>
  <div class="fl-start-glow"></div>
  <div class="fl-start-inner">
    <div class="fl-start-brand">
      <img id="flStartLogo" class="fl-start-logo" alt="FL Life 27">
      <div class="fl-start-subtitle">Football Life • Your story, your career</div>
    </div><div class="fl-loading">
      <div class="fl-loading-line fl-run-loading"><i id="flLoadBar"></i><div id="flLoadRunner" class="fl-load-runner"><span class="fl-load-person">⚽</span></div></div>
      <div class="fl-loading-row"><span id="flLoadStatus">Ładowanie świata…</span><span id="flLoadPct">0%</span></div>
    </div>
    <div class="fl-start-menu" id="flStartMenu">
      <button class="fl-start-btn primary" onclick="flStartContinue()"><div class="sico">▶️</div><div><b>Kontynuuj</b><span id="flContinueDesc">Wznów ostatnią karierę</span></div></button>
      <button class="fl-start-btn" onclick="flStartNewGame()"><div class="sico">✨</div><div><b>Nowa gra</b><span>Stwórz zupełnie nową historię</span></div></button>

function migrateSave(s){
  s.world=s.world||{}; s.world.properties=s.world.properties||[];
  s.properties=(s.properties||[]).filter(p=>p.status==='mieszkam z rodzicami'||p.status==='własność'||p.owned===true);
  s.properties.forEach(p=>{if(p.status==='mieszkam z rodzicami')p.owned=true});
  if(s.player?.age<18 && s.properties.length===0){
    s.properties=[{id:'parents',name:'Dom rodzinny',type:'dom',city:s.player.city,status:'mieszkam z rodzicami',value:0,rooms:5,comfort:70,owned:true,expandable:false}];
  }
  if(s.day && s.day.time>24*60)s.day.time=24*60;
  if(!s.world.shoes)s.world.shoes=[];
  if(!s.world.languages)s.world.languages=[];
  // Jeśli niepełnoletni zawodnik mieszka z rodzicami, rodzice mieszkają z nim;
  // ich narodowość/pochodzenie pozostaje niezależne od miejsca zamieszkania.
  if(s.player?.age<18 && s.family?.parentsTogether){
    s.family.father.country=s.player.country;
    s.family.father.city=s.player.city;
    s.family.mother.country=s.player.country;
    s.family.mother.city=s.player.city;
  }
  // Język miejsca zamieszkania jest językiem środowiska i zawsze wynosi 100%.
  try{
    if(s.player?.countryCode && typeof addResidenceLanguage==='function'){
      s.world.languages=addResidenceLanguage(s.world.languages,s.player.countryCode);
    }
  }catch(e){}
}
function deepMerge(a,b){
  for(const k in b){
    if(b[k] && typeof b[k]==='object' && !Array.isArray(b[k]) && a[k]) a[k]=deepMerge(a[k],b[k]);
    else a[k]=b[k];
  }
  return a;
}

  const d=new Date(dateStr+'T12:00:00');
  const names=['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
  return names[d.getDay()];
}
function dateLongPL(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function isSchoolToday(){return isSchoolDay(S.day.date) && S.player.age<19}
function dailySeed(){
  const s=(S.day.date||'').replace(/-/g,'').split('').reduce((a,c)=>a+c.charCodeAt(0),0)+S.day.dayNo*17;
  return Math.abs(s);
}
function dailyActivityList(){
  const fixed=activities.filter(a=>a.fixed && a.id!=='sleep');
  const rotating=activities.filter(a=>!a.fixed && a.id!=='sleep');
  let arr=rotating.map((x,i)=>({x,score:(dailySeed()*(i+7)+i*31)%997})).sort((a,b)=>a.score-b.score).slice(0,14).map(x=>x.x);
  // Szkoła pojawia się tylko w dni szkolne. Trening klubowy może pojawić się każdego dnia,
  // ale realny kalendarz i dostępność nadal ograniczają jego wykonanie.
  if(!isSchoolToday()) arr=arr.filter(a=>a.id!=='study'&&a.id!=='studyFriends'&&a.id!=='library');
  return [...fixed.filter(a=>a.id!=='school'||isSchoolToday()),...arr];
}
function availability(a){

  if(['music','film'].includes(a.id) && p.money<a.cost) return false;
  if(a.id==='psych' && p.money<a.cost) return false;
  if(a.id==='school'){
    if(!isSchoolToday()) return false;
    if(h<7 || h>8) return false;

function randomTravelEvent(context='akcja'){
  const modes=[
    {name:'🚶 Pieszo',min:10,max:25,energy:.5},
    {name:'🚌 Autobus',min:15,max:35,energy:.3},
    {name:'🚲 Rower',min:10,max:25,energy:1},
    {name:'🚗 Rodzice podwożą',min:8,max:22,energy:0},
    {name:'🛴 Hulajnoga',min:10,max:28,energy:.7}
  ];
  const m=modes[Math.floor(Math.random()*modes.length)];
  const minutes=Math.floor(m.min+Math.random()*(m.max-m.min+1));
  const eventRoll=Math.random();
  let event=null;
  if(eventRoll<.10) event={title:'🚦 Niespodziewany dojazd',text:`Dojazd na ${context} nie przebiegł normalnie. ${m.name} — ${minutes} min.`,choices:[
    ['Czekam spokojnie','Docierasz później, ale bez większych konsekwencji.',{mental:1}],
    ['Szukam szybszej trasy','Ryzykujesz większe zmęczenie.',{energy:-2}]
  ]};
  else if(eventRoll<.16) event={title:'📸 Zauważono Cię po drodze',text:`Podczas dojazdu na ${context} ktoś Cię rozpoznał.`,choices:[
    ['Zatrzymuję się na zdjęcie','Miły kontakt z kibicem.',{popularity:1}],
    ['Idę dalej','Zachowujesz prywatność.',{mental:1}]
  ]};
  return {mode:m.name,minutes,event};
}
function startActionWithTravel(action){
  const travel=randomTravelEvent(action.name||'aktywność');
  S.day.lastTravel={action:action.name,mode:travel.mode,minutes:travel.minutes,date:S.date};
  if(travel.event){
    S.day.pendingAfterTravel={action,travel};

    return false;
  }
  advanceMinutes(travel.minutes);
  return true;
}

function daysUntil(ds){return Math.max(0,Math.ceil((new Date(ds)-new Date(S.day.date))/86400000))}


function activityDuration(a){
  if(!a) return 60;
  if(a.id==='school') return 300;
  if(a.id==='sleep') return 0;
  const long=['club','friend','family','skate','basket','footballFriends','games','music','film','date','volunteer'];
  const short=['tech','speed','strength','analysis','study','library','pool','regen','psych','walk','bike','park','shopping','cook','flgram'];
  if(long.includes(a.id)) return 150;
  if(short.includes(a.id)) return 60 + (dailySeed()+a.id.length*17)%2*30;
  return a.time>=120?90:60;
}
function travelForAction(a){
  const modes=[
    {name:'🚶 Pieszo',min:8,max:25},
    {name:'🚌 Autobus',min:12,max:35},
    {name:'🚲 Rower',min:8,max:22},
    {name:'🚗 Rodzice podwożą',min:7,max:20},
    {name:'🛴 Hulajnoga',min:10,max:28}
  ];
  // Existing owned transport can bias the roll, but it is never forced.
  const pool=[...modes];
  if(S.world?.transport?.ownedBike) pool.push(modes[2],modes[2]);
  if(S.world?.transport?.ownedCar) pool.push(modes[3],modes[3]);
  const m=pool[Math.floor(Math.random()*pool.length)];
  const minutes=Math.floor(m.min+Math.random()*(m.max-m.min+1));
  return {mode:m.name,minutes};
}

function doActivity(id){
  const a=activities.find(x=>x.id===id); if(!a)return;
  if(!availability(a)){toast('Ta aktywność jest teraz niedostępna.');return}
  if(id==='sleep'){sleep();return}

  const duration=activityDuration(a);
  const travel=travelForAction(a);
  const total=duration+travel.minutes;
  if(S.day.time+total>24*60){toast('Nie zmieścisz już tej aktywności wraz z dojazdem.');return}

  const old={...S.player};
  S.player.money-=a.cost;
  S.day.lastTravel={action:a.name,mode:travel.mode,minutes:travel.minutes,date:S.day.date};
  S.day.lastActivityDuration=duration;

  // Dojazd jest częścią planu, ale może wywołać wydarzenie po drodze.
  S.day.time+=travel.minutes;
  if(Math.random()<0.10){
    triggerEvent({
      title:'🚦 Coś wydarzyło się po drodze',
      text:`Jedziesz na: ${a.name}. Wylosowany dojazd: ${travel.mode}, około ${travel.minutes} min.`,
      choices:[
        ['Jadę dalej zgodnie z planem','Docierasz na miejsce bez dodatkowych zmian.',{}],
        ['Zmieniam trasę','Poświęcasz trochę więcej energii, ale próbujesz uniknąć problemu.',{energy:-2}],
        ['Spokojnie czekam','Nie ryzykujesz i zachowujesz spokój.',{mental:1}]
      ]
    });
  }

  S.day.time+=duration;
  if(S.day.time>24*60)S.day.time=24*60;

  for(const [k,v] of Object.entries(a.effects)){
    if(k==='popularity') S.player.popularity=clamp(S.player.popularity+v,0,100);
    else if(k==='ovr') S.player.ovr=clamp(S.player.ovr+v,1,99);
    else S.player[k]=clamp((S.player[k]||0)+v,0,100);
  }
  if(id==='club'||id==='tech'||id==='speed'||id==='strength'||id==='analysis'){
    S.player.ovr=clamp(S.player.ovr+(a.effects.ovr||0),1,99)
  }
  if(id==='school') attendSchool();
  if(id==='music') secondaryWork('music',false);
  if(id==='film') secondaryWork('film',false);
  if(id==='flgram') flgramAction();
  if(['club','tech','speed','strength'].includes(id)) applyBootWear(2);

  addHistory(`Aktywność: ${a.name}`,
    `Wykonano ${a.name}. Czas aktywności: ${duration===150?'2,5 h':duration===90?'1,5 h':'1 h'} • dojazd: ${travel.mode} ${travel.minutes} min.`,
    effectsDiff(old,S.player));

  // Szansa na wydarzenie po wykonaniu aktywności; osobno od wydarzenia w dojeździe.
  maybeEvent(id);

  // Poznawanie nowych osób może nastąpić w wielu miejscach.
  if(Math.random()<0.10 && !['school','sleep'].includes(id)) createEncounterEvent(a.name);

  S.tutorial.steps[0]=true; S.tutorial.steps[1]=true;
  save();render();window.scrollTo({top:0,behavior:'smooth'});
}

function effectsDiff(o,n){
  const keys=['energy','health','mental','happiness','popularity','form','ovr','education','reputation'];
  return keys.filter(k=>o[k]!==n[k]).map(k=>`${labelStat(k)} ${n[k]>o[k]?'+':''}${Math.round((n[k]-o[k])*10)/10}`).join(' • ');
}
function sleep(){
  const currentMinutes=Math.min(24*60,Math.max(0,S.day.time));
  const hours=(currentMinutes<=7*60?0:(24*60-currentMinutes)+7*60)/60;
  const h=Math.max(0,Math.min(12,hours));
  const d=new Date(S.day.date+'T12:00:00');d.setDate(d.getDate()+1);
  S.day.date=d.toISOString().slice(0,10);S.day.dayNo++;
  S.day.time=7*60;
  const quality=Math.max(0,Math.min(1,h/9));
  S.player.energy=clamp(S.player.energy+Math.round(20+45*quality),0,100);
  S.player.health=clamp(S.player.health+Math.round(3+8*quality),0,100);
  S.player.mental=clamp(S.player.mental+Math.round(3+7*quality),0,100);
  S.player.happiness=clamp(S.player.happiness+Math.round(1+3*quality),0,100);
  S.tutorial.steps[2]=true;
  schoolDayMissed();
  dailyUpdate();
  addHistory('Sen',`Spałaś ${h.toFixed(1)} h. Nowy dzień rozpoczął się o 07:00.`,`⚡ regeneracja zależna od długości snu`);
  processFutureConsequences();
  maybeSchoolConsequence();
  if(Math.random()<0.28) maybeFamilyEvent(); if(Math.random()<0.16) familySupportEvent();
  maybeDailyEvent();
  save();render();window.scrollTo({top:0,behavior:'smooth'});toast(`🌅 Nowy dzień — sen: ${h.toFixed(1)} h`);
}
function dailyUpdate(){
  S.family.father.age += Math.random()<.03?1:0;
  S.family.mother.age += Math.random()<.03?1:0;
  // Dynamic family finances
  S.family.father.income=Math.max(0,S.family.father.income+Math.round((Math.random()-.48)*160));
  S.family.mother.income=Math.max(0,S.family.mother.income+Math.round((Math.random()-.48)*120));
}

const EVENT_COOLDOWN = 3;

    age:p.age, hour:h, energy:p.energy, mental:p.mental, health:p.health,

function canEventAppear(){
  const last=S.history[0];
  if(!last) return true;
  const daysSinceLast=Math.max(0,S.day.dayNo-(last.dayNo||S.day.dayNo));
  return daysSinceLast>=EVENT_COOLDOWN;
}
function eventScore(source){
  const c=eventContext();
  let score={club:20,tech:12,speed:12,strength:12,analysis:15,school:18,study:12,
    games:7,flgram:20,help:10,family:18,friend:16,walk:7,pool:7,regen:5,music:16,
    film:16,date:20,psych:8,chores:8,daily:12}[source]||10;
  if(c.matchSoon) score+=10;
  if(c.popularity>=10) score+=7;
  if(c.popularity>=30) score+=10;
  if(c.mental<40) score+=10;
  if(c.health<45) score+=8;
  if(c.energy<25) score+=5;
  if(c.minor) score+=4;
  return Math.min(85,score);
}

      choices:[

        ['Poproś kogoś o opinię','Relacje +3 • mental +3',{mental:3,happiness:2}]

  ];
  const candidates=events.filter(e=>e.when());
  if(!candidates.length)return null;
  // Preferuj wydarzenia nieodbyte wcześniej, ale pozwól im wracać w innych wariantach.
  const fresh=candidates.filter(e=>!eventMemoryHas(e.title));
  const list=fresh.length?fresh:candidates;
  return clone(list[Math.floor(Math.random()*list.length)]);
}

/* ===== EVENT QUEUE FIX =====
   Kilka systemów może wygenerować wydarzenie w tym samym momencie (np.
   konsekwencja + szkoła + rodzina + wydarzenie dnia). Wcześniej każde kolejne
   wydarzenie nadpisywało pendingEvent i modal, przez co przyciski poprzedniego
   wydarzenia przestawały działać. Teraz wydarzenia są kolejkowane i pokazują
   się jedno po drugim.
*/
window.eventQueue = window.eventQueue || [];
window.pendingEvent = window.pendingEvent || null;
function showNextEvent(){
  if(window.pendingEvent || !window.eventQueue.length) return;
  const e=window.eventQueue.shift();
  const id='ev'+(++S.eventCounter);
  window.pendingEvent={id,e};
  openModal(`<div class="modal-head event-modal-head"><div><div class="eyebrow">⚡ WYDARZENIE</div><h2>${esc(e.title)}</h2><div class="muted small" style="margin-top:6px">Wybierz jedną odpowiedź, aby kontynuować.</div></div></div>
    <div class="card" style="margin-top:12px;background:#171b22">${esc(e.text)}</div>
    <div class="modal-actions event-choices">${e.choices.map((c,i)=>`<button type="button" class="choice event-choice" data-event-id="${esc(id)}" data-choice-index="${i}" onclick="chooseEvent('${id}',${i})"><b>${i+1}. ${esc(c[0])}</b><span>${esc(c[1])}</span></button>`).join('')}</div>`,true);
}
function triggerEvent(e){
  if(!e)return;
  window.eventQueue.push(e);
  showNextEvent();
}
function chooseEvent(id,i){
  const p=window.pendingEvent;if(!p||p.id!==id)return;
  const c=p.e.choices[i];
  if(!c)return;
  for(const [k,v] of Object.entries(c[2])){if(k==='popularity')S.player.popularity=clamp(S.player.popularity+v,0,100);else if(k==='ovr')S.player.ovr=clamp(S.player.ovr+v,1,99);else S.player[k]=clamp((S.player[k]||0)+v,0,100)}
  const tags=[];
  const title=p.e.title||'Wydarzenie';
  if(/rodzin|rodzic|mama|tata/i.test(title)) tags.push('family');
  if(/szkol|nauk|edukac/i.test(title)) tags.push('education');
  if(/trener|skaut|karier|mecz|klub/i.test(title)) tags.push('career','career_risk');
  if(/flgram|wiadomo|relacj|kontakt|znajom/i.test(title)) tags.push('social');
  const memoryId=applyDecisionMemory(title,c[0],c[2],tags);
  if(typeof p.e.onChoose==='function') p.e.onChoose(i,c);
  S.tutorial.steps[3]=true;
  addHistory('Decyzja: '+p.e.title,c[0],c[1]+' • pamięć #'+memoryId.slice(-5));
  // Zakończ tylko aktualne wydarzenie. Kolejne czeka w kolejce.
  document.getElementById('modal').classList.remove('show');
  window.pendingEvent=null;
  save();render();
  toast('Decyzja zapisana w historii.');
  // Następne wydarzenie pokazujemy dopiero po wyrenderowaniu poprzedniej decyzji.
  setTimeout(showNextEvent,80);
}
function addHistory(title,desc,effect){S.history.unshift({date:S.day.date,time:timePL(S.day.time),dayNo:S.day.dayNo,title,desc,effect});S.history=S.history.slice(0,120)}

  if(!firms.length) return `<div class="muted">Brak aktywnego sponsora. Firmy mogą pojawiać się wraz ze wzrostem OVR, popularności, wyników i wizerunku.</div>`;

function ensureBootState(item){
  if(!item) return null;
  if(item.wear==null) item.wear=0;
  if(!item.attributes) item.attributes={speed:0,control:0,shooting:0,comfort:0,grip:0};
  return item;
}
function activateBoot(id){
  const pool=[...(S.world.shoes||[]),...(WORLD_CATALOG.shoes||[])];
  const boot=pool.find(x=>x.id===id);
  if(!boot) return;
  ensureBootState(boot);
  if(!S.world.shoes.some(x=>x.id===boot.id)) S.world.shoes.push(clone(boot));
  S.world.activeBootId=boot.id;
  addHistory('Zmiana korków',`Aktywna para: ${boot.name} (${boot.brand}).`,'sprzęt meczowy');
  save();closeModal();render();toast('👟 Wybrano aktywną parę korków.');
}
function applyBootWear(amount){
  const id=S.world.activeBootId;
  if(!id) return;
  const boot=S.world.shoes.find(x=>x.id===id);
  if(!boot) return;
  ensureBootState(boot);
  boot.wear=clamp((boot.wear||0)+amount,0,100);
  if(boot.wear>=85 && Math.random()<.25){
    triggerEvent({title:'👟 Korki są mocno zużyte',text:`Para ${boot.name} jest już mocno zużyta. Zużycie: ${Math.round(boot.wear)}%. Możesz kupić nową parę lub dalej grać na obecnych.`,choices:[
      ['Kup nową parę','Zyskujesz świeży sprzęt.',{form:1}],
      ['Gram dalej','Oszczędzasz pieniądze, ale ryzykujesz dalsze zużycie.',{mental:-1}]
    ]});
  }
}

  const s=S.scouting.find(x=>x.id===id);if(!s)return;
  if(what==='accept'){
    if(S.player.age<18 && S.player.money<300){closeModal();triggerEvent({title:'Rodzice muszą zdecydować',text:'Masz mniej niż 18 lat. Wyjazd na testy wymaga pieniędzy, zgody i organizacji. Rodzice mają prawo powiedzieć „tak”, „nie” albo postawić warunki.',choices:[

      ['Poproś tylko tatę','Tata przejmuje organizację.',{happiness:2,mental:3}]

function nationalTeamCandidates(){
  const p=S.player;
  const code=p.countryCode || Object.keys(COUNTRY_WORLD).find(k=>COUNTRY_WORLD[k].name===p.country) || 'PL';
  const eligible=[{code,name:COUNTRY_WORLD[code]?.name||p.country,reason:'kraj zawodnika',status:p.ovr>=62?'zainteresowanie':'obserwacja'}];
  const origins=(S.family?.father?.originCountry||S.family?.mother?.originCountry)?[S.family?.father?.originCountry,S.family?.mother?.originCountry]:[];
  origins.filter(Boolean).forEach(origin=>{
    const oc=Object.keys(COUNTRY_WORLD).find(k=>COUNTRY_WORLD[k].name===origin);
    if(oc && oc!==code && !eligible.some(x=>x.code===oc)) eligible.push({code:oc,name:origin,reason:'pochodzenie rodzinne',status:p.ovr>=68?'zainteresowanie':'możliwa ścieżka'});
  });
  const level=Math.round(p.ovr + p.form*.12 + p.reputation*.08);
  return eligible.map(x=>({...x,level,offer:level>=72?'Powołanie / oferta':level>=62?'Wstępna obserwacja':'Brak propozycji — obserwują'}));
}

function relationDo(id,a){
 const r=S.relations.find(x=>x.id===id);if(!r)return;
 const cost=a.includes('Kawa')?6:a.includes('Lody')?5:a.includes('Kino')?15:a.includes('Prezent')?25:a.includes('posiłek')||a.includes('posiłek')?20:a.includes('wyjazd')?60:0;

 if(S.player.money<cost){toast('Za mało pieniędzy na tę aktywność.');return;}
 if(S.day.time+duration>24*60){toast('Nie masz już tyle czasu dzisiaj.');return;}
 const gain=a.includes('Szczera')?10:a.includes('Prezent')?8:a.includes('Wspólny wyjazd')?12:a.includes('Randka')?12:a.includes('Ważnej')?9:6;
 r.relation=clamp(r.relation+gain,0,100);
 S.player.money-=cost;
 S.day.time+=duration;
 addHistory('Relacja: '+r.name,a,`❤️ +${gain}${cost?' • -'+money(cost):''} • ${duration===30?'30 min':duration===60?'1 h':'1,5 h'}`);
 document.getElementById('modal').classList.remove('show');
 save();render();toast('❤️ Relacja zaktualizowana.');
 if(Math.random()<.18) triggerEvent({

 });
}


function languageRows(){
  const langs=S.player.languages||S.languages||{};
  const rows=Object.entries(langs).map(([name,val])=>({name,value:typeof val==='number'?val:(val?.percent||val?.level||0)}));
  return rows.sort((a,b)=>b.value-a.value);
}
function renderLanguageSummary(){
  const rows=languageRows();
  if(!rows.length)return '<div class="muted">Brak zapisanych języków.</div>';
  return `<div class="list">${rows.map(x=>`<div class="history-item"><div class="row"><b>🗣️ ${esc(x.name)}</b><span class="badge gold">${Math.round(x.value)}%</span></div><div class="progress" style="margin-top:7px"><i style="width:${clamp(x.value,0,100)}%"></i></div></div>`).join('')}</div>`;
}

function addWorldItem(type,item){
  if(!S.world[type])S.world[type]=[];
  S.world[type].push({...clone(item),boughtAt:S.day.date});
}
function buyWorldItem(type,id){
  const list=(type==='charity'?(CHARITY_CATALOG||[]):(['food','cafes','entertainment','sport','services','health','gifts','education','daily'].includes(type)?(WORLD_CATALOG[type]||[]):getStoreCatalog(type)));
  const item=list.find(x=>x.id===id); if(!item)return;
  if(item.minAge && S.player.age<item.minAge){toast(`Ta opcja jest dostępna od ${item.minAge} lat.`);return;}
  const price=item.price||item.cost||0;
  let discount=0;
  if(item.deal && S.world.brandDeals.includes(item.deal)) discount=.15;
  const final=Math.round(price*(1-discount));
  if((S.player.money||0)<final){triggerEvent({title:'Brakuje pieniędzy',text:'Nie stać Cię teraz na ten zakup.',choices:[['Wróć później','Zachowujesz pieniądze.',{}],['Poproś rodziców o pomoc','Może pojawić się rodzinne wydarzenie.',{happiness:1}],['Poszukaj tańszej opcji','Rozglądasz się za alternatywą.',{mental:1}] ]});return;}
  S.player.money-=final;
  addWorldItem(type,item);
  if(type==='property'){
    if(!S.world.properties)S.world.properties=[];
    const prop={...clone(item),value:final,city:item.city||S.player.city,status:'własność',owned:true,comfort:item.comfort||50,rooms:item.rooms||1,expansions:0};
    S.world.properties.push(prop);
    if(!S.properties)S.properties=[];
    S.properties.push(prop);
  }
  for(const [k,v] of Object.entries(item.effects||{})){
    if(k==='ovr')S.player.ovr=clamp(S.player.ovr+v,1,99);
    else if(k==='popularity')S.player.popularity=clamp(S.player.popularity+v,0,100);
    else S.player[k]=clamp((S.player[k]||0)+v,0,100);
  }
  if(type==='shoes'){
    ensureBootState(item);
    const owned=clone(item);
    owned.wear=0;
    if(!S.world.shoes.some(x=>x.id===owned.id)) S.world.shoes.push(owned);
    if(!S.world.activeBootId) S.world.activeBootId=owned.id;
  }
  if(item.deal && !S.world.brandDeals.includes(item.deal))S.world.brandDeals.push(item.deal);
  addHistory('Zakup: '+item.name,`Kupiono ${item.name}.`,'- '+final+' • wpływ zależny od przedmiotu');
  save();render();
}
function selectTransport(mode){
  const t=WORLD_CATALOG.transport.find(x=>x.id===mode); if(!t)return;
  if(t.requires==='bike'&&!S.world.transport.ownedBike)return alert('Najpierw musisz posiadać rower.');
  if(t.requires==='car'&&!S.world.transport.ownedCar)return alert('Najpierw musisz posiadać samochód.');
  S.world.transport.mode=mode;
  S.world.transport.travelSpeed=t.speed;
  S.world.transport.monthlyCost=t.price;
  addHistory('Transport',`Dojeżdżasz na aktywności: ${t.name}.`,'wpływ na czas dojazdu');
  save();render();
}

function cityMarketMultiplier(city){
  const n=(city||'').toLowerCase();
  const major=['london','paris','madrid','barcelona','rome','milan','munich','berlin','new york','los angeles','tokyo','dubai','singapore','zurich','amsterdam','sydney'];
  if(major.some(x=>n.includes(x)))return 1.35;
  const regional=['warszawa','kraków','krakow','wrocław','wroclaw','poznań','poznan','gdańsk','gdansk','manchester','lisbon','porto','valencia','napoli','turin'];
  if(regional.some(x=>n.includes(x)))return 1.12;
  return 0.88;
}
function marketCycle(){
  const d=new Date(S.day.date+'T12:00:00');
  return d.getFullYear()*12+d.getMonth();
}
function dynamicStoreCatalog(type){
  const city=S.player.city||'Miejscowość'; const mult=cityMarketMultiplier(city); const cycle=marketCycle();
  const brands={shoes:['Nike','adidas','Puma','New Balance','Under Armour','Asics','Mizuno','Joma','Umbro','Hummel'],clothes:['Nike','adidas','Puma','Under Armour','New Balance','Jordan','Levi’s','Zara','H&M','Uniqlo','The North Face','Lacoste'],electronics:['Apple','Samsung','Sony','Xiaomi','Google','Lenovo','Asus','Acer','LG','Nintendo','Meta','Bose','JBL'],equipment:['Garmin','Apple','Samsung','GoPro','DJI','Sony','Canon','Yamaha','Pioneer','Wilson','Adidas','Nike']};
  const arr=[];
  if(type==='shoes'){
    const models=['Speed','Control','Ultra','Future','Mercurial','Phantom','Predator','Tiempo','Furon','Morelia','Copa','King','Academy','Elite','Pro','Ultimate','Match'];
    brands.shoes.forEach((b,i)=>models.slice(0,10).forEach((m,j)=>arr.push({id:`dynshoe_${cycle}_${i}_${j}`,name:`${b} ${m}`,brand:b,price:Math.round((55+i*15+j*24)*mult),quality:2+(j%9),attributes:{speed:2+(j%8),control:2+((j+2)%8),shooting:1+((j+4)%8),comfort:3+((j+1)%7),grip:2+((j+3)%8)},effects:{form:1+(j%5)*.3,ovr:j>6?.15:0},deal:b.toLowerCase()})));
  } else if(type==='clothes'){
    const items=['Koszulka treningowa','Bluza','Kurtka','Spodnie treningowe','Dres','Szorty','Koszulka meczowa','Koszulka casual','Jeansy','Buty lifestyle','Sneakersy','Czapka','Plecak','Saszetka','Garnitur','Kurtka zimowa','Płaszcz','Bielizna sportowa','Skarpety','Kostium kąpielowy','Piżama','Strój reprezentacyjny','Strój klubowy'];
    brands.clothes.forEach((b,i)=>items.forEach((it,j)=>arr.push({id:`dyncloth_${cycle}_${i}_${j}`,name:`${b} ${it}`,brand:b,price:Math.round((35+i*15+j*12)*mult),effects:{mental:1+(j%3===0?1:0)},deal:b.toLowerCase()})));
  } else if(type==='electronics'){
    const items=['Smartfon','Laptop','Tablet','Smartwatch','Słuchawki','Telewizor','Konsola','Gogle VR','Aparat','Kamera','Monitor','Głośnik','Mikrofon','Router','Powerbank'];
    brands.electronics.forEach((b,i)=>items.slice(0,7).forEach((it,j)=>arr.push({id:`dynelec_${cycle}_${i}_${j}`,name:`${b} ${it}`,brand:b,price:Math.round((120+i*90+j*75)*mult),effects:{mental:j%4===0?1:0},deal:b.toLowerCase()})));
  } else if(type==='equipment'){
    const items=['GPS sportowy','Kamera sportowa','Dron','Aparat','Mikrofon','Kontroler DJ','Słuchawki DJ','Piłka treningowa','Rakieta','Mata treningowa','Sprzęt regeneracyjny'];
    brands.equipment.forEach((b,i)=>items.slice(0,5).forEach((it,j)=>arr.push({id:`dynequip_${cycle}_${i}_${j}`,name:`${b} ${it}`,brand:b,price:Math.round((80+i*55+j*45)*mult),effects:{form:j%3===0?1:0},deal:b.toLowerCase()})));
  } else if(type==='property'){
    const local=cityMarketMultiplier(city); const base=[['Pokój / mikrokawalerka',1,220],['Kawalerka',1,120000],['Mieszkanie 2-pokojowe',2,220000],['Mieszkanie 3-pokojowe',3,310000],['Mieszkanie 4-pokojowe',4,430000],['Apartament',3,650000],['Penthouse',5,1500000],['Dom szeregowy',5,600000],['Dom z ogrodem',6,850000],['Duży dom rodzinny',8,1250000],['Willa',10,2400000],['Rezydencja',14,5000000],['Działka budowlana',0,180000],['Działka rekreacyjna',0,90000],['Lokal użytkowy',0,300000],['Biuro',0,250000],['Apartament wakacyjny',2,450000],['Dom wakacyjny',5,1100000]];
    base.forEach((x,i)=>arr.push({id:`dynprop_${cycle}_${i}_${city}`,name:x[0],city,rooms:x[1],price:Math.round(x[2]*local),type:'property',marketCycle:cycle,expandable:i>=1,comfort:45+i*3}));
  } else if(type==='cars'){
    const makers=[['Toyota',80000],['Volkswagen',85000],['Skoda',70000],['Ford',75000],['Honda',80000],['Mazda',95000],['BMW',220000],['Mercedes-Benz',250000],['Audi',230000],['Volvo',210000],['Tesla',190000],['Lexus',300000],['Porsche',500000],['Ferrari',1200000],['Lamborghini',1400000],['Land Rover',420000],['Jeep',180000],['Hyundai',90000],['Kia',85000],['Renault',65000],['Peugeot',70000],['Fiat',55000]];
    const models=['miejski','hatchback','sedan','kombi','SUV','coupe','cabrio','elektryk','hybryda'];
    makers.forEach((m,i)=>models.slice(0,5).forEach((model,j)=>arr.push({id:`dyncar_${cycle}_${i}_${j}`,name:`${m[0]} ${model}`,brand:m[0],price:Math.round(m[1]*(1+j*.28)*mult),comfort:2+j,speed:2+(j%4),marketCycle:cycle,deal:m[0].toLowerCase()})));
    if(cycle%3===0) arr.push({id:`dyncar_new_${cycle}`,name:'Nowość rynkowa — model limitowany',brand:'Nowa marka',price:Math.round(380000*mult),comfort:8,speed:8,marketCycle:cycle});
  }
  return arr;
}
function getStoreCatalog(type){
  const dynamic=['shoes','clothes','electronics','equipment','property','cars'];
  if(dynamic.includes(type)){
    const generated=dynamicStoreCatalog(type);
    WORLD_CATALOG[type]=generated.concat(WORLD_CATALOG[type]||[]);
    return generated;
  }
  return WORLD_CATALOG[type]||[];
}
function expandProperty(index){
  const p=S.world.properties?.[index]; if(!p)return;
  const cost=Math.round((p.price||p.value||100000)*0.12);
  if((S.player.money||0)<cost){toast('Brakuje pieniędzy na rozbudowę.');return;}
  S.player.money-=cost; p.value=(p.value||p.price||100000)+Math.round(cost*.75); p.comfort=Math.min(100,(p.comfort||50)+8); p.rooms=(p.rooms||1)+1; p.expansions=(p.expansions||0)+1;
  addHistory('Rozbudowa nieruchomości',`Rozbudowano ${p.name} w ${p.city}.`,`-${cost} • +komfort • +1 pomieszczenie`); save(); render();
}
function openWorldCatalog(type){
  const list=getStoreCatalog(type);
  const title={shoes:'👟 Korki i obuwie',clothes:'👕 Ubrania',gifts:'🎁 Prezenty',specialists:'🩺 Specjaliści',languages:'🌍 Języki',education:'🎓 Edukacja',licenses:'🪪 Licencje',property:'🏠 Nieruchomości',cars:'🚗 Samochody',businesses:'💼 Biznes',investments:'📈 Inwestycje',electronics:'📱 Elektronika',equipment:'🎮 / 🎥 Sprzęt'}[type]||'Katalog';
  openModal(`<div class="modal-head"><div><div class="eyebrow">KATALOG</div><h2>${title}</h2></div><button class="close" onclick="closeModal()">✕</button></div>
  <div class="list">${list.map(x=>{
    const cost=x.price||x.cost||0;
    return `<div class="history-item"><div class="row"><b>${esc(x.name)}</b><span class="badge">${cost?cost:'bezpłatne'}</span></div>
    <div class="muted small">${esc(x.brand||x.type||x.description||'Różne właściwości i możliwe konsekwencje.')}</div>
    <button class="btn" style="margin-top:8px" onclick="buyWorldItem('${type}','${x.id}')">Wybierz / kup</button></div>`}).join('')}</div>`,true);
}

function render(){
 document.body.classList.remove('busy');
 renderTop();renderMenu();setTabs();
 let out='';
 switch(current){
  case 'day':out=renderDay();break;case 'career':out=renderCareer();break;case 'stats':out=renderStats();break;
  case 'life':out=renderLife();break;case 'family':out=renderFamily();break;case 'relations':out=renderRelations();break;
  case 'history':out=renderHistory();break;case 'flgram':out=renderFlgram();break;case 'finance':out=renderFinance();break;
  case 'shop':out=renderShop();break;case 'education':out=renderEducation();break;case 'licenses':out=renderLicenses();break;
  case 'specialists':out=renderSpecialists();break;case 'calendar':out=renderCalendar();break;case 'secondary':out=renderSecondary();break;
  case 'settings':out=renderSettings();break;case 'code':out=renderCode();break;
  default:out=renderDay();
 }
 document.getElementById('main').innerHTML=out;
}
function openModal(html,full=false){const m=document.getElementById('modal'),s=document.getElementById('modalSheet');s.innerHTML=html;m.classList.toggle('full',full);m.classList.add('show')}
function closeModal(){
  if(window.pendingEvent) return;
  document.getElementById('modal').classList.remove('show');
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
document.getElementById('modal').addEventListener('click',e=>{
  if(e.target.id==='modal' && !window.pendingEvent) closeModal();
});
render();
</script>
<script id="responsive-fl-life-js">

function closeSideMenu(){const m=document.getElementById('sideMenu'),b=document.getElementById('mobileMenuBackdrop');if(m)m.classList.remove('open');if(b)b.classList.remove('open')}

function navigateTo(k){closeSideMenu();const map={today:'day',calendar:'calendar',family:'family',relations:'relations',career:'career',matches:'matches',scouts:'scouts',transfers:'transfers',attributes:'attributes',education:'education',licenses:'licenses',sidecareer:'sidecareer',finances:'finances',shop:'shop',property:'property',cars:'cars',flgram:'flgram',messages:'messages',history:'history',settings:'settings',code:'code'};const key=map[k]||k;if(typeof showPage==='function')return showPage(key);if(typeof renderPage==='function')return renderPage(key);if(typeof navigate==='function')return navigate(key);const el=document.querySelector('[data-page="'+key+'"],[data-target="'+key+'"]');if(el)el.click()}

<script id="game-mode-fixes">
function startNewGame(){S.gameMode='auto';if(!confirm('Rozpocząć zupełnie nową karierę?'))return;localStorage.removeItem('fl-life-27-etap3');location.reload()}
function startNewGamePlus(){S.gameMode='plus';if(!confirm('Rozpocząć Nową Grę+? Zachowamy wybrane dziedzictwo poprzedniej kariery.'))return;const old=localStorage.getItem('fl-life-27-etap3');let legacy={};try{legacy=old?JSON.parse(old):{}}catch(e){}localStorage.setItem('fl-life-27-ngplus-legacy',JSON.stringify({savedAt:Date.now(),history:legacy.history||[],consequenceLedger:legacy.consequenceLedger||[],worldFlags:legacy.worldFlags||{},lifeTags:legacy.lifeTags||[]}));localStorage.removeItem('fl-life-27-etap3');location.reload()}

<script id="fl-life-startscreen-js">
(function(){
  const SLOT_PREFIX='FL_LIFE_27_SLOT_';
  const start=document.getElementById('flStartScreen');
  const logo=document.querySelector('.topbar .logo');
  const startLogo=document.getElementById('flStartLogo');
  if(startLogo && logo) startLogo.src=logo.src;

  const hasSave=!!localStorage.getItem(SLOT_PREFIX + (localStorage.getItem('FL_LIFE_27_LAST_SLOT')||'1')) || !!localStorage.getItem(KEY);
  const continueBtn=start?.querySelector('.fl-start-btn.primary');
  if(continueBtn && !hasSave){
    continueBtn.disabled=true;
    const d=document.getElementById('flContinueDesc');
    if(d)d.textContent='Brak zapisanej kariery — rozpocznij nową grę';
  }

  const stages=[
    [8,'Uruchamianie silnika gry…'],
    [20,'Ładowanie świata…'],
    [34,'Wczytywanie krajów i miejscowości…'],
    [49,'Przygotowywanie bazy postaci…'],
    [63,'Ładowanie kariery i reprezentacji…'],
    [77,'Ładowanie relacji i wydarzeń…'],
    [89,'Przygotowywanie miasta i rynku…'],
    [97,'Sprawdzanie zapisów…'],
    [100,'Gotowe']
  ];
  let i=0;
  function stage(){
    if(!start)return;
    const [pct,msg]=stages[i++];
    const bar=document.getElementById('flLoadBar'), p=document.getElementById('flLoadPct'), s=document.getElementById('flLoadStatus');
    if(bar)bar.style.width=pct+'%';
    const runner=document.getElementById('flLoadRunner');
    if(runner){
      const safePct=Math.max(2,Math.min(98,pct));
      runner.style.left=safePct+'%';
    }
    if(p)p.textContent=pct+'%';
    if(s)s.textContent=msg;
    if(pct<100){setTimeout(stage,150+Math.random()*230)}
    else{
      setTimeout(()=>{
        document.getElementById('flStartMenu')?.classList.add('ready');
      },420);
    }
  }
  window.flCloseStart=function(){
    start?.classList.add('hidden');
    setTimeout(()=>{if(start)start.style.display='none'},700);
  };
  window.flStartContinue=function(){
    const last=Number(localStorage.getItem('FL_LIFE_27_LAST_SLOT')||0);
    if(last && localStorage.getItem(SLOT_PREFIX+last)){flLoadSlot(last);return;}
    if(!localStorage.getItem(KEY)){toast('Nie masz jeszcze zapisanej kariery.');return;}
    flCloseStart(); current='day'; render();
  };
  window.flStartNewGame=function(){
    flCloseStart();
    setTimeout(()=>startNewGame(),150);
  };
  window.flStartNewGamePlus=function(){
    flCloseStart();
    setTimeout(()=>startNewGamePlus(),150);
  };
  window.flStartSettings=function(){
    flCloseStart();
    setTimeout(()=>{current='settings';render()},200);
  };
  window.flOpenLoad=function(){
    const saved=localStorage.getItem(KEY);
    openModal(`<div class="modal-head"><div><div class="eyebrow">💾 ZAPISY GRY</div><h2>Wczytaj grę</h2></div><button class="close" onclick="closeModal()">✕</button></div>
      <div class="history-item" style="margin-top:14px">
        <div class="row"><b>📁 Ostatni zapis na tym urządzeniu</b><span class="badge">${saved?'Dostępny':'Brak'}</span></div>
        <div class="muted small" style="margin-top:6px">${saved?'Możesz wrócić do ostatniej zapisanej kariery.':'Nie znaleziono zapisu.'}</div>
        ${saved?'<button class="btn goldbtn" style="margin-top:10px" onclick="flLoadLocalSave()">▶️ Wczytaj ostatni zapis</button>':''}
      </div>
      <div class="divider"></div>
      <div class="history-item">
        <b>📦 Wczytaj kopię zapasową</b>
        <div class="muted small" style="margin-top:6px">Wybierz plik JSON zapisany wcześniej z FL Life 27.</div>
        <input id="flSaveFile" type="file" accept=".json,application/json" class="input" style="margin-top:10px" onchange="flImportSave(event)">
      </div>`,true);
  };
  window.flLoadLocalSave=function(){
    if(!localStorage.getItem(KEY)){toast('Brak zapisu.');return;}
    closeModal();flCloseStart();current='day';render();toast('💾 Wczytano ostatnią karierę.');
  };
  window.flImportSave=function(e){
    const file=e.target.files?.[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=function(){
      try{
        const data=JSON.parse(reader.result);
        if(!data || !data.player || !data.day) throw new Error('invalid');
        localStorage.setItem(KEY,JSON.stringify(data));
        closeModal();
        location.reload();
      }catch(err){toast('Nieprawidłowy plik zapisu FL Life 27.');}
    };
    reader.readAsText(file);
  };
  window.addEventListener('load',()=>setTimeout(stage,520),{once:true});
})();
</script>

<script id="fl-life-save-slots">
(function(){
  const SLOT_PREFIX='FL_LIFE_27_SLOT_';
  const META_KEY='FL_LIFE_27_SLOT_META';
  const MAX_SLOTS=5;
  function slotMeta(){try{return JSON.parse(localStorage.getItem(META_KEY)||'[]')}catch(e){return[]}}
  function setMeta(a){localStorage.setItem(META_KEY,JSON.stringify(a))}
  function slotKey(n){return SLOT_PREFIX+n}
  function saveSlot(n,data){
    localStorage.setItem(slotKey(n),JSON.stringify(data));
    const a=slotMeta().filter(x=>x.slot!==n);
    a.push({slot:n,name:data?.player?.name||`Kariera ${n}`,city:data?.player?.city||'',age:data?.player?.age||'',updated:new Date().toLocaleString('pl-PL')});
    setMeta(a);
    localStorage.setItem('FL_LIFE_27_LAST_SLOT',String(n));
  }
  function getSlot(n){try{const s=localStorage.getItem(slotKey(n));return s?JSON.parse(s):null}catch(e){return null}}
  window.flGetSaveSlots=function(){return Array.from({length:MAX_SLOTS},(_,i)=>({slot:i+1,data:getSlot(i+1),meta:slotMeta().find(x=>x.slot===i+1)||null}))};
  window.flSaveCurrentToSlot=function(n){
    if(!S?.player)return;
    saveSlot(n,S);
    if(typeof toast==='function')toast(`💾 Zapisano karierę w slocie ${n}.`);
  };
  window.flLoadSlot=function(n){
    const d=getSlot(n);if(!d){if(typeof toast==='function')toast('Ten slot jest pusty.');return;}
    localStorage.setItem(KEY,JSON.stringify(d));
    localStorage.setItem('FL_LIFE_27_LAST_SLOT',String(n));
    location.reload();
  };
  window.flDeleteSlot=function(n){
    localStorage.removeItem(slotKey(n));
    setMeta(slotMeta().filter(x=>x.slot!==n));
    if(typeof toast==='function')toast(`Usunięto zapis z slotu ${n}.`);
    if(typeof flOpenLoad==='function')flOpenLoad();
  };
  window.flSaveAs=function(){
    const slots=flGetSaveSlots();
    openModal(`<div class="modal-head"><div><div class="eyebrow">💾 ZAPISZ KARIERĘ</div><h2>Wybierz slot</h2><div class="muted">5 niezależnych karier</div></div><button class="close" onclick="closeModal()">✕</button></div>
    <div class="list">${slots.map(s=>`<div class="history-item"><div class="row"><b>Slot ${s.slot}</b><span class="badge">${s.data?'ZAJĘTY':'PUSTY'}</span></div>${s.data?`<div class="muted small">${esc(s.meta?.name||s.data.player?.name||'Kariera')} • ${esc(s.meta?.city||s.data.player?.city||'')} • ${s.meta?.updated||''}</div>`:'<div class="muted small">Brak zapisanej kariery</div>'}<button class="btn goldbtn" style="margin-top:9px" onclick="flSaveCurrentToSlot(${s.slot});closeModal()">💾 Zapisz tutaj</button></div>`).join('')}</div>`,true);
  };
  window.flOpenSlots=function(){
    const slots=flGetSaveSlots();
    openModal(`<div class="modal-head"><div><div class="eyebrow">💾 WCZYTAJ GRĘ</div><h2>Twoje kariery</h2><div class="muted">Możesz mieć maksymalnie 5 różnych zapisów.</div></div><button class="close" onclick="closeModal()">✕</button></div>
    <div class="list">${slots.map(s=>`<div class="history-item"><div class="row"><b>Slot ${s.slot}</b><span class="badge">${s.data?'ZAJĘTY':'PUSTY'}</span></div>${s.data?`<div style="margin-top:6px"><b>${esc(s.meta?.name||s.data.player?.name||'Kariera')}</b><div class="muted small">${esc(s.meta?.city||s.data.player?.city||'')} • wiek ${s.meta?.age||s.data.player?.age||'?'} • ${s.meta?.updated||''}</div></div><div style="display:flex;gap:7px;margin-top:9px"><button class="btn goldbtn" onclick="flLoadSlot(${s.slot})">▶️ Wczytaj</button><button class="btn" onclick="flDeleteSlot(${s.slot})">🗑️ Usuń</button></div>`:'<div class="muted small" style="margin-top:6px">Ten slot jest wolny.</div>'}</div>`).join('')}</div>`,true);
  };
  window.flLastPlayedSlot=function(){return Number(localStorage.getItem('FL_LIFE_27_LAST_SLOT')||0)};
})();
</script>
