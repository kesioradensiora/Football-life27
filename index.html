<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FL LIFE 27</title>
<style>
:root{--bg:#101315;--bg2:#171b1d;--panel:#1b2022;--panel2:#22282a;--line:#394043;--text:#f4f2eb;--muted:#9aa1a2;--gold:#d7ad54;--gold2:#f0cf7a;--red:#d65b55;--green:#65c68c;--blue:#72a7d9;--shadow:0 22px 70px #0009}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:radial-gradient(circle at 75% 0,#27302d 0,#15191b 32%,#101315 70%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.4;cursor:not-allowed}
body{overflow-x:hidden} .hidden{display:none!important}
#app{min-height:100vh} .shell{min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;background:linear-gradient(180deg,#171c1e 0,#111517 100%);border-right:1px solid var(--line);z-index:20}
.brand{padding:3px 7px 18px;border-bottom:1px solid #303638;margin-bottom:13px} .brand img{width:205px;height:auto;display:block;filter:drop-shadow(0 12px 22px #0009)}
.brand small{display:block;margin:8px 0 0;color:#7e8788;letter-spacing:.16em;font-size:9px;text-transform:uppercase}
.nav{display:grid;gap:4px} .nav button{border:0;background:transparent;padding:11px 12px;text-align:left;display:flex;gap:12px;align-items:center;border-left:3px solid transparent;color:#aeb4b4;border-radius:0 10px 10px 0} .nav button:hover{background:#202628;color:#fff} .nav button.active{background:linear-gradient(90deg,#292722,#1f2526);border-left-color:var(--gold);color:#fff} .nav .ico{width:22px;text-align:center;font-size:15px}
.staff-mini{margin-top:15px;border:1px solid #353d40;background:#1a2022;padding:12px;border-radius:14px} .staff-mini .line{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:5px 0;color:#9ea6a6} .staff-mini b{color:#eee}
.content{min-width:0} .top{height:76px;position:sticky;top:0;z-index:15;background:#151a1ce8;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 26px} .top-left{display:flex;align-items:center;gap:14px} .hamb{display:none;border:1px solid var(--line);background:#202628;border-radius:10px;padding:9px} .avatar{width:44px;height:44px;border:1px solid #4b5355;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#3a4142,#181c1e);font-weight:900} .top-name b{display:block} .top-name small{color:var(--muted)} .pills{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end} .pill{border:1px solid #3a4244;background:#202628;padding:7px 10px;font-size:11px;border-radius:8px;color:#aeb4b5} .pill b{color:#fff;margin-left:4px}
.main{max-width:1600px;margin:0 auto;padding:28px} .hero{position:relative;overflow:hidden;min-height:260px;border:1px solid #485052;background:linear-gradient(135deg,#252b2c 0,#1b2021 55%,#24251d 100%);box-shadow:var(--shadow);padding:32px;clip-path:polygon(0 0,97% 0,100% 13%,100% 100%,3% 100%,0 87%)} .hero:before{content:"";position:absolute;right:-100px;bottom:-180px;width:520px;height:520px;border:1px solid #d7ad5424;border-radius:50%;box-shadow:0 0 0 50px #d7ad5406,0 0 0 100px #d7ad5404} .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,transparent 0 54%,#d7ad5410 54.5% 55%,transparent 55.5%);pointer-events:none} .hero>*{position:relative;z-index:1} .eyebrow{font-size:10px;color:var(--gold2);letter-spacing:.22em;text-transform:uppercase;font-weight:900} h1{font-size:clamp(32px,5vw,64px);line-height:.92;letter-spacing:-.055em;margin:10px 0 14px;max-width:850px} h2{margin:0 0 8px;font-size:24px} h3{margin:0 0 6px} .muted{color:var(--muted)}
.hero-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:22px;align-items:end} .hero-player{display:flex;align-items:center;gap:16px} .hero-ovr{font-size:70px;font-weight:950;line-height:.8;color:#fff} .hero-ovr small{display:block;font-size:10px;color:var(--gold);letter-spacing:.14em}
.section{margin-top:20px} .section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px} .grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:linear-gradient(160deg,#202628,#191e20);border:1px solid #3b4446;box-shadow:0 12px 35px #0005;padding:18px;position:relative;overflow:hidden} .card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border:1px solid #d7ad5410;transform:rotate(35deg)} .cut{clip-path:polygon(0 0,96% 0,100% 12%,100% 100%,4% 100%,0 88%)} .metric{padding:16px;border:1px solid #3a4244;background:#1a2022} .metric span{display:block;color:#7f898a;font-size:9px;text-transform:uppercase;letter-spacing:.15em} .metric b{display:block;font-size:28px;margin-top:5px} .metric small{color:#9ba2a3}
.btn{border:1px solid #465052;background:#242b2d;padding:10px 14px;border-radius:7px;font-weight:850;transition:.15s;box-shadow:0 5px 18px #0003} .btn:hover{transform:translateY(-1px);border-color:#697477} .btn.gold{background:linear-gradient(135deg,#e5c76f,#9a7434);border-color:#d7ad54;color:#17130b} .btn.red{background:#3a2020;border-color:#70403d} .btn.green{background:#1d3025;border-color:#3f6d4d} .btn.blue{background:#202d39;border-color:#46647e} .actions{display:flex;flex-wrap:wrap;gap:8px} .badge{display:inline-flex;align-items:center;border:1px solid #424a4c;background:#242a2c;border-radius:999px;padding:5px 9px;font-size:10px;color:#d1d5d5} .badge.gold{border-color:#6b582e;color:#f0cf7a;background:#2a2519} .badge.red{color:#ff9b95;border-color:#6c3733;background:#322020} .badge.green{color:#8ce3ac;border-color:#3b694d;background:#1e2b23}
.bar{height:7px;background:#303638;overflow:hidden;border-radius:99px} .bar i{display:block;height:100%;background:linear-gradient(90deg,#8c6a30,var(--gold2))} .list{display:grid;gap:9px} .item{background:#191e20;border:1px solid #353e40;padding:13px} .row{display:flex;justify-content:space-between;align-items:center;gap:12px} .divider{height:1px;background:#333b3d;margin:14px 0}
.table{width:100%;border-collapse:collapse} .table th,.table td{padding:10px;border-bottom:1px solid #30383a;text-align:left} .table th{font-size:9px;color:#7f898a;text-transform:uppercase;letter-spacing:.12em}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid #3a4244;overflow:hidden} .calh,.cald{padding:9px;border-right:1px solid #30383a;border-bottom:1px solid #30383a;min-height:108px} .calh{min-height:0;background:#252b2d;color:#8c9596;font-size:9px;text-transform:uppercase} .cald.today{background:#2a281d;box-shadow:inset 0 0 0 1px #927338} .event{display:block;margin-top:5px;padding:4px 6px;background:#26333c;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .event.gold{background:#3b311e} .event.red{background:#3b2423}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px} .tabs .btn{white-space:nowrap} .modal{position:fixed;inset:0;z-index:100;background:#080a0bd9;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:18px} .modal.show{display:flex} .sheet{width:min(920px,100%);max-height:90vh;overflow:auto;background:#1a2022;border:1px solid #4a5355;box-shadow:0 30px 100px #000e;padding:22px;clip-path:polygon(0 0,98% 0,100% 8%,100% 100%,2% 100%,0 92%)} .close{float:right;border:1px solid #3d4547;background:#242b2d;padding:7px 10px;border-radius:6px} .toast{position:fixed;right:22px;bottom:22px;z-index:150;background:#222a2c;border:1px solid #596365;padding:13px 16px;box-shadow:var(--shadow);display:none;max-width:380px} .toast.show{display:block}
.start{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 75% 15%,#313726 0,#161b1c 35%,#0d1012 80%);display:grid;place-items:center;padding:20px} .startbox{width:min(1100px,100%);padding:42px;border:1px solid #4b5456;background:#171b1deF;box-shadow:0 40px 120px #000e;clip-path:polygon(0 0,97% 0,100% 9%,100% 100%,3% 100%,0 91%)} .start img{display:block;width:min(620px,88vw);margin:0 auto 28px;filter:drop-shadow(0 18px 40px #000b)} .start-grid{display:grid;grid-template-columns:1fr .8fr;gap:22px} .start-copy h1{font-size:clamp(38px,6vw,76px)} .start-actions{display:flex;gap:10px;flex-wrap:wrap} .start-note{padding:15px;border-left:3px solid var(--gold);background:#202628;color:#adb4b4}
.field{display:grid;gap:6px} .field label{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:#7f898a} .field input,.field select{background:#131719;color:#fff;border:1px solid #3b4446;padding:11px;border-radius:6px} .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.agent{display:grid;grid-template-columns:70px 1fr auto;gap:15px;align-items:center;padding:15px;border:1px solid #3a4345;background:#1b2123} .stars{color:var(--gold2);letter-spacing:2px} .garage-img,.home-img{height:170px;background:linear-gradient(135deg,#303839,#171c1e);display:grid;place-items:center;font-size:70px;margin:-18px -18px 14px} .skill{display:grid;grid-template-columns:110px 1fr 42px;gap:10px;align-items:center;margin:8px 0} .skill span{font-size:11px} .skill b{text-align:right} .alert{padding:13px 14px;border-left:3px solid var(--gold);background:#28251d;margin-bottom:9px} .alert.red{border-color:var(--red);background:#2a2020} .alert.green{border-color:var(--green);background:#202a24}
.mobile-nav{display:none}
@media(max-width:980px){.shell{grid-template-columns:1fr}.side{position:fixed;left:-300px;width:285px;transition:.2s;box-shadow:25px 0 80px #000;z-index:80}body.menu-open .side{left:0}.hamb{display:block}.top{padding:10px 14px;height:68px}.main{padding:18px 14px 100px}.hero-grid,.start-grid,.g4,.g3{grid-template-columns:1fr 1fr}.mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;height:70px;background:#151a1ceF;backdrop-filter:blur(18px);border-top:1px solid #3b4345;z-index:70;grid-template-columns:repeat(5,1fr)}.mobile-nav button{background:none;border:0;color:#899293;font-size:9px}.mobile-nav button.active{color:var(--gold2)}.mobile-nav span{display:block;font-size:18px;margin-bottom:3px}.startbox{padding:28px 20px}.start-grid,.form-grid{grid-template-columns:1fr}}
@media(max-width:620px){.pills .pill:nth-child(n+3){display:none}.top-name small{display:none}.hero{padding:25px 20px;min-height:280px}.hero-grid,.g3,.g4,.g2{grid-template-columns:1fr}.hero-ovr{font-size:58px}.calendar{min-width:650px}.calendar-wrap{overflow:auto}.agent{grid-template-columns:52px 1fr}.agent .actions{grid-column:1/-1}}
</style></head>

function money(n){return new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN',maximumFractionDigits:0}).format(n)}
function dateStr(d=game.date){return new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d))}

function advance(min){game.minutes+=min;game.player.energy=Math.max(0,game.player.energy-min*.018);game.player.fatigue=Math.min(100,game.player.fatigue+min*.014);if(game.minutes>=1440){game.minutes-=1440;game.day++;game.date=new Date(new Date(game.date).getTime()+86400000);dailyTick()}}

function mobileNav(){let arr=['home','career','training','calendar','staff'];return `<nav class="mobile-nav">${arr.map(v=>`<button class="${view===v?'active':''}" onclick="go('${v}')"><span>${NAV.find(x=>x[0]===v)?.[1]||'•'}</span>${NAV.find(x=>x[0]===v)?.[2]||v}</button>`).join('')}</nav>`}
function layout(content){return `<div class="shell"><aside class="side"><div class="brand"><img src="${LOGO}"><small>FOOTBALL LIFE · CAREER SIM</small></div><nav class="nav">${nav()}</nav><div class="staff-mini"><div class="row"><b>Sztab</b><span class="badge gold">${game.staff.assistant||game.staff.manager?'AKTYWNY':'BRAK'}</span></div><div class="line"><span>Asystent</span><b>${game.staff.assistant?'✓':'—'}</b></div><div class="line"><span>Menadżer</span><b>${game.staff.manager?'✓':'—'}</b></div></div></aside><main class="content">${top()}<div class="main">${content}</div></main></div>${mobileNav()}<div id="toast" class="toast"></div><div id="modal" class="modal"></div>`}
function homeView(){let alerts=getAlerts();return `<section class="hero"><div class="hero-grid"><div><div class="eyebrow">FL LIFE 27 · CAREER MODE</div><h1>Twoja kariera.<br><span class="goldtext">Twoje decyzje.</span></h1><p class="muted">Nie zarządzasz tabelką. Budujesz życie piłkarza — trening, klub, pieniądze, ludzi, samochód, dom i reputację.</p><div class="actions"><button class="btn gold" onclick="go('training')">ROZPOCZNIJ TRENING</button><button class="btn" onclick="go('calendar')">OTWÓRZ KALENDARZ</button></div></div><div class="hero-player"><div class="hero-ovr">${ovr()}<small>OVR</small></div><div><b>${game.player.position} · ${game.player.age} lat</b><div class="muted">Potencjał ${game.player.potential} · wartość ${money(game.player.marketValue)}</div><div class="bar" style="margin-top:9px"><i style="width:${game.player.form}%"></i></div></div></div></div></section><section class="section"><div class="grid g4"><div class="metric"><span>Klub</span><b>${esc(game.player.club)}</b><small>${esc(game.player.league)}</small></div><div class="metric"><span>Forma</span><b>${game.player.form}</b><small>100 = szczyt</small></div><div class="metric"><span>Zmęczenie</span><b>${Math.round(game.player.fatigue)}%</b><small>${game.player.fatigue>70?'potrzebny odpoczynek':'pod kontrolą'}</small></div><div class="metric"><span>Finanse</span><b>${money(game.money)}</b><small>gotówka</small></div></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">CENTRUM DECYZJI</div><h2>Co dziś ma znaczenie</h2></div><button class="btn" onclick="go('staff')">Sztab →</button></div><div class="grid g3">${alerts.slice(0,3).map(a=>`<div class="alert ${a.type==='red'?'red':a.type==='green'?'green':''}"><b>${a.title}</b><div class="muted" style="margin-top:5px">${a.text}</div></div>`).join('')||'<div class="card"><b>Brak pilnych spraw.</b><div class="muted">Możesz skupić się na treningu, meczu albo odpoczynku.</div></div>'}</div></section><section class="section"><div class="grid g2"><div class="card cut"><div class="eyebrow">DZISIAJ</div><h3>Plan dnia</h3><div class="list"><div class="item row"><span>Godzina</span><b>${timeStr()}</b></div><div class="item row"><span>Energia</span><b>${Math.round(game.player.energy)}%</b></div><div class="item row"><span>Zmęczenie</span><b>${Math.round(game.player.fatigue)}%</b></div></div></div><div class="card cut"><div class="eyebrow">OSTATNIE</div><h3>Historia</h3>${game.history.slice(0,4).map(x=>`<div class="item" style="margin-top:7px"><small class="muted">Dzień ${x.day}</small><div>${esc(x.text)}</div></div>`).join('')||'<div class="muted">Kariera dopiero się zaczyna.</div>'}</div></div></section>`}
function careerView(){return `<div class="section-head"><div><div class="eyebrow">KARIERA</div><h2>Twoja pozycja w świecie piłki</h2></div></div><div class="grid g3"><div class="card cut"><div class="eyebrow">ZAWODNIK</div><h2>${esc(game.player.first)} ${esc(game.player.last)}</h2><p class="muted">${game.player.position} · ${game.player.age} lat · ${game.player.club}</p><div class="grid g2"><div class="metric"><span>OVR</span><b>${ovr()}</b></div><div class="metric"><span>Potencjał</span><b>${game.player.potential}</b></div></div></div><div class="card"><h3>Trener</h3><div class="metric"><span>Zaufanie</span><b>${game.player.coachTrust}%</b></div><button class="btn gold" style="margin-top:10px" onclick="coachTalk()">Porozmawiaj z trenerem</button></div><div class="card"><h3>Agent</h3><p class="muted">${game.agent?esc(game.agent.name):'Nie masz jeszcze agenta.'}</p><button class="btn" onclick="go('agent')">Zarządzaj agentem</button></div></div><section class="section"><div class="card"><h3>Umiejętności</h3>${Object.entries(game.player.skill).map(([k,v])=>`<div class="skill"><span>${skillName(k)}</span><div class="bar"><i style="width:${v}%"></i></div><b>${Math.round(v)}</b></div>`).join('')}</div></section>`}
function skillName(k){return {tempo:'Tempo',technika:'Technika',strzal:'Wykończenie',podania:'Podania',sila:'Siła',wizja:'Wizja',obrona:'Obrona 1v1',mental:'Mental'}[k]||k}
const TRAIN=[['Wykończenie','strzal','Finishing pod presją',35],['Kontrola piłki','technika','Pierwszy kontakt i prowadzenie',40],['Podania i wizja','podania','Decyzje + dokładność',40],['Szybkość','tempo','Start, dynamika, zmiana kierunku',35],['Siła i stabilizacja','sila','Core, nogi, kontakt',45],['Obrona 1v1','obrona','Praca nóg i timing',35],['Mental','mental','Decyzje pod presją',30]];
function trainingView(){return `<div class="section-head"><div><div class="eyebrow">CENTRUM TRENINGOWE</div><h2>Trening indywidualny</h2><p class="muted">Każda sesja kosztuje czas i obciąża organizm. Rozwój jest zmienny — potencjał jest indywidualny dla każdej umiejętności.</p></div></div><div class="grid g2">${TRAIN.map((t,i)=>`<div class="card cut"><div class="row"><div><h3>${t[0]}</h3><div class="muted">${t[2]}</div></div><span class="badge">${t[3]} min</span></div><div class="skill"><span>Poziom</span><div class="bar"><i style="width:${game.player.skill[t[1]]}%"></i></div><b>${Math.round(game.player.skill[t[1]])}</b></div><div class="row"><small class="muted">Potencjał tej cechy: ${game.player.skillPot[t[1]]}</small><button class="btn gold" onclick="train('${t[1]}',${t[3]},'${t[0]}')">TRENUJ</button></div></div>`).join('')}</div><section class="section"><div class="card"><h3>Regeneracja</h3><p class="muted">Odpoczynek przywraca energię i obniża zmęczenie, ale zabiera czas.</p><button class="btn" onclick="rest()">ODPOCZNIJ 90 MIN</button></div></section>`}
function train(skill,min,name){if(!act(min))return;let s=game.player.skill[skill],pot=game.player.skillPot[skill],room=Math.max(0,pot-s),fat=game.player.fatigue;let chance=Math.max(.2,.78-fat/150),gain=room*.018*(.55+Math.random()*.9)*chance;if(Math.random()>.78)gain=0;game.player.skill[skill]=Math.min(pot,s+gain);game.player.form=Math.max(0,Math.min(100,game.player.form+(Math.random()*2-0.7)));game.player.coachTrust=Math.min(100,game.player.coachTrust+.4);game.player.health=Math.max(60,game.player.health-.2);game.player.fatigue=Math.min(100,game.player.fatigue+6);addHist(`Trening: ${name}. ${gain?`+${gain.toFixed(1)} do ${skillName(skill)}`:'bez wzrostu'}.`);save();notify('Trening',gain?`$${gain.toFixed(1)} do ${skillName(skill)}.`:'Dzisiaj bez progresu.');render()}
function rest(){advance(90);game.player.energy=Math.min(100,game.player.energy+20);game.player.fatigue=Math.max(0,game.player.fatigue-18);addHist('Regeneracja i odpoczynek.');save();render()}
function calendarView(){let start=new Date(game.date);start.setDate(1);let first=start.getDay();first=(first+6)%7;let days=new Date(start.getFullYear(),start.getMonth()+1,0).getDate();let cells='';['Pn','Wt','Śr','Cz','Pt','Sb','Nd'].forEach(x=>cells+=`<div class="calh">${x}</div>`);for(let i=0;i<first;i++)cells+=`<div class="cald"></div>`;for(let d=1;d<=days;d++){let today=d===game.date.getDate();let ev=game.calendar.filter(e=>e.day===d);cells+=`<div class="cald ${today?'today':''}"><b>${d}</b>${ev.map(e=>`<span class="event ${e.type==='match'?'red':e.type==='staff'?'gold':''}">${esc(e.title)}</span>`).join('')}</div>`}return `<div class="section-head"><div><div class="eyebrow">KALENDARZ</div><h2>${new Intl.DateTimeFormat('pl-PL',{month:'long',year:'numeric'}).format(game.date)}</h2></div><button class="btn" onclick="addReminder()">+ DODAJ TERMIN</button></div><div class="card calendar-wrap"><div class="calendar">${cells}</div></div><section class="section"><div class="card"><h3>Najbliższe</h3>${game.calendar.slice(0,8).map(e=>`<div class="item row"><span>${e.title}</span><span class="badge">${e.day}. dnia miesiąca</span></div>`).join('')||'<div class="muted">Brak wpisów.</div>'}</div></section>`}
function addReminder(){game.calendar.push({day:Math.min(28,game.date.getDate()+3),title:'Rozmowa z trenerem',type:'staff'});save();notify('Kalendarz','Dodano przypomnienie.');render()}
function eventsView(){return `<div class="section-head"><div><div class="eyebrow">MIASTO ŻYJE</div><h2>Wydarzenia</h2><p class="muted">Nie tylko mecze. Koncerty, gale, teatr, festiwale i sport.</p></div></div><div class="grid g3">${EVENTS.map((e,i)=>`<div class="card cut"><div style="font-size:48px">${e[4]}</div><div class="eyebrow">${e[1]}</div><h3>${e[0]}</h3><div class="row"><span class="muted">${e[2]}</span><b>${e[3]===0?'Darmowe':money(e[3])}</b></div><button class="btn gold" style="margin-top:12px" onclick="buyEvent(${i})">KUP BILET</button></div>`).join('')}</div>`}
function buyEvent(i){let e=EVENTS[i];if(!spend(e[3]))return;game.calendar.push({day:Math.min(28,game.date.getDate()+5),title:e[0],type:'event'});addHist(`Kupiono bilet: ${e[0]}.`);save();notify('Bilet','Dodano wydarzenie do kalendarza.');render()}
function cityView(){return `<div class="section-head"><div><div class="eyebrow">MAPA MIASTA</div><h2>Twoje otoczenie</h2></div></div><div class="card" style="min-height:520px;background:linear-gradient(135deg,#28302e,#1a201f);position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:repeating-linear-gradient(38deg,transparent 0 58px,#66706d20 59px 62px),repeating-linear-gradient(138deg,transparent 0 72px,#66706d18 73px 76px)"></div>${[['Dom',18,22,'⌂'],['Klub',61,17,'⚽'],['Sklep',38,60,'▣'],['Salon',72,55,'✦'],['Bank',16,75,'₽'],['Stadion',77,78,'★']].map(p=>`<button class="btn" style="position:absolute;left:${p[1]}%;top:${p[2]}%;transform:translate(-50%,-50%);background:#202729dd;border-color:#d7ad5466" onclick="toast('${p[0]} — lokalizacja na mapie')">${p[3]} ${p[0]}</button>`).join('')}</div>`}
function transferView(){let base=ovr();let clubs=[['Warta Poznań',62,70000],['Lech Poznań U19',70,150000],['Pogoń Szczecin U19',68,120000],['Śląsk Wrocław U19',66,105000],['Borussia U19',78,400000]];return `<div class="section-head"><div><div class="eyebrow">RYNEK TRANSFEROWY</div><h2>Zainteresowanie klubów</h2><p class="muted">Nie możesz po prostu wybrać dowolnego klubu. Zainteresowanie wynika z poziomu, formy, zaufania, pozycji i wyników.</p></div><button class="btn gold" onclick="scout()">SKAUTUJ RYNEK</button></div><div class="grid g2">${clubs.map(c=>{let fit=Math.round((base/c[1])*65+game.player.form*.15+game.player.coachTrust*.1+game.player.popularity*.5);let ok=fit>=72;return `<div class="card cut"><div class="row"><div><h3>${c[0]}</h3><div class="muted">Wymagany poziom około ${c[1]}</div></div><span class="badge ${ok?'green':'red'}">${ok?'ZAINTERESOWANIE':'OBSERWUJĄ'}</span></div><div class="skill"><span>Dopasowanie</span><div class="bar"><i style="width:${Math.min(100,fit)}%"></i></div><b>${Math.min(100,fit)}%</b></div><div class="row"><small class="muted">Szac. wartość ${money(c[2])}</small><button class="btn" onclick="transferAsk('${c[0]}',${ok})">SPRAWDŹ</button></div></div>`}).join('')}</div>`}
function scout(){if(!act(45,60))return;game.player.popularity=Math.min(100,game.player.popularity+.3);addHist('Skauting rynku transferowego.');save();notify('Skauting','Raporty klubów zostały odświeżone.');render()}
function transferAsk(club,ok){if(!ok){toast('Klub jeszcze nie jest gotowy na ofertę. Rozwijaj profil i wyniki.');return}game.calendar.push({day:Math.min(28,game.date.getDate()+6),title:'Kontakt: '+club,type:'match'});addHist(`Pojawił się kontakt z klubem ${club}.`);save();notify('Kontakt transferowy',club);render()}
function agentView(){return `<div class="section-head"><div><div class="eyebrow">REPRESENTATION</div><h2>Agenci piłkarscy</h2><p class="muted">Sprawdź firmę, reputację, licencję i ryzyko zanim podpiszesz umowę.</p></div></div>${game.agent?`<div class="card cut"><div class="row"><div><div class="eyebrow">TWÓJ AGENT</div><h2>${esc(game.agent.name)}</h2><div class="muted">Prowizja ${game.agent.fee}% · zaufanie ${game.agent.trust}%</div></div><button class="btn red" onclick="fireAgent()">ROZWIĄŻ UMOWĘ</button></div></div>`:''}<section class="section"><div class="grid">${FIRMS.map((f,i)=>`<div class="agent"><div style="font-size:32px">${['◆','◇','●','△','⚠'][i]}</div><div><h3>${f[0]}</h3><div class="stars">${'★'.repeat(f[1])}</div><small class="muted">Reputacja ${f[2]} · prowizja ${f[3]}% · ryzyko ${100-f[2]}%</small></div><div class="actions"><button class="btn" onclick="inspectAgent(${i})">SPRAWDŹ</button>${!game.agent?`<button class="btn gold" onclick="hireAgent(${i})">SPRAWDŹ / PODPISZ</button>`:''}</div></div>`).join('')}</div></section>`}
function inspectAgent(i){let f=FIRMS[i];openModal(`<button class="close" onclick="closeModal()">×</button><div class="eyebrow">RAPORT FIRMY</div><h2>${f[0]}</h2><div class="stars">${'★'.repeat(f[1])}</div><div class="grid g2" style="margin-top:14px"><div class="metric"><span>Licencja</span><b>${f[4]?'TAK':'NIE'}</b></div><div class="metric"><span>Reprezentacja nieletnich</span><b>${f[5]?'TAK':'NIE'}</b></div><div class="metric"><span>Reputacja</span><b>${f[2]}/100</b></div><div class="metric"><span>Ryzyko w grze</span><b>${100-f[2]}/100</b></div></div><p class="muted" style="margin-top:15px">${f[6]}</p><div class="actions"><button class="btn" onclick="checkFirm(${i})">WERYFIKUJ DOKUMENTY</button><button class="btn gold" onclick="hireAgent(${i});closeModal()">PODPISZ</button></div>`);}
function checkFirm(i){if(!act(30,10))return;game.agentChecks[i]={day:game.day,verified:FIRMS[i][4]};addHist(`Zweryfikowano firmę ${FIRMS[i][0]}.`);save();notify('Weryfikacja','Raport zapisany.');render()}
function hireAgent(i){let f=FIRMS[i];if(game.agent){toast('Masz już reprezentanta.');return}if(!f[4]){toast('Ta firma nie ma licencji — w grze nie możesz jej zatrudnić.');return}if(game.player.age<18&&!f[5]){toast('Ta firma nie obsługuje nieletnich.');return}if(!act(60))return;game.agent={name:f[0],fee:f[3],trust:f[2],since:game.day};addHist(`Podpisano reprezentację z ${f[0]}.`);save();notify('Agent',`Zatrudniono ${f[0]}.`);render()}
function fireAgent(){game.agent=null;addHist('Zakończono współpracę z agentem.');save();render()}
function staffView(){let a=game.staff.assistant,m=game.staff.manager;return `<div class="section-head"><div><div class="eyebrow">SZTAB OSOBISTY</div><h2>Nie musisz pamiętać wszystkiego</h2><p class="muted">Asystent pilnuje życia i terminów. Menadżer pilnuje kariery. Obaj tylko podpowiadają — decyzja zawsze należy do Ciebie.</p></div></div><div class="grid g2"><div class="card cut"><div class="eyebrow">ASYSTENT OSOBISTY</div><h2>${a?'Zatrudniony':'Brak'}</h2><p class="muted">Przypomnienia o zakupach, aucie, ubezpieczeniu, licencji, domu, terminach i sprawach codziennych.</p><div class="row"><span>${a?'280 zł / mies.':'900 zł zatrudnienie + 280 zł / mies.'}</span><button class="btn gold" onclick="toggleStaff('assistant')">${a?'ZWOLNIJ':'ZATRUDNIJ'}</button></div></div><div class="card cut"><div class="eyebrow">MENADŻER KARIERY</div><h2>${m?'Zatrudniony':'Brak'}</h2><p class="muted">Analizuje rozwój, trenera, transfery, agenta, kontrakty i momenty kariery.</p><div class="row"><span>${m?'1200 zł / mies.':'2800 zł zatrudnienie + 1200 zł / mies.'}</span><button class="btn gold" onclick="toggleStaff('manager')">${m?'ZWOLNIJ':'ZATRUDNIJ'}</button></div></div></div><section class="section"><div class="section-head"><div><div class="eyebrow">INTELIGENTNE PODPOWIEDZI</div><h2>Co sztab widzi teraz</h2></div><button class="btn" onclick="manualScan()">ODŚWIEŻ ANALIZĘ</button></div><div class="grid g2">${getAlerts().map(a=>`<div class="alert ${a.type==='red'?'red':a.type==='green'?'green':''}"><div class="row"><b>${a.title}</b><span class="badge">${a.priority}</span></div><div class="muted" style="margin-top:5px">${a.text}</div></div>`).join('')||'<div class="card">Brak aktywnych podpowiedzi.</div>'}</div></section>`}
function toggleStaff(type){let hire=type==='assistant'?[900,280]:[2800,1200];if(game.staff[type]){game.staff[type]=null;addHist(`Zwolniono: ${type==='assistant'?'asystent':'menadżer'}.`);save();render();return}if(!spend(hire[0]))return;game.staff[type]={salary:hire[1],since:game.day};addHist(`Zatrudniono: ${type==='assistant'?'asystenta osobistego':'menadżera kariery'}.`);save();notify('Sztab','Nowy członek sztabu zatrudniony.');render()}
function getAlerts(){let out=[];if(game.staff.assistant){if(game.garage.some(c=>c.condition<55))out.push({title:'Samochód wymaga uwagi',text:'Stan jednego z aut spadł poniżej 55%. Zaplanuj serwis.',priority:'WYSOKA',type:'red'});if(game.garage.length===0&&game.money>50000)out.push({title:'Możesz kupić pierwszy samochód',text:'Twoja płynność finansowa pozwala rozważyć zakup auta.',priority:'NISKA',type:'green'});if(game.player.age>=18&&!game.license.has)out.push({title:'Prawo jazdy',text:'Możesz rozpocząć kurs i zaplanować egzamin.',priority:'ŚREDNIA',type:''});if(game.home.level===1&&game.money>150000)out.push({title:'Możesz powiększyć dom',text:'Odblokowałeś możliwość przeprowadzki do większego lokum.',priority:'ŚREDNIA',type:'green'})}if(game.staff.manager){if(game.player.fatigue>70)out.push({title:'Za dużo obciążenia',text:'Menadżer sugeruje regenerację przed kolejnym ciężkim treningiem.',priority:'WYSOKA',type:'red'});if(game.player.potential-ovr()>18)out.push({title:'Duży margines rozwoju',text:'Potencjał jest wyraźnie wyższy od aktualnego OVR. Warto ustalić plan rozwoju z trenerem.',priority:'WYSOKA',type:'green'});if(game.player.coachTrust<35)out.push({title:'Relacja z trenerem',text:'Zaufanie spadło. Rozmowa i regularność mogą mieć znaczenie.',priority:'ŚREDNIA',type:''});if(!game.agent&&game.player.ovr>=65)out.push({title:'Reprezentacja',text:'Możesz zacząć analizować agencje, zanim pojawią się ważniejsze negocjacje.',priority:'ŚREDNIA',type:''})}return out}
function assistantScan(){let a=getAlerts();if(a.length&&game.staff.assistant)notify('Asystent',a[0].title)}function managerScan(){let a=getAlerts();if(a.length&&game.staff.manager&&a[0].priority==='WYSOKA')notify('Menadżer',a[0].title)}function manualScan(){assistantScan();managerScan();toast('Sztab ponownie przeanalizował Twoją sytuację.')}
function garageView(){return `<div class="section-head"><div><div class="eyebrow">GARAŻ</div><h2>Samochody</h2></div><button class="btn gold" onclick="buyCar()">KUP SAMOCHÓD</button></div><div class="grid g3">${game.garage.map((c,i)=>`<div class="card cut"><div class="garage-img">${c.icon}</div><h3>${c.name}</h3><div class="muted">${c.year} · ${c.hp} KM · ${c.drive}</div><div class="divider"></div><div class="row"><span>Stan</span><b>${c.condition}%</b></div><div class="bar"><i style="width:${c.condition}%"></i></div><div class="row" style="margin-top:9px"><span>Przebieg</span><b>${c.mileage} km</b></div><button class="btn" style="margin-top:10px" onclick="serviceCar(${i})">SERWIS</button></div>`).join('')||'<div class="card"><h3>Garaż jest pusty.</h3><p class="muted">Asystent będzie mógł przypominać o zakupie, kiedy będzie Cię na niego stać.</p></div>'}</div>`}
function buyCar(){let i=Math.min(game.garage.length,CARS.length-1),c=CARS[i];if(!spend(c[6]))return;game.garage.push({name:c[0],year:c[1],hp:c[2],engine:c[3],drive:c[4],icon:c[5],condition:100,mileage:0});addHist(`Kupiono samochód ${c[0]}.`);save();notify('Garaż','Samochód dodany.');render()}
function serviceCar(i){if(!spend(650))return;game.garage[i].condition=Math.min(100,game.garage[i].condition+35);game.garage[i].mileage+=40;addHist(`Serwis samochodu ${game.garage[i].name}.`);save();render()}
function wardrobeView(){let items=[['Nike Mercurial Vapor','Buty piłkarskie',420,'⚽'],['Nike Dri-FIT Academy','Koszulka treningowa',180,'👕'],['Nike Pro Dri-FIT','Warstwa termoaktywna',220,'◈'],['Nike Strike','Spodenki',140,'▱'],['Nike Guard Stay II','Ochraniacze',95,'▣']];return `<div class="section-head"><div><div class="eyebrow">EQUIPMENT</div><h2>Sprzęt i garderoba</h2></div></div><div class="grid g3">${items.map(x=>`<div class="card"><div style="font-size:50px;height:80px">${x[3]}</div><h3>${x[0]}</h3><div class="muted">${x[1]}</div><div class="row" style="margin-top:10px"><b>${money(x[2])}</b><button class="btn gold" onclick="buyWear('${x[0]}','${x[1]}',${x[2]})">KUP</button></div></div>`).join('')}</div><section class="section"><div class="card"><h3>Twój sprzęt</h3>${game.wardrobe.map(w=>`<div class="item row"><span>${w.name} <small class="muted">· ${w.type}</small></span><span class="badge">Stan ${w.condition}%</span></div>`).join('')||'<div class="muted">Brak dodatkowego sprzętu.</div>'}</div></section>`}
function buyWear(n,t,p){if(!spend(p))return;game.wardrobe.push({name:n,type:t,condition:100});addHist(`Kupiono sprzęt: ${n}.`);save();render()}
function homepropView(){return `<div class="section-head"><div><div class="eyebrow">NIERUCHOMOŚCI</div><h2>${game.home.type}</h2></div><button class="btn gold" onclick="upgradeHome()">ROZWAŻ WIĘKSZE LOKUM</button></div><div class="grid g3"><div class="card"><div class="home-img">⌂</div><h3>Salon</h3><p class="muted">Miejsce odpoczynku i regeneracji.</p></div><div class="card"><div class="home-img">▣</div><h3>Sypialnia</h3><p class="muted">Regeneracja wpływa na energię.</p></div><div class="card"><div class="home-img">◇</div><h3>Strefa treningowa</h3><p class="muted">Możesz później rozbudować ją o sprzęt.</p></div></div>`}
function upgradeHome(){if(game.home.level>=3){toast('Masz już najwyższy poziom nieruchomości w tej fazie.');return}let cost=[0,180000,450000][game.home.level];if(!spend(cost))return;game.home.level++;game.home.type=game.home.level===2?'Mieszkanie 68 m²': 'Dom podmiejski 120 m²';addHist('Rozbudowano nieruchomość.');save();render()}
function familyView(){return `<div class="section-head"><div><div class="eyebrow">RODZINA</div><h2>Relacje poza boiskiem</h2></div></div><div class="grid g3"><div class="card"><h3>${game.family.mother}</h3><div class="metric"><span>Relacja</span><b>${game.family.relationship}%</b></div><button class="btn" style="margin-top:10px" onclick="familyTalk('mamą')">POROZMAWIAJ</button></div><div class="card"><h3>${game.family.father}</h3><div class="metric"><span>Relacja</span><b>${game.family.relationship-4}%</b></div><button class="btn" style="margin-top:10px" onclick="familyTalk('tatą')">POROZMAWIAJ</button></div><div class="card"><h3>Dom rodzinny</h3><p class="muted">Rodzina może wpływać na decyzje, emocje, wyjazdy i finanse.</p></div></div>`}
function familyTalk(w){if(!act(30))return;game.family.relationship=Math.min(100,game.family.relationship+2);addHist(`Rozmowa z ${w}.`);save();notify('Rodzina','Relacja lekko się poprawiła.');render()}
function mediaView(){return `<div class="section-head"><div><div class="eyebrow">FLGRAM</div><h2>Twoje media</h2></div><button class="btn gold" onclick="postMedia()">OPUBLIKUJ POST</button></div><div class="grid g3"><div class="metric"><span>Obserwujący</span><b>${game.media.followers}</b></div><div class="metric"><span>Posty</span><b>${game.media.posts}</b></div><div class="metric"><span>Reputacja</span><b>${game.player.reputation}</b></div></div><section class="section"><div class="card"><h3>Ostatnia publikacja</h3><div class="post"><div class="post-head"><b>${game.player.first} ${game.player.last}</b><div class="muted">FLgram · dziś</div></div><div class="post-body">${game.media.posts?'⚽':'+'}</div><div class="post-foot">${game.media.posts?'Publikacja może budować popularność, ale także generować presję.':'Nie masz jeszcze publikacji.'}</div></div></div></section>`}
function postMedia(){if(!act(20))return;game.media.posts++;game.media.followers+=Math.floor(2+Math.random()*12);game.player.popularity=Math.min(100,game.player.popularity+1);addHist('Opublikowano materiał na FLgram.');save();render()}
function financeView(){return `<div class="section-head"><div><div class="eyebrow">FINANSE</div><h2>Twoje pieniądze</h2></div></div><div class="grid g3"><div class="metric"><span>Gotówka</span><b>${money(game.money)}</b></div><div class="metric"><span>Wartość rynkowa</span><b>${money(game.player.marketValue)}</b></div><div class="metric"><span>Aktywa</span><b>${money(game.money+game.garage.reduce((a,c)=>a+50000,0))}</b></div></div><section class="section"><div class="card"><h3>Stałe koszty sztabu</h3><div class="item row"><span>Asystent</span><b>${game.staff.assistant?money(game.staff.assistant.salary):'0 zł'}</b></div><div class="item row"><span>Menadżer</span><b>${game.staff.manager?money(game.staff.manager.salary):'0 zł'}</b></div><p class="muted">Koszty są pobierane przy zmianie dnia.</p></div></section>`}
function nationalView(){return `<div class="section-head"><div><div class="eyebrow">NATIONAL TEAM</div><h2>Droga do kadry</h2></div></div><div class="card cut"><h2>Reprezentacja Polski</h2><p class="muted">Powołanie nie jest automatyczne. Liczą się poziom, pozycja, forma, wyniki i rozwój.</p><div class="skill"><span>Gotowość</span><div class="bar"><i style="width:${Math.min(100,ovr()*1.05+game.player.form*.15)}%"></i></div><b>${Math.min(100,Math.round(ovr()*1.05+game.player.form*.15))}%</b></div></div>`}
function settingsView(){return `<div class="section-head"><div><div class="eyebrow">SYSTEM</div><h2>Ustawienia</h2></div></div><div class="grid g2"><div class="card"><h3>Save</h3><p class="muted">Aktualny zapis jest całkowicie odseparowany od poprzednich wersji.</p><button class="btn" onclick="save();toast('Zapisano grę.')">ZAPISZ TERAZ</button></div><div class="card"><h3>Nowa kariera</h3><p class="muted">Usuwa bieżący zapis i tworzy zupełnie czysty świat.</p><button class="btn red" onclick="newGame()">NOWA KARIERA</button></div></div>`}
function openModal(inner){$('#modal').innerHTML=`<div class="sheet">${inner}</div>`;$('#modal').classList.add('show');modalOpen=true}function closeModal(){let m=$('#modal');if(m)m.classList.remove('show');modalOpen=false}
function coachTalk(){let outlook=game.player.potential>=85?'Trener widzi bardzo wysoki sufit rozwoju.':game.player.potential>=75?'Trener widzi dobry potencjał.':'Trener uważa, że najważniejsza jest systematyczna praca.';openModal(`<button class="close" onclick="closeModal()">×</button><div class="eyebrow">ROZMOWA Z TRENEREM</div><h2>Raport o Tobie</h2><p>${outlook}</p><div class="grid g3"><div class="metric"><span>OVR</span><b>${ovr()}</b></div><div class="metric"><span>Potencjał</span><b>${game.player.potential}</b></div><div class="metric"><span>Zaufanie</span><b>${game.player.coachTrust}%</b></div></div><button class="btn gold" style="margin-top:14px" onclick="coachAfter()">ZAMKNIJ I ZAPAMIĘTAJ</button>`)}
function coachAfter(){if(!act(40))return;game.player.coachTrust=Math.min(100,game.player.coachTrust+2);addHist('Rozmowa z trenerem o potencjale i planie rozwoju.');save();closeModal();render()}
function addLicense(){if(game.player.age<18){toast('Prawo jazdy jest dostępne po osiągnięciu wymaganego wieku.');return}if(game.license.has){toast('Masz już prawo jazdy.');return}if(!spend(2500))return;game.license.has=true;addHist('Ukończono kurs i uzyskano prawo jazdy.');save();render()}
function newGame(){if(!confirm('Usunąć bieżącą karierę i zacząć całkowicie od zera?'))return;localStorage.removeItem(SAVE_KEY);game=fresh();view='home';render()}
function viewHTML(){switch(view){case'home':return homeView();case'career':return careerView();case'training':return trainingView();case'calendar':return calendarView();case'events':return eventsView();case'city':return cityView();case'transfer':return transferView();case'agent':return agentView();case'staff':return staffView();case'garage':return garageView();case'wardrobe':return wardrobeView();case'homeprop':return homepropView();case'family':return familyView();case'media':return mediaView();case'finance':return financeView();case'national':return nationalView();case'settings':return settingsView();default:return homeView()}}
function render(){safeRender()}
function renderCore(){document.querySelector('#app').innerHTML=layout(viewHTML());save();}
window.go=go;window.render=render;window.train=train;window.rest=rest;window.addReminder=addReminder;window.buyEvent=buyEvent;window.scout=scout;window.transferAsk=transferAsk;window.inspectAgent=inspectAgent;window.checkFirm=checkFirm;window.hireAgent=hireAgent;window.fireAgent=fireAgent;window.toggleStaff=toggleStaff;window.manualScan=manualScan;window.buyCar=buyCar;window.serviceCar=serviceCar;window.buyWear=buyWear;window.upgradeHome=upgradeHome;window.familyTalk=familyTalk;window.postMedia=postMedia;window.coachTalk=coachTalk;window.coachAfter=coachAfter;window.closeModal=closeModal;window.newGame=newGame;window.addLicense=addLicense;
init();
</script></body></html>
