function recalcOVR(){const p=game.player;const w={tempo:.1,technika:.15,strzal:.12,podania:.15,sila:.1,wizja:.1,obrona:.12,mental:.16};if(['BR'].includes(p.position)){w.obrona=.32;w.mental=.2;w.wizja=.15;w.technika=.08;w.strzal=.02;w.podania=.08;w.tempo=.05;w.sila=.1} if(['BR','LO','PO','ŚO','DP'].includes(p.position)){w.obrona+=.08;w.sila+=.04} if(['BR','N'].includes(p.position)){w.strzal+=.05} const sum=Object.values(w).reduce((a,b)=>a+b,0);p.ovr=clamp(Object.entries(p.skill).reduce((n,[k,v])=>n+(v*(w[k]||0)),0)/sum,1,99);}
function doTrainingSession(id){const t=TRAINING_SESSIONS.find(x=>x.id===id);if(!t)return;if(game.player.fatigue>=78)return toast('Zmęczenie jest za wysokie na ciężki trening. Odpocznij albo wybierz lżejszy dzień.');if(!useActivity('training_session',t.minutes,t.energy,1))return;const p=game.player;const results=[];Object.entries(t.skills).forEach(([skill,weight])=>{const value=p.skill[skill]||0;const cap=p.skillPotential?.[skill]||p.potential||75;const room=Math.max(0,cap-value);const fatiguePenalty=Math.max(0,(p.fatigue-35)/100);const formFactor=.65+(p.form/200);const randomness=(Math.random()-.32)*.34;const chance=clamp(.42+(room/55)-fatiguePenalty*.55+formFactor*.12,0.08,.9);let gain=0;if(Math.random()<chance&&room>0){gain=Math.max(0,Math.min(room,((.10+Math.random()*.34)*weight)*(1-room/140)*(1-fatiguePenalty)));if(gain<.03)gain=0;p.skill[skill]=clamp(value+gain,1,cap);results.push(`${skill} ${gain?`+${gain.toFixed(2)}`:'bez wzrostu'}`)}else results.push(`${skill} bez wzrostu`)});p.form=clamp(p.form+(Math.random()<.72?1.1:-.2),0,100);p.coachTrust=clamp(p.coachTrust+.4,0,100);p.fatigue=clamp(p.fatigue+t.fatigue,0,100);p.health=clamp(p.health-(p.fatigue>78?1:0),0,100);(game.world.wardrobe||[]).filter(x=>x.equipped).forEach(x=>x.durability=clamp((x.durability??100)-Math.round(t.minutes/28),0,100));p.training.totalSessions++;p.training.lastSession={date:game.date,name:t.name,results};p.training.history.unshift({date:game.date,name:t.name,results});p.training.history=p.training.history.slice(0,30);recalcOVR();advance(t.minutes);save();render();toast(`${t.name}: ${results.join(' • ')}`)}
function individualMotor(skill){const allowed=['tempo','sila','mental'];if(!allowed.includes(skill))return;if(game.player.fatigue>=70)return toast('Za duże zmęczenie na indywidualną motorykę.');if(!useActivity('motor_'+skill,70,8,1))return;const p=game.player,cap=p.skillPotential?.[skill]||p.potential||75,room=Math.max(0,cap-p.skill[skill]);const gain=Math.random()<(.45+room/100)?Math.min(room,.06+Math.random()*.28):0;p.skill[skill]+=gain;p.fatigue=clamp(p.fatigue+8,0,100);p.form=clamp(p.form+.5,0,100);p.training.history.unshift({date:game.date,name:'Indywidualna motoryka',results:[`${skill} ${gain?`+${gain.toFixed(2)}`:'bez wzrostu'}`]});recalcOVR();advance(70);save();render()}

function action(label,handler,cls='btn'){return `<button type="button" class="${cls}" onclick="${handler}">${label}</button>`}
function toast(message){const el=document.getElementById('toast');if(!el)return;el.textContent=message;el.classList.add('show');clearTimeout(window.__flToast);window.__flToast=setTimeout(()=>el.classList.remove('show'),3200)}
function modal(html){const m=document.getElementById('modal'),s=document.getElementById('sheet');if(!m||!s)return;s.innerHTML=html;m.classList.add('show')}
function closeModal(){document.getElementById('modal')?.classList.remove('show');}
function addHistory(title,desc='',effect=''){if(!game?.world)return;game.world.history.unshift({id:uid('h'),date:game.date,title,desc,effect});game.world.history=game.world.history.slice(0,120)}

let game=null, current='day', calMode='month';
function ensureActivityDay(){ensureState(game);if(game.world.activity.date!==game.date){game.world.activity={date:game.date,counts:{},cooldowns:{},history:[]}}}
function cooldownLeft(key){ensureActivityDay();const until=game.world.activity.cooldowns[key];if(!until)return 0;const a=new Date(game.date+'T12:00:00'),b=new Date(until+'T12:00:00');return Math.max(0,Math.ceil((b-a)/86400000))}
function useActivity(key,minutes,energyCost=1,cooldownDays=0){if(!game)return false;ensureActivityDay();if(cooldownLeft(key)>0){toast('Ta czynność jest jeszcze niedostępna.');return false}if(hasEventConflict(minutes)){toast('Masz w tym czasie inne zaplanowane wydarzenie.');return false}if(game.player.energy<energyCost){toast('Za mało energii. Najpierw odpocznij.');return false}const count=game.world.activity.counts[key]||0;const dailyLimit=(key.includes('training')||key.includes('skill'))?1:99;if(count>=dailyLimit){toast('Dzisiejszy limit tej aktywności został wykorzystany.');return false}game.world.activity.counts[key]=count+1;game.world.activity.history.unshift({key,date:game.date,minutes});if(cooldownDays>0)game.world.activity.cooldowns[key]=addDays(game.date,cooldownDays);return true}
function hasEventConflict(minutes){if(!game)return false;const start=game.time,end=game.time+minutes;return game.world.calendar.some(e=>!e.done&&e.date===game.date&&start<e.time+e.duration&&end>e.time)}
function advance(minutes){if(!game)return;const p=game.player;const fatigueGain=Math.max(1,Math.round(minutes/35));const energyLoss=Math.max(1,Math.round(minutes/55));p.energy=clamp(p.energy-energyLoss,0,100);p.fatigue=clamp(p.fatigue+fatigueGain,0,100);game.time+=minutes;while(game.time>=1440){game.time-=1440;game.date=addDays(game.date,1);p.energy=clamp(p.energy+35,0,100);p.fatigue=clamp(p.fatigue-28,0,100);p.form=clamp(p.form+(p.fatigue<45?0.6:-0.3),0,100);game.world.activity={date:game.date,counts:{},cooldowns:{},history:[]};generateWorldIncident();}if(p.fatigue>=85){p.health=clamp(p.health-1,0,100);p.form=clamp(p.form-0.8,0,100)}}
function doActivity(type){const map={training:['training_main',120,8,1],study:['study_main',90,4,1],family:['family_main',90,3,1],city:['city_main',120,5,1],rest:['rest_main',90,0,1]};const a=map[type];if(!a)return;if(!useActivity(a[0],a[1],a[2],a[3]))return;if(type==='training'){if(game.player.fatigue>=75){toast('Jesteś zbyt zmęczona/y na kolejny ciężki trening.');return}game.player.form=clamp(game.player.form+2,0,100);game.player.coachTrust=clamp(game.player.coachTrust+1.2,0,100);game.player.skill.tempo+=0.08;game.player.ovr=clamp(game.player.ovr+0.04,1,99);(game.world.wardrobe||[]).filter(x=>x.equipped).forEach(x=>x.durability=clamp((x.durability??100)-4,0,100))}else if(type==='study'){game.player.education.grades.push({date:game.date,value:'przygotowanie'});}else if(type==='family'){game.world.family.parents.forEach(x=>x.relation=clamp(x.relation+3,0,100));}else if(type==='city'){game.player.popularity=clamp(game.player.popularity+0.2,0,100)}else if(type==='rest'){game.player.energy=clamp(game.player.energy+18,0,100);game.player.fatigue=clamp(game.player.fatigue-12,0,100)}advance(a[1]);save();render()}
function skillTraining(skill){ if(['tempo','sila','mental'].includes(skill)) return individualMotor(skill); const map={strzal:'finishing',technika:'ball_control',podania:'passing',obrona:'defending',wizja:'decision'}; return doTrainingSession(map[skill]||'ball_control');}
function prepareNationality(){if(!useActivity('national_prepare',45,2,7))return;advance(45);game.player.coachTrust=clamp(game.player.coachTrust+2,0,100);game.player.reputation=clamp(game.player.reputation+1,0,100);save();render()}

function loadSlot(i){try{const raw=localStorage.getItem(KEY+'_'+i);if(!raw)return null;const x=JSON.parse(raw);if(!x||typeof x!=='object'||!x.player)return null;ensureState(x);return x}catch(e){return null}}
function save(){if(!game)return;ensureState(game);game.updatedAt=Date.now();game.slotMeta=game.slotMeta||{};game.slotMeta.name=game.slotMeta.name||[game.player.first,game.player.last].filter(Boolean).join(' ')||'Nowa kariera';game.slotMeta.age=game.player.age;game.slotMeta.city=game.player.city;game.slotMeta.club=game.player.club;game.slotMeta.updatedAt=game.updatedAt;localStorage.setItem(KEY+'_'+game.slot,JSON.stringify(game));}
function clearSlot(i){localStorage.removeItem(KEY+'_'+i);renderStart()}
function allSlots(){return Array.from({length:SLOTS},(_,i)=>loadSlot(i))}
function newCareer(slot){newCareerWizard(slot)}
function continueLast(){const xs=allSlots().filter(Boolean).sort((a,b)=>b.updatedAt-a.updatedAt);if(!xs.length)return toast('Brak zapisanej kariery.');game=xs[0];document.getElementById('start').classList.add('hidden');current='day';render()}
function openSaved(slot){const s=loadSlot(slot);if(!s)return;game=s;document.getElementById('start').classList.add('hidden');current='day';render()}

function calendarView(){const d=new Date(game.date+'T12:00:00'),y=d.getFullYear(),m=game.world.monthView??d.getMonth();if(calMode==='week')return weekCalendar();const first=new Date(y,m,1),start=(first.getDay()+6)%7,total=daysIn(y,m);let cells='';for(let i=0;i<start;i++)cells+='<div class="cal-day mutedday"></div>';for(let n=1;n<=total;n++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,events=game.world.calendar.filter(e=>e.date===ds);cells+=`<button class="cal-day ${ds===game.date?'today':''}" onclick="openDay('${ds}')"><b>${n}</b>${events.slice(0,4).map(e=>`<span class="event-dot ${e.type}">${iconType(e.type)} ${esc(e.title)}</span>`).join('')}${events.length>4?`<span class="muted">+${events.length-4}</span>`:''}</button>`}return `<section class="hero"><div class="eyebrow">KALENDARZ</div><div class="row"><div><h1>${MONTHS[m]} ${y}</h1><div class="muted">Wszystkie terminy, mecze, szkoła, media, rodzina i własne plany w jednym miejscu.</div></div><div class="actions">${action('Miesiąc','calMode=\'month\';render()','btn gold')}${action('Tydzień','calMode=\'week\';render()','btn')}</div></div></section><section class="section card"><div class="actions" style="margin-bottom:10px">${action('‹','changeMonth(-1)','btn')}${action('Dziś','jumpToday()','btn')}${action('›','changeMonth(1)','btn')}</div><div class="calendar-grid">${WEEK.map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells}</div></section>`}
function changeMonth(n){let m=(game.world.monthView??new Date(game.date).getMonth())+n;if(m<0)m=11;if(m>11)m=0;game.world.monthView=m;render()}
function jumpToday(){game.world.monthView=new Date(game.date).getMonth();render()}
function openDay(ds){const ev=game.world.calendar.filter(e=>e.date===ds);modal(`<div class="row"><div><div class="eyebrow">${fmtDate(ds)}</div><h2>Plan dnia</h2></div>${action('✕','closeModal()','close')}</div>${ev.length?`<div class="list">${ev.map(e=>`<div class="item"><div class="row"><b>${iconType(e.type)} ${esc(e.title)}</b><span class="badge">${clockAt(e.time)}</span></div><div class="muted">${e.duration} min</div>${!e.done?action('Oznacz jako wykonane',`completeEvent('${e.id}')`,'btn green'): '<span class="badge">Wykonane</span>'}</div>`).join('')}</div>`:'<div class="empty">Brak zaplanowanych terminów.</div>'}`)}
function weekCalendar(){const base=new Date(game.date+'T12:00:00');const mon=new Date(base);mon.setDate(base.getDate()-((base.getDay()+6)%7));let days=[];for(let i=0;i<7;i++){const ds=new Date(mon);ds.setDate(mon.getDate()+i);const key=ds.toISOString().slice(0,10);days.push(`<div class="card"><div class="eyebrow">${WEEK[i]}</div><h3>${ds.getDate()} ${MONTHS[ds.getMonth()]}</h3>${game.world.calendar.filter(e=>e.date===key).map(e=>`<div class="item" style="margin-top:7px"><b>${clockAt(e.time)} ${esc(e.title)}</b><div class="muted small">${e.duration} min</div></div>`).join('')||'<div class="muted small">brak terminów</div>'}</div>`)}return `<section class="hero"><div class="row"><div><div class="eyebrow">TYDZIEŃ</div><h1>Plan tygodnia</h1></div>${action('Widok miesiąca','calMode=\'month\';render()','btn gold')}</div></section><section class="section grid g3">${days.join('')}</section>`}
function completeEvent(id){const e=game.world.calendar.find(x=>x.id===id);if(!e||e.done)return;if(e.date!==game.date)return toast('To wydarzenie jest innego dnia.');if(game.time>e.time+e.duration){e.done=true;e.missed=true;game.player.form=clamp(game.player.form-2,0,100);addHistory('Nieobecność','Nie zdążono na: '+e.title,'forma -2');save();render();return}const wait=Math.max(0,e.time-game.time);if(game.player.energy<Math.max(8,e.duration/90))return toast('Za mało energii na to wydarzenie.');game.time+=wait;e.done=true;advance(e.duration);if(e.type==='match'){game.player.season.matches++;game.player.season.minutes+=Math.min(90,e.duration);game.player.season.rating=clamp(game.player.season.rating+.04,1,10);game.player.careerStats.matches++;game.player.careerStats.minutes+=Math.min(90,e.duration);if(Math.random()<.18){game.player.season.goals++;game.player.careerStats.goals++}if(Math.random()<.22){game.player.season.assists++;game.player.careerStats.assists++}}if(e.type==='training'){game.player.form=clamp(game.player.form+1.5,0,100);game.player.coachTrust=clamp(game.player.coachTrust+.8,0,100)}if(e.type==='club'){game.player.coachTrust=clamp(game.player.coachTrust+3,0,100);game.player.popularity=clamp(game.player.popularity+.2,0,100)}if(e.title==='Egzamin na prawo jazdy'){const pass=game.player.license.eligibleAt&&game.date>=game.player.license.eligibleAt&&Math.random()<.72;if(pass){game.player.license.status='prawo jazdy';game.player.license.eligibleAt=null;addHistory('Prawo jazdy','Zdany egzamin — możesz legalnie prowadzić.','uprawnienia zdobyte')}else{game.player.license.eligibleAt=addDays(game.date,30);addHistory('Prawo jazdy','Egzamin niezdany — kolejny termin za 30 dni.','kolejny egzamin wpisany do kalendarza');game.world.calendar.push({id:uid('ev'),date:game.player.license.eligibleAt,time:16*60,title:'Ponowny egzamin na prawo jazdy',type:'legal',duration:120,done:false})}}addHistory('Termin wykonany',e.title,'czas -'+e.duration+' min');save();render()}

function generateWorldIncident(){ensureState(game);const p=game.player,l=p.license;const pool=[];if(p.age>=15)pool.push({title:'🏁 Wyścigi na torze',text:'Znajomi proponują wyjazd na legalne wydarzenie motoryzacyjne. Możesz kupić bilet i oglądać albo zostać na treningu.',opts:[['Jadę na tor','resolveLifeEvent("race_event")'],['Zostaję','resolveLifeEvent("decline")']]});if(p.age>=17&&l.status!=='zatrzymane'&&l.status!=='odebrane')pool.push({title:'🚗 Mandat za zbyt szybką jazdę',text:'Wracając z treningu, patrol zatrzymuje Cię do kontroli. Masz wybór: przyjąć mandat albo wyjaśnić sytuację.',opts:[['Przyjmuję mandat','resolveLifeEvent("speed_ticket")'],['Próbuję wyjaśnić','resolveLifeEvent("explain_ticket")']]});if(p.age>=18&&l.status==='brak prawa jazdy')pool.push({title:'🪪 Możesz rozpocząć kurs prawa jazdy',text:'Masz odpowiedni wiek. Kurs wymaga pieniędzy, czasu i późniejszego egzaminu.',opts:[['Zapisuję się','resolveLifeEvent("driving_course")'],['Jeszcze nie','resolveLifeEvent("decline")']]});if(p.age>=17&&l.status!=='zatrzymane')pool.push({title:'🛞 Pożyczasz auto znajomego',text:'Krótka przejażdżka może być niewinna, ale ryzyko mandatu lub szkody ponosisz Ty.',opts:[['Jadę spokojnie','resolveLifeEvent("safe_drive")'],['Jadę agresywnie','resolveLifeEvent("risky_drive")']]});if(!pool.length)return;const used=game.world.events.filter(e=>e.status==='pending').map(e=>e.title);const available=pool.filter(e=>!used.includes(e.title));if(!available.length)return;const x=rand(available);game.world.events.unshift({id:uid('evt'),date:game.date,title:x.title,text:x.text,opts:x.opts,status:'pending',kind:'world'});game.world.events=game.world.events.slice(0,60);game.world.notifications.unshift({id:uid('n'),date:game.date,text:x.title});save()}

function driveCar(i){const c=game.world.cars[i];if(!c)return;const l=game.player.license;if(game.player.age<18)return toast('Nie masz jeszcze wieku do legalnego prowadzenia auta.');if(l.status==='zatrzymane'||l.status==='odebrane'||l.status==='brak prawa jazdy')return toast('Nie możesz legalnie prowadzić tego samochodu.');if(!c.insurance||!c.inspection)return toast('Auto nie ma ważnych dokumentów.');if(!useActivity('drive_'+c.id,60,1,1))return;advance(60);c.km+=Math.floor(15+Math.random()*85);c.condition=clamp(c.condition-(Math.random()<.22?3:1),0,100);const risk=Math.random();if(risk<.08){game.player.license.points+=2;game.player.money=Math.max(0,game.player.money-200);game.world.notifications.unshift({id:uid('n'),date:game.date,text:'Otrzymano mandat 200 zł i 2 punkty karne.'});addHistory('Mandat drogowy','Podczas jazdy otrzymano mandat.','-200 zł • +2 pkt')}else if(risk<.11){l.status='zatrzymane';l.bannedUntil=addDays(game.date,30);l.history.push({date:game.date,reason:'poważne wykroczenie',until:l.bannedUntil});game.world.notifications.unshift({id:uid('n'),date:game.date,text:'Prawo jazdy zatrzymane na 30 dni.'});game.world.calendar.push({id:uid('ev'),date:l.bannedUntil,time:10*60,title:'Możesz ponownie prowadzić — koniec zatrzymania prawa jazdy',type:'legal',duration:10,done:false});addHistory('Prawo jazdy zatrzymane','Poważne wykroczenie drogowe.','zakaz prowadzenia 30 dni')}else addHistory('Przejażdżka',c.name,`+${c.km} km`);save();render()}
function wardrobeView(){return `<section class="hero"><div class="eyebrow">SZAFA & SPRZĘT</div><h1>Wyposażenie zawodnika</h1><div class="muted">Konkretny model, konkretna technologia, zużycie i wpływ na trening. Założone wyposażenie może dawać niewielkie premie.</div></section><section class="section"><div class="store-note">Zdjęcia produktów są wizualnymi materiałami producentów; modele i parametry są oparte na aktualnych kartach produktów Nike/adidas. urlNike Academyhttps://www.nike.com/pl/w/nike-academy-1gdj0z3cii8z7yfbz9w87t</div><div class="actions" style="margin-top:14px">${action('🛍️ Sklep','wardrobeCatalog()','btn gold')}${action('🎒 Sprzęt dodatkowy','equipmentCatalog()','btn')}</div><div class="grid wardrobe-grid" style="margin-top:16px">${game.world.wardrobe.map((x,i)=>`<div class="wardrobe-item"><div class="wardrobe-photo" style="background-image:url('${esc(x.image||'')}')"></div><div class="wardrobe-body"><div class="eyebrow">${esc(x.brand||'MARKA')} ${x.equipped?'• ZAŁOŻONE':''}</div><h3>${esc(x.name)}</h3><div class="muted">${esc(x.category||'wyposażenie')}</div>${x.effects?.text?`<span class="gear-effect">${esc(x.effects.text)}</span>`:''}<div class="wear-bar"><i style="width:${clamp(x.durability??100,0,100)}%"></i></div><small class="muted">Zużycie: ${Math.round(x.durability??100)}%</small><div class="actions" style="margin-top:10px">${action(x.equipped?'Zdejmij':'Załóż',`toggleWear(${i})`,'btn')}${(x.durability??100)<75?action('Napraw / odśwież',`repairWear(${i})`,'btn gold'):''}</div></div></div>`).join('')||'<div class="empty">Nie masz jeszcze żadnego wyposażenia.</div>'}</div></section>`}

><div><div class="eyebrow">ŚWIAT</div><h2>Co się dzieje?</h2></div>${action('Wszystkie wydarzenia',"go('stadium')",'btn')}</div><div class="list">${pending.length?pending.map(e=>`<button class="event-large" onclick="openLifeEvent('${e.id}')"><strong>${esc(e.title)}</strong><span>${esc(e.text)}</span></button>`).join(''):'<div class="empty">Na razie nic nie wymaga Twojej decyzji.</div>'}</div></div></section><section class="section card"><div class="row"><div><div class="eyebrow">OSTATNIE</div><h2>Historia świata</h2></div>${action('Statystyki',"go('stats')",'btn')}</div><div class="history-grid">${(game.world.history||[]).slice(0,6).map(h=>`<div class="history-item"><small>${esc(h.date||game.date)}</small><b>${esc(h.title)}</b><span>${esc(h.desc||'')}</span></div>`).join('')||'<div class="empty">Twoja historia dopiero się zaczyna.</div>'}</div></section>`}
function careerView(){const p=game.player,skills=Object.entries(p.skill||{});return `<section class="hero"><div class="eyebrow">KARIERA</div><div class="row"><div><h1>${esc(p.position)} • OVR ${Math.round(p.ovr)}</h1><div class="muted">${esc(p.club||'Akademia')} • potencjał ${Math.round(p.potential||0)}</div></div>${action('Trening',"go('training')",'btn gold')}${action('Rozmowa z trenerem','coachTalk()','btn')}</div></section><section class="section grid g3"><div class="card"><h2>Profil zawodnika</h2><div class="profile-lines"><div>Forma <b>${Math.round(p.form)}%</b></div><div>Zdrowie <b>${Math.round(p.health||0)}%</b></div><div>Zaufanie trenera <b>${Math.round(p.coachTrust||0)}%</b></div><div>Popularność <b>${Math.round(p.popularity||0)}%</b></div></div></div><div class="card"><h2>Sezon</h2><div class="profile-lines"><div>Mecze <b>${p.season?.matches||0}</b></div><div>Minuty <b>${p.season?.minutes||0}</b></div><div>Gole <b>${p.season?.goals||0}</b></div><div>Asysty <b>${p.season?.assists||0}</b></div></div></div><div class="card"><h2>Rozwój</h2><div class="list">${skills.slice(0,8).map(([k,v])=>`<button class="skill-row" onclick="skillTraining('${k}')"><span>${esc(k)}</span><b>${Number(v).toFixed(1)}</b><i><em style="width:${Math.min(100,v)}%"></em></i></button>`).join('')}</div></div></section>`}
function statsView(){const p=game.player;return `<section class="hero"><div class="eyebrow">STATYSTYKI</div><h1>Twoja kariera w liczbach</h1></section><section class="section grid g4"><div class="metric"><span>OVR</span><b>${Math.round(p.ovr)}</b></div><div class="metric"><span>Mecze</span><b>${p.season?.matches||0}</b></div><div class="metric"><span>Gole</span><b>${p.season?.goals||0}</b></div><div class="metric"><span>Asysty</span><b>${p.season?.assists||0}</b></div></section><section class="section card"><h2>Atrybuty</h2><div class="stats-bars">${Object.entries(p.skill||{}).map(([k,v])=>`<div><div class="row"><span>${esc(k)}</span><b>${Number(v).toFixed(1)}</b></div><div class="progress"><i style="width:${Math.min(100,v)}%"></i></div></div>`).join('')}</div></section>`}
function cityView(){const places=[['Rynek / centrum','place-center','Sklepy, kawiarnie, spotkania',"cityFocus('Rynek / centrum')"],['Akademia','place-academy','Treningi, trenerzy, testy',"go('career')"],['Szkoła','place-school','Lekcje, sprawdziany, znajomi',"go('education')"],['Stadion','place-stadium','Mecze i wydarzenia',"go('stadium')"],['Centrum handlowe','place-mall','Odzież, sprzęt, zakupy',"go('wardrobe')"],['Salon samochodowy','place-car','Samochody i dokumenty',"go('garage')"],['Bank','place-bank','Finanse i konto',"go('finance')"],['Przychodnia','place-clinic','Zdrowie i specjaliści',"go('specialists')"]];return `<section class="hero city-hero"><div class="eyebrow">MIASTO • ${esc(game.player.city)}</div><div class="row"><div><h1>Twoje miasto</h1><div class="muted">Klikaj miejsca na mapie. Każde prowadzi do innej części świata gry.</div></div><div class="badge gold">${esc(game.player.country||'Polska')}</div></div></section><section class="section city-layout"><div class="city-map"><div class="city-road road-a"></div><div class="city-road road-b"></div><div class="city-park">PARK</div>${places.map((x,i)=>`<button class="city-building b${i+1}" onclick="${x[3]}"><span class="building-img ${x[1]}"></span><b>${x[0]}</b><small>${x[2]}</small></button>`).join('')}</div><aside class="city-panel"><div class="eyebrow">NAWIGACJA</div><h2>Gdzie chcesz iść?</h2><p class="muted">Mapa jest interaktywna. Wybierz miejsce albo użyj szybkiego przejścia.</p><div class="list">${places.map(x=>action(x[0],x[3],'btn')).join('')}</div></aside></section>`}

der><div class="main">${fn()}</div></main></div>`}

function finishWizard(slot){const g=document.getElementById('ng').value,a=+document.getElementById('na').value;game=freshState(slot);game.player.first=document.getElementById('nf').value.trim()||'Nowy';game.player.last=surname(game.player.first,document.getElementById('nl').value.trim()||'Nowak',g);game.player.gender=g;game.player.age=a;game.player.position=document.getElementById('np').value;game.player.city=document.getElementById('nc').value;game.player.country=CITY_COUNTRY[game.player.city]||'Polska';const cc=COUNTRY_DB[game.player.country]||COUNTRY_DB.Polska;game.player.currency=cc.currency;game.player.currencySymbol=cc.symbol;game.player.languages={[cc.language]:100};game.world.side.forEach((j)=>{const d=sideDefs.find(x=>x.id===j.id);j.unlocked=a>=d.unlock});game.world.properties[0].city=game.player.city;game.slotMeta.name=game.player.first+' '+game.player.last;game.world.settings.tutorial=true;seedCalendar();closeModal();document.getElementById('start').classList.add('hidden');save();current='day';render();showTutorial()}
