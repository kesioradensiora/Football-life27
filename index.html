<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Football Life 27 — FINAL • Football Life 27</title>
<style>
:root{
  --bg:#07080d;
  --bg2:#0d1019;
  --panel:#121722;
  --panel2:#171d2b;
  --panel3:#1c2434;
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.14);
  --text:#fbfcff;
  --muted:#9ba6b8;
  --red:#e63946;
  --red2:#ff5663;
  --redDark:#651c27;
  --redGlow:rgba(230,57,70,.22);
  --green:#38d996;
  --gold:#f5c451;
  --blue:#63a9ff;
  --shadow:0 18px 50px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{
 margin:0;min-height:100%;
 background:
 radial-gradient(700px 400px at 50% -120px,rgba(230,57,70,.16),transparent 68%),
 radial-gradient(600px 420px at 100% 30%,rgba(92,116,170,.10),transparent 70%),
 linear-gradient(180deg,#090b11 0%,#05060a 100%);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
 -webkit-font-smoothing:antialiased;
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
 background:linear-gradient(115deg,transparent 0 42%,rgba(255,255,255,.018) 50%,transparent 58%);
}
button,input{font:inherit}
button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:108px}

/* HEADER / HUD */
.career-accent{width:42px;height:3px;border-radius:99px;background:linear-gradient(90deg,#e63946,#ff7b83);margin:8px 0 5px;box-shadow:0 0 14px rgba(230,57,70,.25)}
header{
 position:sticky;top:0;z-index:10;
 background:rgba(8,10,16,.92);
 backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
 border-bottom:1px solid var(--line);
 padding:15px 15px 15px;
 box-shadow:0 8px 30px rgba(0,0,0,.22);
}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand b{font-size:18px;font-weight:950;letter-spacing:.25px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.save{
 font-size:9px;font-weight:850;letter-spacing:.4px;text-transform:uppercase;
 color:#ff9ba4;background:rgba(230,57,70,.09);
 border:1px solid rgba(230,57,70,.22);
 padding:5px 8px;border-radius:99px
}
.sub{color:var(--muted);font-size:11px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{
 position:relative;overflow:hidden;text-align:center;
 background:linear-gradient(145deg,#171d2b 0%,#10151f 62%,#17131b 100%);
 border:1px solid var(--line2);border-radius:17px;
 padding:10px 5px 9px;box-shadow:inset 0 1px rgba(255,255,255,.04)
}
.stat:first-child{border-color:rgba(230,57,70,.28)}
.stat:first-child:after{
 content:"";position:absolute;width:65px;height:65px;right:-32px;top:-32px;
 background:var(--redGlow);border-radius:50%;filter:blur(3px)
}
.stat b{display:block;font-size:18px;line-height:1.05;font-weight:900;position:relative;z-index:1}
.stat span{display:block;color:#8e99aa;font-size:9px;margin-top:5px;position:relative;z-index:1}

/* MAIN CARDS */
main{padding:15px}
.card{
 background:linear-gradient(145deg,rgba(22,28,40,.98),rgba(12,15,22,.98));
 border:1px solid rgba(255,255,255,.105);border-radius:23px;padding:17px;margin-bottom:13px;
 box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.035)
}
.hero{
 position:relative;overflow:hidden;
 background:
 radial-gradient(280px 180px at 100% 0%,rgba(230,57,70,.30),transparent 70%),
 linear-gradient(135deg,#3a151d 0%,#21131b 45%,#11151f 100%);
 border-color:rgba(230,57,70,.34);box-shadow:0 20px 55px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.055);
 padding:20px 17px 18px;
}
.hero:after{
 content:"";position:absolute;right:-40px;bottom:-55px;width:180px;height:180px;
 border:1px solid rgba(255,255,255,.07);border-radius:50%;
 box-shadow:0 0 0 28px rgba(255,255,255,.018),0 0 0 56px rgba(255,255,255,.012)
}
.hero:before{
 content:"⚽";position:absolute;right:-11px;top:-21px;font-size:112px;
 opacity:.055;transform:rotate(-14deg)
}
.hero>*{position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;width:max-content;padding:5px 9px;border-radius:99px;background:rgba(230,57,70,.13);border:1px solid rgba(230,57,70,.24);color:#ff9ba4;font-size:8px;font-weight:900;letter-spacing:1px;margin-bottom:7px}
.kicker{
 color:#ff8c95;text-transform:uppercase;font-size:9px;letter-spacing:1.55px;font-weight:900
}
h1,h2,h3{margin:5px 0 8px;line-height:1.1}
h1{font-size:28px;letter-spacing:-.6px}
h2{font-size:20px;letter-spacing:-.25px}
h3{font-size:16px}
.hero h1{font-size:30px}
.hero p{margin:7px 0;color:#c6ccd7;font-size:13px;line-height:1.5}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.pill{
 padding:7px 10px;border-radius:99px;
 background:rgba(5,7,12,.38);border:1px solid rgba(255,255,255,.12);
 color:#e3e7ee;font-size:10px;font-weight:750
}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 10px}
.section-title b{font-size:15px;letter-spacing:.1px}.section-title span{font-size:9px;color:#8f9bad;text-transform:uppercase;letter-spacing:.8px;font-weight:800}

/* BUTTONS */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions.three{grid-template-columns:repeat(3,1fr)}
.action{
 position:relative;overflow:hidden;text-align:left;
 border:1px solid rgba(255,255,255,.10);
 background:linear-gradient(145deg,#202938 0%,#151b26 58%,#11151d 100%);
 border-radius:18px;padding:14px;min-height:76px;
 box-shadow:inset 0 1px rgba(255,255,255,.045);
 transition:transform .12s,filter .12s,border-color .12s
}
.action:after{
 content:"";position:absolute;left:0;top:0;width:3px;height:100%;
 background:rgba(255,255,255,.08)
}
.action.green{
 border-color:rgba(56,217,150,.42);box-shadow:0 10px 28px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.06);
 background:linear-gradient(135deg,#173b31 0%,#123126 58%,#10241f 100%)
}
.action.green:after{background:var(--green)}
.action.gold{border-color:rgba(245,196,81,.28);background:linear-gradient(145deg,#302a1b,#191713)}
.action.gold:after{background:var(--gold)}
.action.red{
 border-color:rgba(230,57,70,.36);
 background:linear-gradient(145deg,#3a1820,#211318)
}
.action.red:after{background:var(--red)}
.action b,.action small{position:relative;z-index:1}
.action b{display:block;font-size:13px;font-weight:850}
.action small{display:block;color:#9ca8b9;font-size:10px;line-height:1.35;margin-top:5px}
.action:active,.choice:active{transform:scale(.985);filter:brightness(1.08)}
.progress{
 height:8px;background:#080b11;border-radius:99px;overflow:hidden;
 border:1px solid rgba(255,255,255,.08)
}
.progress i{
 display:block;height:100%;border-radius:99px;
 background:linear-gradient(90deg,var(--red),#ff7b83);
 box-shadow:0 0 14px rgba(230,57,70,.28)
}
.row{position:relative;
 display:flex;justify-content:space-between;gap:12px;
 padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.065);
 font-size:12px
}
.row:last-child{border-bottom:0}
.row span{color:#929eaf}.row b{text-align:right}

/* EVENTS / CHOICES */
.log{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px;line-height:1.45}
.log:last-child{border:0}
.log em{font-style:normal;color:#ff8a93;font-size:10px;display:block;margin-bottom:3px}
.notice{
 padding:12px;border-radius:15px;
 background:linear-gradient(145deg,#1a202c,#11161f);
 border:1px solid rgba(255,255,255,.09);
 color:#cbd2dd;font-size:12px;line-height:1.45
}
.choice{
 width:100%;border:1px solid rgba(255,255,255,.10);
 background:linear-gradient(145deg,#1b2432,#121923);
 border-radius:16px;padding:13px;margin:7px 0;text-align:left;
 box-shadow:inset 0 1px rgba(255,255,255,.04);transition:.12s
}
.choice:hover{border-color:rgba(230,57,70,.42);background:linear-gradient(145deg,#271b23,#151922)}
.choice b{display:block;font-size:13px;font-weight:800}.choice span{display:block;color:#919dad;font-size:10px;line-height:1.35;margin-top:4px}
.empty{color:var(--muted);font-size:12px;padding:8px 0}

/* CREATOR */
.creator-screen header{background:rgba(8,10,16,.94)}
.creator-screen .stats{display:none}
.creator-screen main{padding-top:20px}
.creator-screen .hero{
 min-height:260px;display:flex;flex-direction:column;justify-content:flex-end
}
.creator-screen .hero .hero-badge{display:inline-flex;align-items:center;width:max-content;padding:5px 9px;border-radius:99px;background:rgba(230,57,70,.13);border:1px solid rgba(230,57,70,.24);color:#ff9ba4;font-size:8px;font-weight:900;letter-spacing:1px;margin-bottom:7px}
.kicker{margin-bottom:auto}
.creator-screen .choice{min-height:55px;display:flex;flex-direction:column;justify-content:center}
.creator-screen input:focus{
 border-color:rgba(230,57,70,.72)!important;
 box-shadow:0 0 0 3px rgba(230,57,70,.11)
}

/* NAV */
nav{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(620px,100%);display:grid;grid-template-columns:repeat(8,1fr);gap:1px;
 padding:8px 9px calc(8px + env(safe-area-inset-bottom));
 background:rgba(8,10,15,.94);
 backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
 border-top:1px solid rgba(255,255,255,.08);z-index:20;
 box-shadow:0 -18px 45px rgba(0,0,0,.30)
}
nav button{
 border:1px solid transparent;background:transparent;padding:7px 2px;border-radius:15px;
 color:#7f8999;font-size:9px;transition:.12s
}
nav button.active{
 background:linear-gradient(145deg,#3a1820,#21131a);
 border-color:rgba(230,57,70,.34);box-shadow:0 20px 55px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.055);color:#fff;
 box-shadow:inset 0 1px rgba(255,255,255,.05)
}
nav i{display:block;font-style:normal;font-size:19px;margin-bottom:3px}

/* MODALS / TOAST */
.overlay{
 position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:30;
 display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)
}
.modal{
 width:min(620px,100%);max-height:90vh;overflow:auto;
 background:linear-gradient(160deg,#171d29,#0d1118);
 border:1px solid rgba(255,255,255,.11);border-bottom:0;
 border-radius:25px 25px 0 0;padding:19px 16px calc(24px + env(safe-area-inset-bottom));
 box-shadow:0 -25px 70px rgba(0,0,0,.55)
}
.toast{
 position:fixed;left:50%;bottom:102px;transform:translate(-50%,15px);
 background:linear-gradient(145deg,#fff5f6,#ffe2e5);color:#3a0d12;
 border-radius:99px;padding:10px 15px;font-size:11px;font-weight:850;z-index:50;
 opacity:0;transition:.2s;pointer-events:none;box-shadow:0 10px 35px rgba(0,0,0,.3)
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:390px){
 main{padding:12px}.stats{gap:6px}.stat{padding:10px 3px}
 .stat b{font-size:16px}.stat span{font-size:8px}.hero h1{font-size:27px}.card{padding:14px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><b>⚽ FOOTBALL LIFE 27</b><span class="save" id="saveState">● Zapisano</span></div>
  <div class="sub" id="dateLine">—</div>
  <div class="stats">
    <div class="stat"><b id="money">€0</b><span>💶 Pieniądze</span></div>
    <div class="stat"><b id="energy">0</b><span>⚡ Energia</span></div>
    <div class="stat"><b id="form">0</b><span>🔥 Forma</span></div>
    <div class="stat"><b id="pr">0</b><span>📣 PR</span></div>
  </div>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
</div>

<script>

const QUESTIONS=[

 ]],

 ["Najbardziej naturalny styl gry",["Techniczny — drybling i kontrola","Szybki — sprint i gra za plecy obrony","Fizyczny — siła i pojedynki","Kreatywny — podania i wizja","Uniwersalny — potrafię robić wszystko po trochu"]],
 ["Który zawodnik najbardziej Cię inspiruje?",["Lionel Messi","Cristiano Ronaldo","Jude Bellingham","Kylian Mbappé","Alexia Putellas","Mohamed Salah"]],
 ["Jaki jest Twój klub marzeń?",["FC Barcelona","Real Madryt","Manchester City","Bayern Monachium","Arsenal","Lech Poznań"]],
 ["Jak zachowujesz się pod presją?",["Walczę do końca","Zachowuję spokój","Biorę odpowiedzialność","Szukam wsparcia u drużyny","Czasem presja mnie blokuje"]],
 ["Co jest dla Ciebie najważniejsze w karierze?",["Rozwój i umiejętności","Trofea","Pieniądze","Sława i rozpoznawalność","Reprezentowanie Polski","Dobra atmosfera i ludzie"]],
 ["Jaki jest Twój największy cel?",["Zostać zawodnikiem/zawodniczką światowego poziomu","Zagrać w klubie marzeń","Zdobyć Ligę Mistrzów","Zagrać dla reprezentacji","Zbudować karierę i jednocześnie mieć normalne życie"]]
];

const START_CLUBS=["Lech Poznań U-15","Warta Poznań U-15","Legia Warszawa U-15","Jagiellonia Białystok U-15","Pogoń Szczecin U-15","Raków Częstochowa U-15","Śląsk Wrocław U-15","Lechia Gdańsk U-15","Akademia miejska","Lokalna akademia"];

const NAMES=["Maja","Ola","Emma","Kuba","Michał","Nina","Lena","Bartek","Zosia","Igor","Sara","Antek","Julia","Filip","Oskar","Kacper","Laura","Tomek"];
const EVENT_POOL=[
{id:"coach_progress",title:"Trener widzi postęp",text:"Po treningu trener zauważa poprawę konkretnego elementu Twojej gry.",choices:[
["Zapytaj, co poprawić dalej",()=>{S.skill+=2;S.rel.Trener+=6;log("Trener wskazał Ci konkretny element do poprawy. Umiejętności +2, trener +6.")}],
["Podziękuj i odpocznij",()=>{S.form+=2;S.energy+=3;log("Słuchasz trenera i wybierasz regenerację. Forma +2.")}]]},
{id:"family_allowance",title:"Rozmowa o pieniądzach",text:"Rodzice pytają, czy potrzebujesz większej niezależności finansowej.",choices:[

["Chcę dorabiać samodzielnie",()=>{S.independent=true;S.rel.Rodzice+=1;log("Postanawiasz dorabiać samodzielnie.")}],
["Poproszę o pomoc tylko wtedy, gdy jej potrzebuję",()=>{S.allowance=0;S.rel.Rodzice+=3;log("Ustalasz z rodzicami pomoc finansową zależnie od sytuacji.")}]]},
{id:"new_friend",title:"Nowa osoba w akademii",text:"Na treningu pojawia się nowa osoba. Macie okazję się poznać.",choices:[
["Podejdź i porozmawiaj",()=>addFriend()],
["Skup się na treningu",()=>{S.skill+=1;S.form+=2;log("Skupiasz się na treningu. Umiejętności +1, forma +2.")}],
["Zaproponuj wspólny trening",()=>{addFriend();S.skill+=1;S.energy-=3;log("Nowa znajomość zaczyna się od wspólnego treningu. Umiejętności +1.")}]]},
{id:"minor_injury",title:"Drobny ból po treningu",text:"Czujesz lekki ból. Nie wygląda groźnie, ale decyzja teraz może mieć znaczenie później.",choices:[

{id:"side_job",title:"Dorywcza propozycja",text:"Znajomy rodziny proponuje Ci prostą pracę. Pieniądze przydadzą się, ale tracisz czas na regenerację.",choices:[

["Negocjuj krótszą zmianę • +15€",()=>{S.money+=15;S.energy-=5;log("Ustalasz krótszą zmianę: +15€ i -5 energii.")}]]},
{id:"family_day",title:"Weekend z rodziną",text:"Rodzina proponuje wspólny dzień bez piłki. Trening nie jest obowiązkowy.",choices:[

["Zostań i trenuj",()=>{S.skill+=2;S.family-=2;S.energy-=8;log("Wybierasz dodatkową pracę nad sobą. Umiejętności +2, rodzina -2.")}],
["Trening rano, potem rodzina",()=>{S.skill+=1;S.family+=5;S.energy-=5;log("Łączysz trening i rodzinę. Umiejętności +1, rodzina +5.")}]]},
{id:"first_media",title:"Pierwsze zainteresowanie mediów",text:"Po dobrym meczu lokalna telewizja sama prosi Cię o krótką wypowiedź. Nie wybierałeś/aś tej sytuacji.",choices:[
["Mówię spokojnie i dziękuję drużynie",()=>{S.pr+=4;S.rel.Trener+=2;log("Pierwszy wywiad: spokojna wypowiedź. PR +4, trener +2.")}],
["Mówię o swoich ambicjach",()=>{S.pr+=7;S.mental-=1;log("Pierwszy wywiad: mocne ambicje. PR +7, mental -1.")}],
["Oddaję głos drużynie",()=>{S.pr+=2;S.family+=1;log("Pierwszy wywiad: podkreślasz rolę zespołu. PR +2.")}]]},
{id:"school_test",title:"Sprawdzian w szkole",text:"Jutro masz ważny sprawdzian. Akademia proponuje dodatkowy trening.",choices:[
["Uczę się wieczorem",()=>{S.mental+=2;S.energy-=4;log("Przygotowujesz się do sprawdzianu. Mental +2.")}],
["Idę na dodatkowy trening",()=>{S.skill+=2;S.energy-=10;log("Wybierasz dodatkowy trening. Umiejętności +2.")}],
["Dzielę czas po połowie",()=>{S.skill+=1;S.mental+=1;S.energy-=7;log("Dzielisz czas między szkołę i piłkę. Umiejętności +1, mental +1.")}]]},

function applyGenderGrammar(){
  if(!S.started) return;
  const root=document.getElementById("main");
  if(!root) return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const old=n.nodeValue;
    const next=grammar(old);
    if(next!==old) n.nodeValue=next;
  });
}

function isFemale(){
  return S.gender==="Kobieta" || S.gender==="Dziewczyna";
}
function genderWord(male,female){
  return isFemale()?female:male;
}
function genderVerb(male,female){
  return isFemale()?female:male;
}
function genderLabel(){
  return isFemale()?"piłkarka":"piłkarz";
}
function genderPossessive(){
  return isFemale()?"jej":"jego";
}
function genderSubject(){
  return isFemale()?"ona":"on";
}
function escText(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normalizeGender(v){
  return v==="Kobieta" ? "Kobieta" : "Mężczyzna";
}
function profileTitle(){
  return `${escText(S.name||"Moja kariera")} • ${genderLabel()}`;
}
function grammar(text){
  if(!text) return "";
  const female = isFemale();
  return text
    .replace(/\bPiłkarz\b/g,female?"Piłkarka":"Piłkarz")
    .replace(/\bpiłkarz\b/g,female?"piłkarka":"piłkarz")
    .replace(/\bPiłkarza\b/g,female?"Piłkarkę":"Piłkarza")
    .replace(/\bpiłkarza\b/g,female?"piłkarkę":"piłkarza")
    .replace(/\bPiłkarzem\b/g,female?"Piłkarką":"Piłkarzem")
    .replace(/\bpiłkarzem\b/g,female?"piłkarką":"piłkarzem")
    .replace(/\bPiłkarzowi\b/g,female?"Piłkarce":"Piłkarzowi")
    .replace(/\bpiłkarzowi\b/g,female?"piłkarce":"piłkarzowi")
    .replace(/\bZawodnik\b/g,female?"Zawodniczka":"Zawodnik")
    .replace(/\bzawodnik\b/g,female?"zawodniczka":"zawodnik")
    .replace(/\bZawodnika\b/g,female?"Zawodniczkę":"Zawodnika")
    .replace(/\bzawodnika\b/g,female?"zawodniczkę":"zawodnika")
    .replace(/\bZawodnikiem\b/g,female?"Zawodniczką":"Zawodnikiem")
    .replace(/\bzawodnikiem\b/g,female?"zawodniczką":"zawodnikiem");
}

function makeFamily(){
  const countries=["Polska","Hiszpania","Niemcy","Francja","Anglia","Włochy","Portugalia","Brazylia","USA","Czechy","Holandia","Belgia","Argentyna","Chorwacja","Szwecja"];
  let fatherCountry=countries[Math.floor(Math.random()*countries.length)];
  let motherCountry=Math.random()<0.38?countries[Math.floor(Math.random()*countries.length)]:fatherCountry;
  // Rodzice mogą pochodzić z różnych krajów, ale nie musi tak być.
  const birthCountry=Math.random()<0.72
    ? (Math.random()<0.55?fatherCountry:motherCountry)
    : countries[Math.floor(Math.random()*countries.length)];
  const jobs=[
    ["nauczyciel","pielęgniarka"],["inżynier","księgowa"],["kierowca","nauczycielka"],
    ["policjant","farmaceutka"],["przedsiębiorca","pracownica biurowa"],["mechanik","fizjoterapeutka"],
    ["trener sportowy","sprzedawczyni"],["informatyk","architektka"],["pracownik budowlany","nauczycielka"]
  ];
  const pair=jobs[Math.floor(Math.random()*jobs.length)];
  const fatherAge=35+Math.floor(Math.random()*13), motherAge=34+Math.floor(Math.random()*12);
  const homeTypes=["mieszkanie w mieście","dom na przedmieściach","mieszkanie w mniejszym mieście","dom w spokojnej dzielnicy"];
  const home=homeTypes[Math.floor(Math.random()*homeTypes.length)];
  const cities={
    "Polska":["Poznań","Warszawa","Wrocław","Gdańsk","Kraków"],
    "Portugalia":["Lizbona","Porto","Braga","Coimbra"],
    "Francja":["Paryż","Lyon","Marsylia","Tuluza"],
    "Hiszpania":["Madryt","Barcelona","Walencja","Sewilla"],
    "Niemcy":["Berlin","Monachium","Hamburg","Kolonia"],
    "Włochy":["Rzym","Mediolan","Turyn","Bolonia"],
    "Anglia":["Londyn","Manchester","Liverpool","Birmingham"],
    "Holandia":["Amsterdam","Rotterdam","Utrecht"],
    "Belgia":["Bruksela","Antwerpia","Gandawa"],
    "Brazylia":["São Paulo","Rio de Janeiro","Curitiba"],
    "USA":["Miami","Boston","Chicago","Los Angeles"],
    "Czechy":["Praga","Brno","Ostrawa"],
    "Argentyna":["Buenos Aires","Córdoba","Rosario"],
    "Chorwacja":["Zagrzeb","Split","Rijeka"],
    "Szwecja":["Sztokholm","Göteborg","Malmö"]
  };
  const residenceCountry = Math.random()<0.82 ? birthCountry : countries[Math.floor(Math.random()*countries.length)];
  const cityPool=cities[residenceCountry]||cities["Polska"];
  const residenceCity=cityPool[Math.floor(Math.random()*cityPool.length)];
  const income=["niski","stabilny","średni","dobrze zarabiający"][Math.floor(Math.random()*4)];
  const namesF=["Tomasz","Marek","Piotr","Adam","Paweł","Michał","Krzysztof","Daniel"];
  const namesM=["Anna","Katarzyna","Magdalena","Joanna","Agnieszka","Monika","Natalia","Karolina"];
  return {
    father:{name:namesF[Math.floor(Math.random()*namesF.length)],age:fatherAge,job:pair[0],country:fatherCountry},
    mother:{name:namesM[Math.floor(Math.random()*namesM.length)],age:motherAge,job:pair[1],country:motherCountry},
    siblings:Math.random()<.62?[{name:"rodzeństwo",age:8+Math.floor(Math.random()*10)}]:[],
    home,country:fatherCountry===motherCountry?fatherCountry:"rodzina międzynarodowa",
    residenceCountry,residenceCity,income,socialClass:income==="niski"?"pracująca rodzina":income==="dobrze zarabiający"?"zamożna rodzina":"klasa średnia",
    homeCountry:birthCountry,
    notes:"Rodzina jest generowana losowo i będzie wpływać na wydarzenia, ale nie determinuje Twojej kariery."
  };
}
function ensureFamily(){
  if(!S.familyProfile || !S.familyProfile.father || !S.familyProfile.father.name){
    S.familyProfile=makeFamily();
    S.birthCountry=S.familyProfile.homeCountry;
    S.residenceCountry=S.familyProfile.residenceCountry||S.familyProfile.homeCountry;
    S.nationalities=[S.familyProfile.father.country];
    if(S.familyProfile.mother.country!==S.familyProfile.father.country)S.nationalities.push(S.familyProfile.mother.country);
  }
}
function requestGeneticsResearch(){
  if(S.geneticsResearch){toast("Badanie jest już zlecone lub wykonane.");return;}
  const cost=120;
  if(Number(S.money||0)<cost){
    toast(`Badanie kosztuje ${cost}€. Brakuje Ci ${Math.ceil(cost-Number(S.money||0))}€.`);
    return;
  }
  S.money-=cost;
  S.geneticsResearch={startedDay:S.day,readyDay:S.day+7,status:"w trakcie",results:null,cost};
  log(`Zlecono analizę predyspozycji za ${cost}€. Laboratorium potrzebuje około tygodnia.`);
  saveSoon();render();
}
function checkGeneticsResearch(){
  if(!S.geneticsResearch)return;
  if(S.geneticsResearch.status==="w trakcie" && S.day>=S.geneticsResearch.readyDay){
    const athletic=Math.round(55+Math.random()*40), mental=Math.round(45+Math.random()*45), technical=Math.round(50+Math.random()*42);
    S.geneticsResearch.status="gotowe";
    S.geneticsResearch.results={athletic,mental,technical,ceiling:Math.round((athletic+mental+technical)/3)};
    S.potential=S.geneticsResearch.results;
    log("Lekarz/laboratorium skontaktowało się z rodziną: wyniki analizy predyspozycji są gotowe. Trzeba umówić odbiór wyników.");
    saveSoon();
  }
}


function ensureWealth(){
  if(!S.wealth)S.wealth={businesses:[],investments:[],portfolio:[],charityTotal:0,assets:[],lastMarketUpdate:0};
  ["businesses","investments","portfolio","assets"].forEach(k=>{if(!Array.isArray(S.wealth[k]))S.wealth[k]=[]});
  S.wealth.charityTotal=Number(S.wealth.charityTotal||0);
}
function changePR(amount,reason){
  S.pr=Math.max(0,Math.min(100,Number(S.pr||0)+Number(amount||0)));
  if(reason)log(`📣 PR ${amount>=0?"+":""}${amount}: ${reason}`);
}
function buyBusiness(name,cost,kind){
  ensureWealth(); cost=Number(cost);
  if(Number(S.money||0)<cost){toast(`Brakuje Ci ${Math.ceil(cost-S.money)}€.`);return false;}
  S.money-=cost;
  const b={name,kind,cost,value:cost,weeklyProfit:Math.round(cost*(0.002+Math.random()*0.006)),pr:0};
  S.wealth.businesses.push(b); S.wealth.assets.push({type:"business",name,value:cost});
  changePR(1,"zainwestowano we własny biznes");
  log(`🏢 Założono biznes: ${name} za ${cost}€.`);
  saveSoon();render();return true;
}
function buyMarketAsset(name,ticker,cost,risk){
  ensureWealth(); cost=Number(cost);
  if(Number(S.money||0)<cost){toast(`Brakuje Ci ${Math.ceil(cost-S.money)}€.`);return false;}
  S.money-=cost;
  S.wealth.portfolio.push({name,ticker,cost,shares:1,currentValue:cost,risk:Number(risk||.1)});
  log(`📈 Kupiono automatycznie aktywo ${name} (${ticker}) za ${cost}€.`);
  saveSoon();render();return true;
}
function updateMarket(){
  ensureWealth();
  const now=Date.now();
  if(S.wealth.lastMarketUpdate && now-S.wealth.lastMarketUpdate<86400000)return;
  S.wealth.lastMarketUpdate=now;
  S.wealth.portfolio.forEach(a=>{
    const drift=(Math.random()-.48)*(Number(a.risk||.1)*2);
    a.currentValue=Math.max(0,Math.round(a.currentValue*(1+drift)));
  });
  // Businesses produce small passive income, with realistic variability.
  S.wealth.businesses.forEach(b=>{
    const income=Math.max(0,Math.round(Number(b.weeklyProfit||0)*(0.75+Math.random()*.5)));
    S.money+=income;
    if(income)log(`🏢 Twój biznes przyniósł ${income}€.`);
  });
  saveSoon();
}
function donateMoney(amount,cause){
  ensureWealth(); amount=Number(amount);
  if(amount<=0||Number(S.money||0)<amount){toast("Nie masz wystarczających środków.");return false;}
  S.money-=amount; S.wealth.charityTotal+=amount;
  const bonus=amount>=5000?4:amount>=1000?3:amount>=250?2:1;
  changePR(bonus,`przekazano ${amount}€ na cel: ${cause}`);
  log(`❤️ Przekazano ${amount}€ na ${cause}.`);
  saveSoon();render();return true;
}

function startCareerSeason(year,club){
  ensureCareerStats();
  if(!S.careerStats.currentSeason){
    S.careerStats.currentSeason={year,club,apps:0,starts:0,minutes:0,goals:0,assists:0,yellow:0,red:0,cleanSheets:0,penaltiesScored:0,penaltiesMissed:0,ownGoals:0,trophies:[]};

  }

function recordMatchStats(st){
  ensureCareerStats();
  const c=S.careerStats.career;
  const s=S.careerStats.currentSeason;
  if(!s)return;
  const keys=["apps","starts","minutes","goals","assists","yellow","red","cleanSheets","penaltiesScored","penaltiesMissed","ownGoals"];
  keys.forEach(k=>{
    const v=Math.max(0,Number(st[k]||0));
    s[k]+=v;c[k]+=v;
  });
  saveSoon();
}
function finishCareerSeason(label,trophies=[]){
  ensureCareerStats();
  const s=S.careerStats.currentSeason;
  if(!s)return;
  s.trophies=[...trophies];
  S.careerStats.seasons.push({...s});
  evaluateYouthAwards();
  trophies.forEach(t=>{if(!S.careerStats.trophies.includes(t))S.careerStats.trophies.push(t)});
  S.careerStats.currentSeason=null;
  saveSoon();
}
function addCareerAward(name,season){
  ensureCareerStats();
  S.careerStats.awards.push({name,season});
  saveSoon();
}
function calculateSeasonAwards(){
  ensureCareerStats();
  const s=S.careerStats.seasons[S.careerStats.seasons.length-1];
  if(!s)return;
  if(s.goals>=25)addCareerAward("Złoty But — najlepszy strzelec sezonu",s.year);
  if(s.assists>=15)addCareerAward("Król asyst",s.year);

function storeBuy(itemId){
 ensureStore();
 const all=[...STORE_ITEMS.homes,...STORE_ITEMS.cars,...STORE_ITEMS.boots,...STORE_ITEMS.accessories];
 const it=all.find(x=>x.id===itemId); if(!it)return;
 if(S.store.owned.includes(it.id)){toast("Już to posiadasz.");return}
 if(!spend(it.price,`Zakup: ${it.name}`))return;
 S.store.owned.push(it.id);
 if(it.cat==="home")S.store.home=it.id;
 if(it.cat==="car")S.store.car=it.id;
 if(it.cat==="boots")S.store.boots=it.id;
 if(it.cat==="accessory")S.store.accessories.push(it.id);
 Object.entries(it.boost||{}).forEach(([k,v])=>{
   if(k==="skill")S.skill=clamp(S.skill+v);
   else if(k==="mental")S.mental=clamp(S.mental+v);
   else if(k==="pr")S.pr=clamp(S.pr+v);
   else if(k==="health")S.health=clamp(S.health+v);
   else if(k==="trainingLevel")S.trainingLevel+=v;
 });
 log(`Kupujesz ${it.name}. ${Object.entries(it.boost||{}).map(([k,v])=>`+${v} ${k}`).join(", ")}`);
 saveSoon();render();
}

 S.club=pickRealLocalClub(S.familyProfile.residenceCity);

function advance(hours){
  ensureStore(); checkSponsors();
  const whole=Math.max(0,Math.floor(hours));
  S.hour+=whole;

  while(S.hour>=24){
    S.hour-=24;
    S.day++;
    S.dayOfMonth++;

    const daysInMonth=new Date(S.year,S.month,0).getDate();
    if(S.dayOfMonth>daysInMonth){
      S.dayOfMonth=1; S.month++;
      if(S.month>12){S.month=1;S.year++;}
    }

    S.week=Math.floor((S.day-1)/7)+1;

    // A new week resets team-training limits. Allowance varies with family finances/events.
    if(S.day>1 && (S.day-1)%7===0){
      const family=String(S.familyProfile?.income||S.familyProfile?.socialClass||"stabilny").toLowerCase();
      const base=family.includes("nis")?8:family.includes("dobr")?18:14;
      const roll=Math.random();
      const allowance=roll<.08?0:roll<.25?Math.max(5,base-4):roll<.88?base:base+Math.floor(3+Math.random()*8);
      S.money+=allowance;
      S.allowance=allowance;
      log(allowance?`💶 Kieszonkowe za ten tydzień: +${allowance}€.`:"💶 W tym tygodniu rodzice nie dali kieszonkowego — w domu są większe wydatki.");
      if(window.FL27_newWeek)FL27_newWeek(S.week);
      // Weekend block belongs only to the current week.
      if(window.FL27_newSocialWeek)FL27_newSocialWeek(); if(window.FL27_schedule){FL27_schedule.weekendBlock=false;FL27_schedule.weekendWork=false;FL27_schedule.weekTraining=0;FL27_schedule.weekExtra=0;}
    }

    // Birthday.
    if(S.month===S.birthMonth && S.dayOfMonth===S.birthDay){
      S.age++; S.mental=clamp(S.mental+3);
      log(`Urodziny! Masz teraz ${S.age} lat. 🎂`);
    }

    if(window.FL27_checkScoutCases)FL27_checkScoutCases(); if(window.FL27_unifiedTick)FL27_unifiedTick(); if(window.FL27_familyArcTick)FL27_familyArcTick(); if(window.FL27_familyGift)FL27_familyGift(); if(window.FL27_familyLifeCheck)FL27_familyLifeCheck(); if(window.FL27_familyPositiveCheck)FL27_familyPositiveCheck(); if(window.fatherCoachOpportunity)fatherCoachOpportunity();
    if(window.checkGeneticsResearch)checkGeneticsResearch();
  }

  // No automatic +10 energy every day. Recovery comes primarily from sleep.
  S.energy=clamp(S.energy);
  saveSoon();
}

function train(real=true){

  if(window.FL27_travel)FL27_travel("club");

function playMatch(){
  if(window.FL27_matchMeeting && Math.random()<0.55){FL27_matchMeeting(S.opponent||"Rywal",[{name:["Kuba","Marek","Alex","Olek","Maja","Lena"][Math.floor(Math.random()*6)],role:"zawodnik/zawodniczka",age:S.age,}]);}
 if(S.injury>0){toast("Nie możesz zagrać z urazem.");return}
 const target=Number(S.nextMatchDay||7);
 if(S.day<target){
   const left=target-S.day;
   toast(`Mecz jest dopiero za ${left} ${left===1?"dzień":"dni"} ⚽`);
   log(`Sprawdzasz terminarz — najbliższy mecz za ${left} dni.`);
   saveSoon();render();return;
 }
 if(S.energy<28){toast("Za mało energii na mecz.");return}
 S.energy-=28;
 const rating=S.skill*.65+S.form*.25+S.mental*.1+(Math.random()*24-12);
 const opp=55+Math.random()*30;
 let gf=Math.max(0,Math.round((rating/42)+Math.random()*1.4-0.5));

 S.matches++;

 if(gf>ga){S.wins++;S.form=clamp(S.form+7);S.pr+=3}
 else if(gf===ga){S.draws++;S.form=clamp(S.form+2);S.pr+=1}
 else{S.losses++;S.form=clamp(S.form-5)}
 const personal=Math.random();
 let st={apps:1,starts:1,minutes:90,goals:0,assists:0,yellow:0,red:0,cleanSheets:ga===0?1:0};
 if(personal<.45){S.goals++;st.goals=1;S.pr+=2;log(`Mecz ${gf}:${ga} — ${result}. Strzelasz gola! ⚽`)}
 else if(personal<.72){S.assists++;st.assists=1;S.pr+=1;log(`Mecz ${gf}:${ga} — ${result}. Notujesz asystę.`)}
 else log(`Mecz ${gf}:${ga} — ${result}.`);
 if(Math.random()<.16){st.yellow=1;log("Dostajesz żółtą kartkę.");}
 if(ga===0 && S.pos==="BR"){log("Czyste konto! 🧤");}
 recordMatchStats(st);
 // Next fixture is a real in-game date, not a clickable label.
 S.nextMatchDay=S.day+7+Math.floor(Math.random()*8); // 7–14 days later
 advance(2);toast(`${result} • następny mecz: za ${S.nextMatchDay-S.day} dni`);randomEventChance("match");render()
}

function randomEventChance(context="day"){
 ensureEventHistory();
 // More events early in the career, but never the same event every few days.
 const history=S.eventHistory||{};
 const now=S.day;
 let available=EVENT_POOL.filter(e=>{
   const last=Number(history[e.id]||-9999);
   const cooldown=e.id==="first_media"?365:(e.id==="equipment"||e.id==="small_sponsor"?120:90);
   return now-last>=cooldown;
 });
 if(!available.length)return;
 const chance=S.age===15 ? .52 : .38;
 if(context==="match" && Math.random()<.35){
   // Match-related event gets a chance, but it is NOT forced and can never be the same one repeatedly.
   const matchEvents=available.filter(e=>e.id==="scout_stands"||e.id==="great_match"||e.id==="bad_match");
   if(matchEvents.length)available=matchEvents;
   else if(Math.random()>=chance)return;
 }else if(Math.random()>=chance)return;
 const e=available[Math.floor(Math.random()*available.length)];
 history[e.id]=now;
 S.eventHistory=history;
 S.usedEvents=Object.keys(history);
 saveSoon();openEvent(e);
}

<script>

(function(){

  window.FL27_relationLevel=function(p){
    if(!p)return "Nieznajomy";
    if(p.level<10)return "Nowa osoba";
    if(p.level<25)return "Znajomy/a";
    if(p.level<50)return "Dobry znajomy/a";

  };
  window.FL27_post=function(text,type){
    if(!R.social || (R.social.weeklyPost||0)>=1){toast("Możesz opublikować kolejny post za kilka dni.");return;}
    const reactions=Math.floor(Math.random()*9);
    const followers=Math.floor(3+Math.random()*25);
    R.social.posts.push({day:S.day,text,type,likes:reactions,followers,comments:Math.random()<.45?[{from:"obserwujący",text:["Mega! 🔥","Powodzenia w sezonie!","Ale forma 👀","Kiedy następny mecz?"][Math.floor(Math.random()*4)],reply:null}]:[]});
    R.social.followers+=followers; R.social.weeklyPost=1;
    if(window.FL27_life?.memories){

      if(FL27_life.memories.length>120)FL27_life.memories.shift();
      localStorage.setItem("FL27_UNIFIED_LIFE_V6",JSON.stringify(FL27_life));
    }
    const pr=type==="sport"?2:type==="life"?1:type==="fun"?1:0;

  window.FL27_comment=function(postIndex,text){

  window.FL27_replyComment=function(postIndex,commentIndex,text){

      ["like","Gwiazda polubiła Twój komentarz. 👀",2],

      ["none","Komentarz przeszedł bez reakcji. To normalne — większość takich wiadomości pozostaje bez odpowiedzi.",0]
    ];
    const weights=[.18,.08,.06,.68],r=Math.random();let sum=0,o=outcomes[3];
    for(let i=0;i<weights.length;i++){sum+=weights[i];if(r<sum){o=outcomes[i];break;}}
    if(o[0]!=="none"){
      R.social.noticedBy.push({star,day:S.day,type:o[0]});
      S.pr=Math.min(100,(S.pr||0)+o[2]);

  };

  window.FL27_relationSummary=function(){
    const sorted=R.people.slice().sort((a,b)=>b.level-a.level);

})();

<script>
/* FL27 UNIFIED LIFE CONSEQUENCES v6
   One persistent layer connecting family, father profession, relationships,
   school, football, social media, money, PR, health, time and career.
*/
(function(){
  const KEY="FL27_UNIFIED_LIFE_V6";
  function get(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}}
  function put(x){localStorage.setItem(KEY,JSON.stringify(x))}
  let L=get();
  L.flags??={};
  L.memories??=[];
  L.opportunities??=[];
  L.pending??=[];
  L.stats??={familyHelp:0,coachHelp:0,schoolEvents:0,socialEvents:0,scoutEvents:0};
  window.FL27_life=L;

  function addMemory(text,tags=[]){
    L.memories.push({day:Number(window.S?.day||1),text,tags});
    if(L.memories.length>120)L.memories.shift();
    put(L);
  }
  function change(field,amount,reason){
    if(!window.S)return;
    const n=Number(S[field]||0)+Number(amount||0);
    S[field]=typeof S[field]==="number"?Math.max(0,Math.min(100,n)):n;
    if(reason && window.log)log(reason);
  }

  // Father's occupation can matter, but never guarantees success.
  window.FL27_applyFatherInfluence=function(){
    if(!window.S?.familyProfile?.father)return;
    const job=String(S.familyProfile.father.job||"").toLowerCase();
    if(!(job.includes("trener")||job.includes("sport")||job.includes("wf")))return;
    if(L.flags.fatherCoachIntro)return;
    L.flags.fatherCoachIntro=true;
    L.stats.coachHelp++;
    const roll=Math.random();
    if(roll<.45){
      addMemory("Tata pomaga Ci lepiej zrozumieć trening i przygotowanie do meczu.",["family","football"]);
      change("mental",2,"👨‍👧 Tata, jako trener sportowy, pomaga Ci w przygotowaniu.");
    }else if(roll<.75){
      addMemory("Dzięki tacie poznajesz trenera lub osobę ze środowiska sportowego.",["family","network"]);
      change("pr",2,"🤝 Tata przedstawia Cię osobie ze środowiska sportowego.");
      L.opportunities.push({type:"network",availableFrom:Number(S.day||1)+1});
    }else{
      addMemory("Tata jest trenerem, ale nie chce mieszać rodziny z Twoją karierą.",["family"]);
      if(window.log)log("👨 Tata jest trenerem, ale tym razem nie ingeruje w Twoją karierę.");
    }
    put(L);
  };

  // School and club life feed each other.
  window.FL27_lifeEvent=function(type){
    const age=Number(S?.age||15);
    if(type==="school"){
      L.stats.schoolEvents++;
      const r=Math.random();
      if(r<.34){
        change("mental",2,"🏫 Nauczyciel zauważa, że dobrze organizujesz czas.");
        addMemory("Nauczyciel pomaga Ci pogodzić szkołę ze sportem.",["school","football"]);
      }else if(r<.67){
        change("pr",1,"🏫 Dobrze reprezentujesz szkołę.");
        addMemory("Szkolne wydarzenie poprawia Twój wizerunek.",["school","pr"]);
      }else{
        change("mental",-1,"🏫 Szkoła zabiera Ci więcej czasu niż zwykle.");
        addMemory("W tym tygodniu szkoła utrudnia pogodzenie obowiązków.",["school","time"]);
      }
    }
    if(type==="team"){
      const bonus=Math.random()<.5?1:0;
      if(bonus)change("skill",1,"⚽ Dobra atmosfera w drużynie pomaga Ci się rozwijać.");
      addMemory("Relacja z zespołem wpływa na Twoją codzienną formę.",["team","relations"]);
    }
    if(type==="social"){
      L.stats.socialEvents++;
      const r=Math.random();
      if(r<.5)change("mental",1,"👥 Dobre spotkanie ze znajomymi poprawia Ci humor.");
      else change("pr",-1,"📱/👥 Nieudana sytuacja towarzyska odbija się na wizerunku.");
      addMemory("Życie towarzyskie wpływa na Twoje samopoczucie i wizerunek.",["social"]);
    }
    put(L);
  };

  // After a meaningful football contact, create delayed consequences.
  window.FL27_registerScoutFollowup=function(id,club,contactDay){
    L.pending.push({type:"scout",id,club,day:Number(contactDay||S.day||1)+3});
    L.stats.scoutEvents++;
    put(L);
  };

  window.FL27_processPending=function(){
    if(!window.S)return;
    const day=Number(S.day||1);
    const due=L.pending.filter(x=>x.day<=day);
    L.pending=L.pending.filter(x=>x.day>day);
    due.forEach(x=>{
      if(x.type==="scout"){
        const r=Math.random();
        if(r<.62){
          addMemory(`Skaut wrócił z konkretną propozycją obserwacji w klubie ${x.club||"zewnętrznym"}.`,["scout","career"]);
          L.opportunities.push({type:"scout_trial",club:x.club||"zewnętrzny klub",createdDay:day});
          change("pr",2,"🔎 Skaut wraca po rozmowie z trenerem.");
        }else{
          addMemory("Skaut na razie nie wraca z dalszą propozycją.",["scout"]);
          if(window.log)log("📭 Skaut na razie nie podejmuje dalszych działań.");
        }
      }
    });
    put(L);
  };

  // Money choices feed life instead of being isolated purchases.
  window.FL27_recordLifePurchase=function(kind,cost){
    if(!window.S || Number(S.money||0)<Number(cost||0))return false;
    S.money-=Number(cost);
    if(kind==="boots"){change("skill",1,"👟 Nowe korki dają niewielką przewagę treningową.");}
    if(kind==="training"){change("fitness",1,"🏃 Sprzęt pomaga w treningu.");}
    if(kind==="home"){change("mental",1,"🏠 Lepsze warunki życia poprawiają komfort.");}
    if(kind==="car"){change("pr",1,"🚗 Lepszy samochód wpływa na komfort i wizerunek.");}
    addMemory(`Kupiono: ${kind}. Wydatek ${cost}€.`,["money","purchase"]);
    put(L);return true;
  };

  // Relationship strength has practical effects, but grows through repeated meetings.
  window.FL27_applyRelationshipEffects=function(){
    if(!window.FL27_rel || !window.S)return;
    const people=FL27_rel.people||[];
    const close=people.filter(p=>Number(p.level||0)>=50).length;
    const newFriends=people.filter(p=>Number(p.level||0)>=10).length;
    if(close>0 && Math.random()<.18)change("mental",1,"❤️ Bliskie relacje dają Ci wsparcie.");
    if(newFriends>=3 && Math.random()<.12)change("pr",1,"👥 Dobre kontakty społeczne poprawiają Twój wizerunek.");
  };

  window.FL27_unifiedTick=function(){
    try{
      FL27_applyFatherInfluence();
      FL27_processPending();
      FL27_applyRelationshipEffects();
      put(L);
    }catch(e){}
  };
})();
</script>

      if(Math.random()<.35){
        fp.father.job=job;
        addEvent("family","💼 Zmiana pracy taty",

    if(r<.74){

        addEvent("family","💼 Zmiana pracy mamy",

    if(r<.86){
      addEvent("family","🧳 Przeprowadzka rodziny",

        -2,0);
      F.opportunity={type:"move_discussion",createdDay:S.day};
      save(F);
      return;
    }
    addEvent("family","👨‍👩‍👧 Spokojniejszy okres w domu",
      "Tym razem nic dramatycznego się nie dzieje. Rodzina ma po prostu dobry okres, a stabilność pomaga Ci skupić się na swoim życiu.",
      2,0);

  // Positive family events also matter.
  window.FL27_familyPositiveCheck=function(){

      ["🏡 Spokojny weekend z rodziną","Odpoczywasz od futbolu i szkoły. Nie tracisz treningu — po prostu regenerujesz głowę.",2,0]

<script>
/* FL27 FAMILY PROFESSIONS + FUTURE STAFF v8 */
(function(){

  function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
  let P=load();
  P.hired??=[];
  P.offers??=[];
  P.salaryMarket??={
    physiotherapist:{min:1400,max:5000,typical:2800},
    coach:{min:1800,max:9000,typical:4000},
    teacher:{min:1200,max:4200,typical:2400},
    dietitian:{min:1800,max:6000,typical:3200},
    chef:{min:1600,max:5000,typical:2700},
    sports_psychologist:{min:2200,max:6500,typical:3500},
    scout:{min:2000,max:8000,typical:3600},
    doctor:{min:3500,max:12000,typical:6000},
    lawyer:{min:3000,max:10000,typical:5200},
    accountant:{min:1800,max:6000,typical:3000},
    fitness_trainer:{min:1800,max:6000,typical:3000},
    marketing:{min:2000,max:7500,typical:3500},
    mechanic:{min:1800,max:5500,typical:2800},
    physiologist:{min:2200,max:7000,typical:3800}
  };
  window.FL27_prof=P;

  function professionKey(job){
    const j=String(job||"").toLowerCase();
    if(j.includes("fizjoter"))return"physiotherapist";
    if(j.includes("trener"))return"coach";
    if(j.includes("nauczyc"))return"teacher";
    if(j.includes("diet"))return"dietitian";
    if(j.includes("kuchar"))return"chef";
    if(j.includes("psycholog"))return"sports_psychologist";
    if(j.includes("skaut"))return"scout";
    if(j.includes("lekar"))return"doctor";
    if(j.includes("prawnik"))return"lawyer";
    if(j.includes("księg"))return"accountant";
    if(j.includes("fitness"))return"fitness_trainer";
    if(j.includes("marketing"))return"marketing";
    if(j.includes("mechanik"))return"mechanic";
    if(j.includes("fizjolog"))return"physiologist";
    return null;
  }

  // Existing family professions can be useful, but only while that parent remains active/available.
  window.FL27_familyProfessionalHelp=function(kind){
    if(!window.S?.familyProfile)return false;
    const f=S.familyProfile;
    const candidates=[["father",f.father],["mother",f.mother]];
    const match=candidates.find(([_,p])=>professionKey(p?.job)===kind);
    if(!match)return false;

    const parent=match[1];
    const r=Math.random();
    if(r<.12){
      toast(`${parent.name} nie może teraz pomóc — ma własne obowiązki.`);
      return false;
    }
    if(r<.25){
      toast(`${parent.name} nie chce mieszać pracy z Twoją karierą.`);
      return false;
    }
    if(window.log)log(`👨‍👩‍👧 ${parent.name}, jako ${parent.job}, pomaga Ci bez dodatkowego kosztu.`);
    if(kind==="physiotherapist"){S.health=Math.min(100,(S.health||70)+3);S.injury=Math.max(0,(S.injury||0)-1);}
    if(kind==="coach"){S.skill=Math.min(100,(S.skill||50)+1);S.mental=Math.min(100,(S.mental||50)+1);}
    if(kind==="teacher"){S.mental=Math.min(100,(S.mental||50)+1);}
    if(kind==="dietitian"){S.fitness=Math.min(100,(S.fitness||60)+1);}
    if(kind==="chef"){S.health=Math.min(100,(S.health||70)+2);}
    if(kind==="doctor"){S.health=Math.min(100,(S.health||70)+4);}
    if(kind==="sports_psychologist"){S.mental=Math.min(100,(S.mental||50)+2);}
    return true;
  };

  // Future professional career: the player can offer jobs to relatives/known people.
  window.FL27_offerJobToParent=function(parentKey,role,salary){
    if(!window.S?.familyProfile)return;
    const parent=S.familyProfile[parentKey];
    if(!parent){toast("Nie znaleziono tej osoby.");return;}
    const key=professionKey(role)||role;
    const market=P.salaryMarket[key];
    if(!market){toast("Nie znam jeszcze widełek dla tego zawodu.");return;}
    salary=Number(salary);
    if(salary<market.min){toast(`To poniżej realnego minimum dla tej roli: około ${market.min}€ miesięcznie.`);return;}
    if(salary>market.max*2){toast("To bardzo wysoka oferta. Możesz ją złożyć, ale gra potraktuje ją jako wyjątkowo hojną.");}
    const acceptance=Math.min(.95,Math.max(.08,
      .45 + (salary-market.typical)/(market.typical*2)
      + (Math.random()*.30-.15)
    ));
    if(Math.random()>acceptance){
      log(`❌ ${parent.name} odrzuca ofertę pracy za ${salary}€ miesięcznie.`);
      toast(`${parent.name} nie przyjął/przyjęła oferty.`);
      return;
    }
    P.hired.push({name:parent.name,role,salary,relation:parentKey,day:S.day,status:"hired"});
    log(`🤝 ${parent.name} przyjmuje pracę: ${role}, ${salary}€ miesięcznie.`);
    save(P);render();
  };

  window.FL27_offerJobToPerson=function(personId,role,salary){
    const person=(window.FL27_rel?.people||[]).find(x=>x.id===personId);
    if(!person){toast("Nie znaleziono osoby.");return;}
    const key=professionKey(role)||role, market=P.salaryMarket[key];
    if(!market){toast("Brak danych rynku dla tego zawodu.");return;}
    salary=Number(salary);
    if(salary<market.min){toast(`Oferta jest zbyt niska. Orientacyjny rynek: ${market.min}–${market.max}€ miesięcznie.`);return;}
    const relationBonus=Number(person.level||0)>=50?.12:Number(person.level||0)>=25?.05:0;
    const acceptance=Math.min(.96,Math.max(.05,.35+relationBonus+(salary-market.typical)/(market.typical*2)+(Math.random()*.25-.125)));
    if(Math.random()>acceptance){
      log(`❌ ${person.name} odrzuca ofertę ${salary}€ miesięcznie.`);
      toast(`${person.name} odrzucił/a ofertę.`);
      return;
    }
    P.hired.push({name:person.name,role,salary,relation:person.id,day:S.day,status:"hired"});
    log(`🤝 ${person.name} przyjmuje pracę jako ${role} za ${salary}€ miesięcznie.`);
    save(P);render();
  };

  window.FL27_salaryMarket=function(role){
    return P.salaryMarket[professionKey(role)||role]||null;
  };

  window.FL27_professionSummary=function(){
    const f=S.familyProfile||{};
    return {
      father:f.father?{name:f.father.name,job:f.father.job,role:professionKey(f.father.job)}:null,
      mother:f.mother?{name:f.mother.name,job:f.mother.job,role:professionKey(f.mother.job)}:null,
      hired:P.hired.slice()
    };
  };
})();
</script>

<script>
/* FL27 FAMILY ARC v9 — dynamic family life, weighted toward ages 15–20 */
(function(){
  const KEY="FL27_FAMILY_ARC_V9";
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}}
  function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
  let A=load();
  A.profile??={wealth:"normal",fatherTime:"normal",fatherSupport:"normal",motherSupport:"normal",stability:"stable",lastEventDay:-999};
  A.events??=[];
  A.arcSeed??=Math.random();
  window.FL27_familyArc=A;

  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function add(title,text,effects={}){
    const day=Number(window.S?.day||1);
    A.events.push({day,title,text,effects});
    if(A.events.length>80)A.events.shift();
    A.profile.lastEventDay=day;
    if(window.S){
      if(effects.mental)S.mental=clamp((S.mental||50)+effects.mental,0,100);
      if(effects.money)S.money=Math.max(0,(S.money||0)+effects.money);
      if(effects.pr)S.pr=clamp((S.pr||0)+effects.pr,0,100);
    }
    if(window.log)log(`${title}: ${text}`);
    save(A);
  }

  // Family circumstances evolve, but not every week. The system becomes much quieter after 20.
  window.FL27_familyArcTick=function(){
    if(!window.S?.familyProfile)return;
    const age=Number(S.age||15);
    if(age<15 || age>25)return;
    const day=Number(S.day||1);
    const since=day-Number(A.profile.lastEventDay||-999);
    if(since<120)return;

    // Highest activity in 15–20, then progressively lower frequency.
    const chance=age<=17?.075:age<=20?.055:age<=22?.025:.012;
    if(Math.random()>chance)return;

    const f=S.familyProfile;
    const fatherJob=String(f.father?.job||"").toLowerCase();
    const motherJob=String(f.mother?.job||"").toLowerCase();

    // If father is an entrepreneur/business owner, wealth can change over time.
    if(fatherJob.includes("przedsiębior") && Math.random()<.45){
      const success=Math.random();
      if(success<.45){
        A.profile.wealth="high"; A.profile.fatherSupport="financial";
        add("📈 Tata odnosi sukces biznesowy",
          "Firma taty mocno się rozwija. Od teraz rodzina ma znacznie większe możliwości finansowe. Tata zaczyna kupować Ci rzeczy i częściej pomaga finansowo, ale przez pracę ma mniej czasu.",
          {mental:Math.random()<.5?2:-1,money:Math.round(150+Math.random()*500)});
      }else if(success<.65){
        A.profile.wealth="very_high"; A.profile.fatherTime="low"; A.profile.fatherSupport="financial";
        add("💰 Tata bardzo się wzbogaca",
          "Tata zaczyna zarabiać naprawdę dużo. Możesz liczyć na droższy sprzęt, samochód, wyjazdy czy większe kieszonkowe, ale jego życie zawodowe pochłania coraz więcej czasu.",
          {mental:Math.random()<.5?1:-2,money:Math.round(500+Math.random()*1500),pr:1});
      }else{
        A.profile.wealth="lower"; A.profile.fatherSupport="stressed";
        add("📉 Problemy w biznesie taty",
          "Firma ma słabszy okres. Rodzina musi ograniczyć część wydatków, a tata jest bardziej zestresowany.",
          {mental:-3,money:-Math.round(20+Math.random()*80)});
      }
      return;
    }

    // Generic career improvement/change for any father.
    if(Math.random()<.22){
      const positive=Math.random()<.62;
      if(positive){
        A.profile.fatherSupport="financial";
        add("💼 Zmiana sytuacji zawodowej taty",
          "Tata dostaje lepszą pracę lub awans. W domu pojawia się trochę więcej pieniędzy, ale jego dostępność dla rodziny może się zmienić.",
          {mental:Math.random()<.6?1:-1,money:Math.round(40+Math.random()*180)});
      }else{
        A.profile.fatherSupport="stressed";
        add("💼 Trudniejszy okres zawodowy taty",
          "Praca taty zaczyna wymagać więcej czasu i nerwów. Nie oznacza to problemów na stałe, ale przez jakiś czas w domu jest mniej spokoju.",
          {mental:-2});
      }
      return;
    }

    // Mother can have an independent career arc too.
    if(Math.random()<.22){
      const positive=Math.random()<.65;
      if(positive){
        A.profile.motherSupport="financial";
        add("💼 Mama ma lepszy okres w pracy",
          "Mama dostaje awans, lepszą pracę albo dodatkowe źródło dochodu. Rodzina zyskuje większą stabilność.",
          {mental:2,money:Math.round(30+Math.random()*130)});
      }else{
        A.profile.motherSupport="busy";
        add("⏰ Mama ma bardzo dużo pracy",
          "Mama jest ostatnio mocno zajęta. Nie chodzi o brak zainteresowania Tobą — po prostu ma mniej czasu.",
          {mental:-1});
      }
      return;
    }

    // Relationship/family stability changes.
    if(Math.random()<.14 && A.profile.stability==="stable"){
      A.profile.stability="strained";
      add("🏠 Napięty okres w domu",
        "W rodzinie pojawiają się napięcia. Nie ma jednego wielkiego wydarzenia — po prostu przez jakiś czas wszyscy mają więcej na głowie.",
        {mental:-2});
      return;
    }

    if(Math.random()<.20 && A.profile.stability==="strained"){
      A.profile.stability="stable";
      add("❤️ Sytuacja w domu się uspokaja",
        "Rodzina przechodzi przez trudniejszy okres, ale teraz jest spokojniej. Nie wszystko jest idealne, jednak możesz skupić się na swoim życiu.",
        {mental:2});
      return;
    }

    // Rare separation/new partner arc, never guaranteed.
    if(A.profile.stability==="stable" && Math.random()<.035){
      A.profile.stability="separated";
      add("💔 Rodzice podejmują trudną decyzję",
        "Rodzice rozstają się. Twoja codzienność zaczyna wyglądać inaczej i będziesz musieć nauczyć się funkcjonować w nowej sytuacji.",
        {mental:-6});
      return;
    }
    if(A.profile.stability==="separated" && Math.random()<.18){
      const parent=Math.random()<.5?"father":"mother";
      if(parent==="father")A.profile.fatherTime="new_family";
      else A.profile.motherSupport="new_family";
      add("❤️ Nowa osoba w życiu rodzica",
        `${parent==="father"?"Tata":"Mama"} zaczyna układać sobie życie na nowo. Możesz tę osobę polubić, mieć dystans albo potrzebować czasu — relacja będzie rozwijać się stopniowo.`,
        {mental:Math.random()<.5?1:-2});
      return;
    }

    // A positive "present but not rich" family event.
    if(Math.random()<.22){
      add("👨‍👩‍👧 Rodzinny czas",
        "Tym razem rodzina po prostu spędza razem trochę czasu. Bez wielkiego wydarzenia — zwykły, dobry dzień.",
        {mental:3});
    }
  };

  // Family wealth can affect allowance and gifts without becoming an unlimited money cheat.
  window.FL27_familyGift=function(){
    if(!window.S)return;
    const age=Number(S.age||15);
    if(age>20)return;
    const w=A.profile.wealth;
    if(w==="very_high" && Math.random()<.25){
      const amount=Math.round(100+Math.random()*500);
      S.money+=amount;
      add("🎁 Tata daje Ci pieniądze",
        `Tata chce, żebyś miał/a łatwiej. Dostajesz ${amount}€ na własne wydatki. Nie jest to jednak stała wypłata.`,
        {mental:1});
    }else if(w==="high" && Math.random()<.16){
      const amount=Math.round(50+Math.random()*200);
      S.money+=amount;
      add("🎁 Rodzice pomagają Ci finansowo",
        `Rodzice dokładają ${amount}€ do Twoich wydatków lub sprzętu.`,
        {mental:1});
    }
  };

  window.FL27_familyArcSummary=function(){return A};
})();
</script>

<script>
/* FL27 MOBILITY v10 — miejsce zamieszkania + transport wpływają na realny czas */
(function(){
  const KEY="FL27_MOBILITY_V10";
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}}
  function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
  let M=load();
  M.home??={town:"lokalna miejscowość",distanceToClub:4,distanceToSchool:2};
  M.transport??={bike:false,car:false,parentRide:true,publicTransport:true};
  M.bike??={owned:false,price:180,quality:"standard"};
  M.travelHistory??=[];
  window.FL27_mobility=M;

  const towns=[
    {name:"małe miasto",club:4,school:2,public:35},
    {name:"przedmieścia dużego miasta",club:7,school:3,public:25},
    {name:"centrum dużego miasta",club:3,school:2,public:15},
    {name:"wieś pod miastem",club:14,school:5,public:45},
    {name:"miasteczko sportowe",club:5,school:2,public:20}
  ];

  window.FL27_setHome=function(name){
    const t=towns.find(x=>x.name===name)||towns[0];
    M.home={town:t.name,distanceToClub:t.club,distanceToSchool:t.school};
    save(M);
  };

  window.FL27_buyBike=function(){
    if(M.bike.owned){toast("Masz już rower.");return false}
    const price=M.bike.price;
    if(Number(S.money||0)<price){toast(`Rower kosztuje ${price}€. Brakuje Ci pieniędzy.`);return false}
    S.money-=price;
    M.bike.owned=true;
    M.transport.bike=true;
    M.bike.quality=Math.random()<.2?"sportowy":"standard";
    log(`🚲 Kupujesz rower za ${price}€. Dojazdy na trening stają się szybsze.`);
    save(M);render();return true;
  };

  // Travel time is calculated from the current home, not from a fixed global number.
  window.FL27_travelHours=function(destination){
    const h=M.home;
    let base=destination==="club"?Number(h.distanceToClub||5):Number(h.distanceToSchool||2);
    let minutes=base*4; // rough walking/biking baseline in minutes per km
    if(M.transport.bike && destination==="club")minutes=Math.max(8,Math.round(base*2.3));
    else if(M.transport.car)minutes=Math.max(5,Math.round(base*1.4));
    else if(M.transport.parentRide)minutes=Math.max(10,Math.round(base*1.8));
    else if(M.transport.publicTransport)minutes=Math.max(15,Math.round(base*3.5));

    // Convert to hours, preserving partial hours for the schedule.
    return minutes/60;
  };

  window.FL27_travel=function(destination){
    const minutes=Math.round(FL27_travelHours(destination)*60);
    const hours=minutes/60;
    if(S.hour+hours>24){toast("Nie zmieści się już dziś ten dojazd.");return false}
    S.hour+=hours;
    M.travelHistory.push({day:S.day,destination,minutes,transport:M.transport.bike?"rower":M.transport.car?"samochód":M.transport.parentRide?"rodzic":"komunikacja"});
    if(M.travelHistory.length>100)M.travelHistory.shift();
    save(M);
    log(`🚗 Dojazd: ${destination==="club"?"klub":"szkoła"} • ${minutes} min • ${M.transport.bike?"rower":M.transport.car?"samochód":M.transport.parentRide?"rodzic":"komunikacja"}.`);
    return true;
  };

  window.FL27_mobilitySummary=function(){
    return {
      home:M.home,
      bike:M.bike,
      transport:M.transport,
      clubMinutes:Math.round(FL27_travelHours("club")*60),
      schoolMinutes:Math.round(FL27_travelHours("school")*60)
    };
  };
})();
</script>

<script>
/* FL27 MINOR RELOCATION + CLUB MOVE v11 */
(function(){
  const KEY="FL27_RELOCATION_V11";
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}}
  function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
  let R=load();
  R.moves??=[];
  R.pending??=[];
  R.current??={town:null,living:"parents"};
  R.conditions??=[];
  window.FL27_relocation=R;

  function familyDecision(clubCity,clubLevel){
    const age=Number(S?.age||15);
    const parents=S?.familyProfile||{};
    const income=String(parents.income||"").toLowerCase();
    const stability=window.FL27_familyArc?.profile?.stability||"stable";

    // A minor cannot simply decide to relocate alone.
    if(age<18){
      const base=0.55;
      const development=clubLevel==="academy_top"?0.18:clubLevel==="professional"?0.10:0;
      const familyPenalty=stability==="strained"?-0.18:stability==="separated"?-0.10:0;
      const roll=Math.random();
      const chance=Math.max(.18,Math.min(.88,base+development+familyPenalty));

      if(roll<chance){
        const options=[
          {type:"all_move",title:"👨‍👩‍👧 Cała rodzina się przeprowadza",text:`Rodzice zgadzają się, żebyś kontynuował/a karierę w ${clubCity}. Rodzina zaczyna organizować przeprowadzkę.`,mental:1},
          {type:"one_parent",title:"🚗 Jeden z rodziców jedzie z Tobą",text:"Rodzice nie chcą zmieniać całego życia, więc jeden z nich decyduje się tymczasowo przeprowadzić razem z Tobą.",mental:1},
          {type:"conditions",title:"📋 Rodzice stawiają warunek",text:"Zgadzają się, ale pod warunkiem dobrych wyników w szkole, bezpiecznego mieszkania/opieki i regularnego kontaktu z rodziną.",mental:0}
        ];
        // Wealth/family stability changes which option is more plausible.
        let pick=options[Math.floor(Math.random()*options.length)];
        if(stability==="separated" && Math.random()<.45)pick=options[1];
        R.pending.push({type:"move_accepted",city:clubCity,clubLevel,option:pick.type,createdDay:S.day});
        R.conditions=pick.type==="conditions"?["szkoła","opieka","kontakt z rodziną"]:[];
        save(R);
        if(window.log)log(`${pick.title}: ${pick.text}`);
        if(pick.mental)S.mental=Math.max(0,Math.min(100,(S.mental||50)+pick.mental));
        return pick;
      }else{
        const noOptions=[
          {type:"no",text:"Rodzice nie zgadzają się na przeprowadzkę na tym etapie."},
          {type:"wait",text:"Rodzice uważają, że to za wcześnie. Chcą, żeby klub najpierw pokazał, że naprawdę na Ciebie stawia."},
          {type:"condition",text:"Rodzice nie mówią „nie”, ale chcą najpierw konkretnej umowy, opieki i warunków mieszkaniowych."}
        ];
        const pick=noOptions[Math.floor(Math.random()*noOptions.length)];
        R.pending.push({type:"move_blocked",city:clubCity,createdDay:S.day,reason:pick.type});
        save(R);
        if(window.log)log(`🏠 ${pick.text}`);
        S.mental=Math.max(0,Math.min(100,(S.mental||50)-1));
        return pick;
      }
    }

    // At 18+, the player can decide independently, with financial consequences.
    return {type:"independent",text:"Masz 18 lat lub więcej — możesz sam/a zdecydować o przeprowadzce, kontrakcie i miejscu zamieszkania."};
  }

  window.FL27_offerRelocation=function(clubCity,clubLevel="professional"){
    if(!window.S)return;
    const age=Number(S.age||15);
    if(age>=18){
      const result=familyDecision(clubCity,clubLevel);
      log(`🏙️ Przeprowadzka do ${clubCity}: ${result.text}`);
      return result;
    }
    return familyDecision(clubCity,clubLevel);
  };

  window.FL27_completeMove=function(){
    const move=R.pending.find(x=>x.type==="move_accepted");
    if(!move){toast("Nie ma obecnie zaakceptowanej przeprowadzki.");return false;}
    R.current.town=move.city;
    R.current.living=move.option==="all_move"?"cała rodzina":move.option==="one_parent"?"z jednym rodzicem":"rodzice + opieka";
    R.moves.push({day:S.day,city:move.city,living:R.current.living,clubLevel:move.clubLevel});
    R.pending=R.pending.filter(x=>x!==move);

    // New location changes travel distance and creates a new-life reset.
    if(window.FL27_mobility){
      FL27_mobility.home.town=move.city;
      FL27_mobility.home.distanceToClub=3+Math.floor(Math.random()*6);
      FL27_mobility.home.distanceToSchool=2+Math.floor(Math.random()*4);
      FL27_mobility.travelHistory=[];
    }
    if(window.log)log(`📦 Przeprowadzka zakończona. Nowy dom: ${move.city}. Mieszkasz ${R.current.living}.`);
    save(R);render();return true;
  };

  // A move can change parents' work and family finances.
  window.FL27_moveFamilyLife=function(){
    const move=R.moves[R.moves.length-1];
    if(!move||move.day!==S.day)return;
    if(move.living==="cała rodzina" && window.S?.familyProfile){
      const jobChanges=Math.random()<.65;
      if(jobChanges){
        if(Math.random()<.5)S.familyProfile.father.job=["nauczyciel","mechanik","sprzedawca","trener sportowy","informatyk"][Math.floor(Math.random()*5)];
        else S.familyProfile.mother.job=["nauczycielka","księgowa","pracownica biurowa","fizjoterapeutka","sprzedawczyni"][Math.floor(Math.random()*5)];
        if(window.log)log("💼 Po przeprowadzce jedno z rodziców musi poukładać swoją pracę na nowo.");
      }
    }
  };
})();
</script>
