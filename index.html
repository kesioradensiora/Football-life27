<style>
/* FL LIFE 27 — responsive visual system based on the supplied logo */
:root{
  --bg:#111416;--panel:#191d20;--panel2:#202529;--line:#34393d;
  --text:#f5f4f1;--muted:#a2a5a7;--cream:#f1eadc;--gold:#d9aa4e;
  --gold2:#f0c96f;--red:#8d4d47;--blue:#6d7479;--green:#73766f;
  --shadow:0 24px 70px #0008;--r:18px
}
html,body{background:#111416;color:var(--text)}
body{background:
  radial-gradient(circle at 76% 5%,rgba(217,170,78,.10),transparent 27%),
  radial-gradient(circle at 12% 82%,rgba(255,255,255,.035),transparent 30%),
  linear-gradient(135deg,#15191c 0%,#101315 48%,#17191a 100%);
}
body:before{opacity:.18;background:linear-gradient(120deg,transparent 0 49%,#fff1 50% 50.5%,transparent 51%),repeating-linear-gradient(90deg,#fff0 0 119px,#ffffff05 120px 121px)}
.shell{background:transparent}
.side{background:linear-gradient(180deg,#1a1e21f5,#131719f5);border-right:1px solid #3a3f43;box-shadow:16px 0 50px #0004}
.brand{padding:8px 10px 20px}
.brand-logo{width:178px;height:62px}
.nav button{color:#b8bbbc}
.nav button:hover{background:#24292c;color:#fff}
.nav button.active{background:linear-gradient(90deg,#2b261d,#222628);border-color:#6d5730;color:#fff;box-shadow:inset 3px 0 var(--gold),0 7px 20px #0003}
.savebox{background:#1b2022;border-color:#3a4043}
.content{background:transparent}
.top{background:#171b1edc;border-bottom:1px solid #383e42;box-shadow:0 10px 30px #0002}
.avatar{background:linear-gradient(135deg,#3b3f42,#202427);border-color:#555b5f}
.pill{background:#202528;border-color:#3a4145;color:#b9bdbe}
.main{padding:28px;max-width:1580px}
.hero{background:linear-gradient(135deg,#262a2c 0%,#1c2123 58%,#28251d 100%);border-color:#44494d;box-shadow:var(--shadow)}
.card{background:linear-gradient(180deg,#202528,#181d20);border-color:#363d41;box-shadow:0 14px 38px #0003}
.card:hover{border-color:#50575b}
.metric{background:linear-gradient(135deg,#24292c,#1a1f21);border-color:#3a4145}
.btn{background:#252b2e;border-color:#464d51}
.btn:hover{background:#2d3438;border-color:#60686c}
.btn.gold{background:linear-gradient(135deg,var(--gold2),#a77a31);border-color:#e0b85f}
.item,.choice{background:#1a1f21;border-color:#363d40}
.badge{background:#242a2d;border-color:#42494d}
.progress{background:#30363a}
.progress i{background:linear-gradient(90deg,#a77a31,var(--gold2))}
.calendar-grid{background:#171c1e;border-color:#3b4246}
.cal-head{background:#262b2e;color:#a5aaac}
.cal-day{border-color:#30373a}
.cal-day.today{background:#302a1d;box-shadow:inset 0 0 0 1px #a17a35}
.event-dot{background:#253039}.event-dot.match{background:#402725}.event-dot.school{background:#25362d}.event-dot.media{background:#30283b}.event-dot.family{background:#3a3021}
.modal{background:#111416cc}
.sheet{background:#1b2022;border-color:#454c50}
.field input,.field select{background:#151a1c;border-color:#424a4e}
.start{background:
  radial-gradient(circle at 50% 17%,rgba(217,170,78,.14),transparent 22%),
  radial-gradient(circle at 20% 70%,rgba(255,255,255,.035),transparent 30%),
  linear-gradient(135deg,#15191c,#0f1315 60%,#191918)}
.start:before{opacity:.10;background:repeating-linear-gradient(90deg,transparent 0 119px,#d9aa4e10 120px 121px),repeating-linear-gradient(0deg,transparent 0 119px,#d9aa4e08 120px 121px)}
.startbox{background:#171b1deF;border-color:#45484a;box-shadow:0 35px 100px #0009}
.start-logo-image{filter:drop-shadow(0 14px 35px #0009)}
.cover{background:linear-gradient(135deg,#2a2925,#1b2122)}
.house-room{background:linear-gradient(135deg,#303431,#1c2122);border-color:#484e4d}
.car{background:linear-gradient(135deg,#2a3032,#181d1f);border-color:#454b4e}
.phone{background:#111517;border-color:#3d4346}
.post{background:#1b2022;border-color:#3a4245}
.post-body{background:linear-gradient(135deg,#303534,#1a2021)}
.toast{background:#202628;border-color:#555d60}

/* desktop = spacious cockpit; mobile = compact app-style navigation using the same state/actions */
@media(min-width:1200px){
  .shell{grid-template-columns:276px minmax(0,1fr)}
  .main{padding:34px 38px 50px}
  .hero{min-height:250px;padding:34px}
  .card{padding:20px}
  .nav button{padding:11px 13px}
}
@media(max-width:1050px) and (min-width:761px){
  .shell{grid-template-columns:224px minmax(0,1fr)}
  .main{padding:20px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  html,body{background:#15191b}
  body{padding-bottom:78px;background:
    radial-gradient(circle at 88% 0,rgba(217,170,78,.12),transparent 28%),
    linear-gradient(180deg,#181c1f 0%,#121618 100%)}
  body:before{opacity:.07}
  .shell{display:block;min-height:100vh}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:74px;padding:0 8px;overflow:hidden;z-index:220;border-right:0;border-top:1px solid #444b4f;border-radius:18px 18px 0 0;background:#202528f2;backdrop-filter:blur(18px);box-shadow:0 -18px 50px #0008}
  .brand,.savebox{display:none}
  .nav{display:flex;align-items:stretch;gap:5px;height:100%;overflow-x:auto;overflow-y:hidden;padding:7px 3px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:0 0 auto;min-width:72px;height:59px;padding:7px 6px;border:1px solid transparent;border-radius:12px;display:flex;flex-direction:column;justify-content:center;gap:3px;text-align:center;color:#aeb3b5;font-size:9px;line-height:1.05}
  .nav button.active{background:#312b21;border-color:#6e5832;box-shadow:inset 0 2px var(--gold),0 5px 14px #0003}
  .nav .ico{width:auto;font-size:18px;line-height:19px}
  .content{padding:0}
  .top{position:sticky;top:0;padding:9px 11px;background:#1b2023ef;backdrop-filter:blur(18px)}
  .hamb{display:none}
  .player-mini{min-width:0}.player-mini>div:last-child{min-width:0}.player-mini b{display:block;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top-stats{display:flex;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;max-width:53vw;scrollbar-width:none}.top-stats::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;padding:6px 8px;font-size:10px}
  .main{padding:12px 11px 96px}
  .hero{min-height:0;padding:21px 18px;border-radius:20px}
  .hero h1{font-size:34px;line-height:1.02}
  .grid{gap:10px}.card{border-radius:16px;padding:14px}.metric{padding:13px;border-radius:14px}.metric b{font-size:25px}
  .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.actions .btn{width:100%;min-height:42px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .calendar-grid{grid-template-columns:repeat(7,78px);border-radius:14px;overflow-x:auto}.calendar-grid>*{min-width:78px}.cal-head,.cal-day{min-height:88px;padding:7px}.event-dot{font-size:9px}
  .table{font-size:12px;display:block;overflow-x:auto;white-space:nowrap}
  .sheet{width:100%;max-height:88vh;border-radius:20px;padding:16px}
  .wizard{grid-template-columns:1fr}.start{padding:12px}.startbox{padding:21px 16px;border-radius:23px}.start-logo-image{width:min(420px,92vw);margin-bottom:14px}.startlogo{font-size:36px}.startbox .muted{font-size:14px!important}.startbox .actions{grid-template-columns:1fr}
  .phone{min-height:320px;border-width:4px;padding:11px}
  .cover{height:145px}.house-room,.car{min-height:120px}
  .toast{left:11px;right:11px;bottom:88px;max-width:none}
}

let game=null, current='day', calMode='month';
function ensureActivityDay(){ensureState(game);if(game.world.activity.date!==game.date){game.world.activity={date:game.date,counts:{},cooldowns:{},history:[]}}}
function cooldownLeft(key){ensureActivityDay();const until=game.world.activity.cooldowns[key];if(!until)return 0;const a=new Date(game.date+'T12:00:00'),b=new Date(until+'T12:00:00');return Math.max(0,Math.ceil((b-a)/86400000))}
function useActivity(key,minutes,energyCost=1,cooldownDays=0){if(!game)return false;ensureActivityDay();if(cooldownLeft(key)>0){toast('Ta czynność jest jeszcze niedostępna.');return false}if(hasEventConflict(minutes)){toast('Masz w tym czasie inne zaplanowane wydarzenie.');return false}if(game.player.energy<energyCost){toast('Za mało energii. Najpierw odpocznij.');return false}const count=game.world.activity.counts[key]||0;const dailyLimit=(key.includes('training')||key.includes('skill'))?1:99;if(count>=dailyLimit){toast('Dzisiejszy limit tej aktywności został wykorzystany.');return false}game.world.activity.counts[key]=count+1;game.world.activity.history.unshift({key,date:game.date,minutes});if(cooldownDays>0)game.world.activity.cooldowns[key]=addDays(game.date,cooldownDays);return true}
function hasEventConflict(minutes){if(!game)return false;const start=game.time,end=game.time+minutes;return game.world.calendar.some(e=>!e.done&&e.date===game.date&&start<e.time+e.duration&&end>e.time)}
function advance(minutes){if(!game)return;const p=game.player;const fatigueGain=Math.max(1,Math.round(minutes/35));const energyLoss=Math.max(1,Math.round(minutes/55));p.energy=clamp(p.energy-energyLoss,0,100);p.fatigue=clamp(p.fatigue+fatigueGain,0,100);game.time+=minutes;while(game.time>=1440){game.time-=1440;game.date=addDays(game.date,1);p.energy=clamp(p.energy+35,0,100);p.fatigue=clamp(p.fatigue-28,0,100);p.form=clamp(p.form+(p.fatigue<45?0.6:-0.3),0,100);game.world.activity={date:game.date,counts:{},cooldowns:{},history:[]};generateWorldIncident();}if(p.fatigue>=85){p.health=clamp(p.health-1,0,100);p.form=clamp(p.form-0.8,0,100)}}

function calendarView(){const d=new Date(game.date+'T12:00:00'),y=d.getFullYear(),m=game.world.monthView??d.getMonth();if(calMode==='week')return weekCalendar();const first=new Date(y,m,1),start=(first.getDay()+6)%7,total=daysIn(y,m);let cells='';for(let i=0;i<start;i++)cells+='<div class="cal-day mutedday"></div>';for(let n=1;n<=total;n++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,events=game.world.calendar.filter(e=>e.date===ds);cells+=`<button class="cal-day ${ds===game.date?'today':''}" onclick="openDay('${ds}')"><b>${n}</b>${events.slice(0,4).map(e=>`<span class="event-dot ${e.type}">${iconType(e.type)} ${esc(e.title)}</span>`).join('')}${events.length>4?`<span class="muted">+${events.length-4}</span>`:''}</button>`}return `<section class="hero"><div class="eyebrow">KALENDARZ</div><div class="row"><div><h1>${MONTHS[m]} ${y}</h1><div class="muted">Wszystkie terminy, mecze, szkoła, media, rodzina i własne plany w jednym miejscu.</div></div><div class="actions">${action('Miesiąc','calMode=\'month\';render()','btn gold')}${action('Tydzień','calMode=\'week\';render()','btn')}</div></div></section><section class="section card"><div class="actions" style="margin-bottom:10px">${action('‹','changeMonth(-1)','btn')}${action('Dziś','jumpToday()','btn')}${action('›','changeMonth(1)','btn')}</div><div class="calendar-grid">${WEEK.map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells}</div></section>`}
function changeMonth(n){let m=(game.world.monthView??new Date(game.date).getMonth())+n;if(m<0)m=11;if(m>11)m=0;game.world.monthView=m;render()}
function jumpToday(){game.world.monthView=new Date(game.date).getMonth();render()}
function openDay(ds){const ev=game.world.calendar.filter(e=>e.date===ds);modal(`<div class="row"><div><div class="eyebrow">${fmtDate(ds)}</div><h2>Plan dnia</h2></div>${action('✕','closeModal()','close')}</div>${ev.length?`<div class="list">${ev.map(e=>`<div class="item"><div class="row"><b>${iconType(e.type)} ${esc(e.title)}</b><span class="badge">${clockAt(e.time)}</span></div><div class="muted">${e.duration} min</div>${!e.done?action('Oznacz jako wykonane',`completeEvent('${e.id}')`,'btn green'): '<span class="badge">Wykonane</span>'}</div>`).join('')}</div>`:'<div class="empty">Brak zaplanowanych terminów.</div>'}`)}
function weekCalendar(){const base=new Date(game.date+'T12:00:00');const mon=new Date(base);mon.setDate(base.getDate()-((base.getDay()+6)%7));let days=[];for(let i=0;i<7;i++){const ds=new Date(mon);ds.setDate(mon.getDate()+i);const key=ds.toISOString().slice(0,10);days.push(`<div class="card"><div class="eyebrow">${WEEK[i]}</div><h3>${ds.getDate()} ${MONTHS[ds.getMonth()]}</h3>${game.world.calendar.filter(e=>e.date===key).map(e=>`<div class="item" style="margin-top:7px"><b>${clockAt(e.time)} ${esc(e.title)}</b><div class="muted small">${e.duration} min</div></div>`).join('')||'<div class="muted small">brak terminów</div>'}</div>`)}return `<section class="hero"><div class="row"><div><div class="eyebrow">TYDZIEŃ</div><h1>Plan tygodnia</h1></div>${action('Widok miesiąca','calMode=\'month\';render()','btn gold')}</div></section><section class="section grid g3">${days.join('')}</section>`}
function completeEvent(id){const e=game.world.calendar.find(x=>x.id===id);if(!e||e.done)return;if(e.date!==game.date)return toast('To wydarzenie jest innego dnia.');if(game.time>e.time+e.duration){e.done=true;e.missed=true;game.player.form=clamp(game.player.form-2,0,100);addHistory('Nieobecność','Nie zdążono na: '+e.title,'forma -2');save();render();return}const wait=Math.max(0,e.time-game.time);if(game.player.energy<Math.max(8,e.duration/90))return toast('Za mało energii na to wydarzenie.');game.time+=wait;e.done=true;advance(e.duration);if(e.type==='match'){game.player.season.matches++;game.player.season.minutes+=Math.min(90,e.duration);game.player.season.rating=clamp(game.player.season.rating+.04,1,10);game.player.careerStats.matches++;game.player.careerStats.minutes+=Math.min(90,e.duration);if(Math.random()<.18){game.player.season.goals++;game.player.careerStats.goals++}if(Math.random()<.22){game.player.season.assists++;game.player.careerStats.assists++}}if(e.type==='training'){game.player.form=clamp(game.player.form+1.5,0,100);game.player.coachTrust=clamp(game.player.coachTrust+.8,0,100)}if(e.type==='club'){game.player.coachTrust=clamp(game.player.coachTrust+3,0,100);game.player.popularity=clamp(game.player.popularity+.2,0,100)}if(e.title==='Egzamin na prawo jazdy'){const pass=game.player.license.eligibleAt&&game.date>=game.player.license.eligibleAt&&Math.random()<.72;if(pass){game.player.license.status='prawo jazdy';game.player.license.eligibleAt=null;addHistory('Prawo jazdy','Zdany egzamin — możesz legalnie prowadzić.','uprawnienia zdobyte')}else{game.player.license.eligibleAt=addDays(game.date,30);addHistory('Prawo jazdy','Egzamin niezdany — kolejny termin za 30 dni.','kolejny egzamin wpisany do kalendarza');game.world.calendar.push({id:uid('ev'),date:game.player.license.eligibleAt,time:16*60,title:'Ponowny egzamin na prawo jazdy',type:'legal',duration:120,done:false})}}addHistory('Termin wykonany',e.title,'czas -'+e.duration+' min');save();render()}

function publish(type,cost,minutes,boost){if(!useActivity('media_'+type,minutes,1,type==='post'?1:3))return;if(game.player.money<cost)return toast('Brakuje pieniędzy.');if(hasEventConflict(minutes))return toast('Masz w tym czasie inne wydarzenie.');game.player.money-=cost;advance(minutes);const reach=Math.round((30+game.player.popularity*8+game.player.ovr*4)*(1+Math.random()));const likes=Math.round(reach*(.04+Math.random()*.06));game.world.media.posts.unshift({id:uid('post'),author:game.world.media.handle,text:'Nowa publikacja',type,date:game.date,reach,likes,comments:Math.floor(likes*.05)});game.world.media.followers+=Math.max(1,Math.floor(likes*.12));game.world.media.likes+=likes;game.world.media.analytics.reach+=reach;game.world.media.analytics.engagement+=likes+Math.floor(likes*.05);game.player.popularity=clamp(game.player.popularity+boost,0,100);addHistory('Media','Opublikowano materiał.',`+${reach} zasięgu`);save();render()}
function createPost(){publish('post',0,45,.25)}function createVideo(){publish('video',120,120,.8)}
function mediaAction(type){if(type==='interview'){if(!useActivity('media_interview',60,1,3))return;if(hasEventConflict(60))return;advance(60);game.player.popularity=clamp(game.player.popularity+.5,0,100);addHistory('Media','Udzielono wywiadu.','popularność +0,5');save();render()}else publish('campaign',300,180,1.4)}
function sideView(){return `<section class="hero"><div class="eyebrow">ŻYCIE POZA BOISKIEM</div><h1>Kariera poboczna</h1><div class="muted">Nie jest to jeden przycisk „rozwijaj”. Każda ścieżka ma poziom, doświadczenie, sprzęt, projekty, portfolio, koszty, czas i konsekwencje.</div></section><section class="section grid g2">${game.world.side.map(j=>{const d=sideDefs.find(x=>x.id===j.id);return `<div class="card"><div class="row"><div><div style="font-size:32px">${d.icon}</div><h2>${d.name}</h2></div><span class="badge ${j.unlocked?'gold':''}">${j.unlocked?'odblokowana':'od '+d.unlock+' r.ż.'}</span></div><p class="muted">${d.desc}</p><div class="row"><b>Poziom ${Math.floor(j.level/10)+1}</b><span>${j.xp}/100 XP</span></div><div class="progress" style="margin:7px 0 12px"><i style="width:${j.xp}%"></i></div><div class="muted small">Projekty: ${j.projects} • portfolio: ${j.portfolio.length}</div><div class="actions" style="margin-top:12px">${action(j.unlocked?'📋 Wybierz projekt':'🔒 Zablokowane',`openSide('${j.id}')`,'btn gold')}${j.unlocked?action('🛒 Sprzęt',`sideGear('${j.id}')`,'btn'):''}</div></div>`}).join('')}</section>`}
function openSide(id){const j=game.world.side.find(x=>x.id===id),d=sideDefs.find(x=>x.id===id);if(!j.unlocked)return toast('Ta ścieżka jest jeszcze niedostępna.');const projects=[['Mały projekt',35,60],['Projekt średni',80,120],['Duży projekt',180,240]].map((x,i)=>({name:x[0],cost:x[1],time:x[2],xp:20+i*15}));modal(`<div class="row"><div><div class="eyebrow">${d.icon} ${d.name}</div><h2>Wybierz projekt</h2></div>${action('✕','closeModal()','close')}</div><div class="list">${projects.map(x=>`<button class="choice" onclick="sideProject('${id}',${x.cost},${x.time},${x.xp},'${x.name}')"><h3>${x.name}</h3><div class="muted">${money(x.cost)} • ${x.time} min • +${x.xp} XP</div></button>`).join('')}</div>`)}
function sideProject(id,cost,time,xp,name){const j=game.world.side.find(x=>x.id===id);if(!j||!j.unlocked)return;if(!useActivity('side_'+id,time,1,2))return;if(game.player.money<cost)return toast('Brakuje pieniędzy.');if(hasEventConflict(time))return toast('Masz w tym czasie inne wydarzenie.');game.player.money-=cost;advance(time);j.xp+=xp;j.projects++;while(j.xp>=100){j.xp-=100;j.level=clamp(j.level+10,0,100)}j.portfolio.unshift({name,date:game.date});game.player.popularity=clamp(game.player.popularity+(xp/60),0,100);closeModal();addHistory('Kariera poboczna',`${name}: ${sideDefs.find(x=>x.id===id).name}`,'portfolio +1');save();render()}
function sideGear(id){const j=game.world.side.find(x=>x.id===id);const item=rand(catalog.equipment);if(game.player.money<item[2])return toast('Brakuje pieniędzy na sprzęt.');game.player.money-=item[2];game.world.inventory.push({id:uid('it'),name:item[0],icon:item[1],forCareer:id});j.xp+=10;addHistory('Zakup sprzętu',item[0],'-'+money(item[2]));save();render();}
function contractsView(){return `<section class="hero"><div class="eyebrow">UMOWY</div><h1>Kontrakty i zobowiązania</h1><div class="muted">Umowy mają termin, wynagrodzenie i konsekwencje.</div></section><section class="section card"><div class="list">${game.world.contracts.map(x=>`<div class="item"><div class="row"><b>${esc(x.club||x.type)}</b><span class="badge">do ${fmtDate(x.until)}</span></div><div class="muted">${x.salary?money(x.salary)+'/mies.':''}</div></div>`).join('')||'<div class="empty">Brak aktywnych umów.</div>'}</div></section>`}
function homeView(){return `<section class="hero"><div class="eyebrow">DOM & MAJĄTEK</div><h1>Wybierz, gdzie chcesz mieszkać</h1><div class="muted">Każda nieruchomość ma prawdziwy wygląd, standard, liczbę pomieszczeń, komfort i wartość. Kliknij zdjęcie, żeby wejść do środka.</div></section><section class="section grid g3 property-grid">${game.world.properties.map((p,i)=>`<button class="property-card" onclick="openHome(${i})"><div class="property-photo" style="background-image:url('${esc(p.image||'https://torcy.eu/assets/modern_minimalist_family_house-eyzHiCPQ.png')}')"><span>${p.owned?'POSIADASZ':'RYNEK'}</span></div><div class="property-body"><div class="eyebrow">${esc(p.type)}</div><h2>${esc(p.name)}</h2><div class="muted">${esc(p.city)} • ${p.rooms} pokoi</div><div class="row property-meta"><b>${p.value?money(p.value):'rodzinny'}</b><span class="badge">komfort ${p.comfort}/100</span></div></div></button>`).join('')}${action('＋ Rynek nieruchomości','homeCatalog()','btn gold')}</section>`}

function homeCatalog(){modal(`<div class="row"><div><div class="eyebrow">RYNEK NIERUCHOMOŚCI</div><h2>Oglądaj nieruchomości</h2></div>${action('✕','closeModal()','close')}</div><div class="grid g2 property-catalog">${catalog.homes.map((x,i)=>`<button class="property-card" onclick="buyHome(${i})"><div class="property-photo" style="background-image:url('${esc(x[3])}')"><span>${esc(x[4])}</span></div><div class="property-body"><h3>${esc(x[0])}</h3><div class="muted">${money(x[2])} • ${i+3} pokoi</div></div></button>`).join('')}</div>`)}
function buyHome(i){const x=catalog.homes[i];if(game.player.money<x[2])return toast('Brakuje pieniędzy.');if(!useActivity('buy_home',30,1,0))return;game.player.money-=x[2];game.world.properties.push({id:uid('home'),name:x[0],type:'nieruchomość',city:game.player.city,value:x[2],comfort:50,owned:true,rooms:i+3,image:x[3]});advance(30);closeModal();addHistory('Nieruchomość','Kupiono '+x[0],'-'+money(x[2]));save();render()}
function expandHome(i){const p=game.world.properties[i],cost=Math.round((p.value||20000)*.08);if(game.player.money<cost)return toast('Brakuje pieniędzy.');if(!useActivity('home_upgrade_'+p.id,180,1,7))return;game.player.money-=cost;p.rooms++;p.comfort=clamp(p.comfort+7,0,100);p.value+=Math.round(cost*.8);advance(180);closeModal();addHistory('Remont','Rozbudowano '+p.name,'+'+p.rooms+' pok.');save();render()}
function garageView(){return `<section class="hero"><div class="eyebrow">GARAŻ</div><h1>Twój garaż</h1><div class="muted">Nie kupujesz ikony. Kupujesz konkretny samochód z wyglądem, przebiegiem, stanem, wartością i kosztami.</div></section><section class="section grid g3 garage-grid">${game.world.cars.map((c,i)=>`<button class="car-card" onclick="openCar(${i})"><div class="car-photo" style="background-image:url('${esc(c.image||'https://webcg.ismcdn.jp/mwimgs/d/9/640wm/img_d9aa7cdad7c7d05c95407fb136684dd9175065.jpg')}')"></div><div class="car-body"><div class="eyebrow">${esc(c.type||'SAMOCHÓD')}</div><h2>${esc(c.name)}</h2><div class="muted">${c.km.toLocaleString('pl-PL')} km • stan ${c.condition}%</div></div></button>`).join('')||'<div class="empty">Garaż jest pusty.</div>'}${action('🚘 Salon samochodowy','carCatalog()','btn gold')}</section>`}
function carCatalog(){modal(`<div class="row"><div><div class="eyebrow">SALON SAMOCHODOWY</div><h2>Konkretny model, konkretny rocznik</h2></div>${action('✕','closeModal()','close')}</div><div class="grid g2 garage-catalog">${CAR_DB.map((x,i)=>`<button class="car-card" onclick="buyCar(${i})"><div class="car-photo" style="background-image:url('${esc(x.image)}')"></div><div class="car-body"><h3>${esc(x.name)}</h3><div class="muted">${x.year} • ${x.hp} KM • ${x.engine}</div><div class="row"><span>${esc(x.drive)}</span><b>${money(x.price)}</b></div></div></button>`).join('')}</div>`)}
function buyCar(i){const x=CAR_DB[i];if(!x)return;if(game.player.money<x.price)return toast('Brakuje pieniędzy.');if(!useActivity('buy_car',45,1,0))return;game.player.money-=x.price;game.world.cars.push({id:uid('car'),name:x.name,year:x.year,hp:x.hp,engine:x.engine,drive:x.drive,image:x.image,type:x.type,price:x.price,km:0,condition:100,insurance:false,inspection:true});advance(45);closeModal();addHistory('Garaż','Kupiono '+x.name,`${x.year} • ${x.hp} KM • -${money(x.price)}`);save();render()}
function openCar(i){const c=game.world.cars[i];if(!c)return;modal(`<div class="row"><div><div class="eyebrow">GARAŻ • ${esc(c.type||'AUTO')}</div><h2>${esc(c.name)}</h2></div>${action('✕','closeModal()','close')}</div><div class="car-detail-photo" style="background-image:url('${esc(c.image)}')"></div><div class="grid g4"><div class="metric"><span>Rocznik</span><b>${c.year||'—'}</b></div><div class="metric"><span>Moc</span><b>${c.hp||'—'} KM</b></div><div class="metric"><span>Silnik</span><b>${esc(c.engine||'—')}</b></div><div class="metric"><span>Napęd</span><b>${esc(c.drive||'—')}</b></div><div class="metric"><span>Przebieg</span><b>${Number(c.km||0).toLocaleString('pl-PL')} km</b></div><div class="metric"><span>Stan</span><b>${c.condition||100}%</b></div><div class="metric"><span>Ubezpieczenie</span><b>${c.insurance?'ważne':'brak'}</b></div><div class="metric"><span>Przegląd</span><b>${c.inspection?'ważny':'do zrobienia'}</b></div></div><div class="actions" style="margin-top:15px">${action('🔧 Serwis','serviceCar('+i+')','btn gold')}${action('🚗 Jedź','driveCar('+i+')','btn')}${action('📋 Dokumenty auta','carDocuments('+i+')','btn')}</div>`)}
function equipmentCatalog(){modal(`<div class="row"><div><div class="eyebrow">SPRZĘT</div><h2>Elektronika i twórczość</h2></div>${action('✕','closeModal()','close')}</div><div class="grid g2">${catalog.equipment.map((x,i)=>`<button class="choice" onclick="buyEquip(${i})"><div style="font-size:35px">${x[1]}</div><h3>${x[0]}</h3><div class="muted">${money(x[2])}</div></button>`).join('')}</div>`)}
function buyWear(i){const x=catalog.clothes[i];if(game.player.money<x[2])return toast('Brakuje pieniędzy.');game.player.money-=x[2];game.world.wardrobe.push({name:x[0],icon:x[1],date:game.date});closeModal();addHistory('Zakup','Kupiono '+x[0],'-'+money(x[2]));save();render()}

function claimPackage(){const key='lastPackage',last=game.world.settings[key];if(last&&Math.floor((new Date(game.date)-new Date(last))/86400000)<14)return toast('Następna paczka będzie dostępna za mniej niż 14 dni.');if(!useActivity('pr_package',15,1,14))return;game.world.settings[key]=game.date;const item=rand([['Koszulka sponsora','👕'],['Czapka klubowa','🧢'],['Piłka treningowa','⚽'],['Słuchawki','🎧']]);game.world.inventory.push({name:item[0],icon:item[1],date:game.date});advance(15);addHistory('Paczka PR','Odebrano paczkę.',item[0]);save();render()}
function financeView(){const f=game.world.finance;return `<section class="hero"><div class="eyebrow">FINANSE</div><h1>${money(game.player.money)}</h1><div class="muted">Dochody, wydatki, oszczędności i zobowiązania są częścią jednego portfela.</div></section><section class="section grid g4"><div class="metric"><span>Gotówka</span><b>${money(game.player.money)}</b></div><div class="metric"><span>Oszczędności</span><b>${money(f.savings)}</b></div><div class="metric"><span>Dług</span><b>${money(f.debt)}</b></div><div class="metric"><span>Transakcje</span><b>${f.transactions.length}</b></div></section><section class="section card"><h2>Operacje</h2><div class="actions">${action('🏦 Odłóż 100 zł','bankMove(100)','btn gold')}${action('💸 Wypłać 100 zł','bankMove(-100)','btn')}${action('📒 Historia','financeHistory()','btn')}</div></section>`}
function bankMove(v){const abs=Math.abs(v);if(!useActivity('bank',15,1,0))return;if(v>0&&game.player.money<v)return toast('Brakuje gotówki.');if(v<0&&game.world.finance.savings<abs)return toast('Brakuje oszczędności.');game.player.money-=v;game.world.finance.savings+=v;game.world.finance.transactions.unshift({date:game.date,value:-v});advance(15);save();render()}
function financeHistory(){modal(`<div class="row"><h2>Historia finansowa</h2>${action('✕','closeModal()','close')}</div>${game.world.finance.transactions.map(x=>`<div class="item"><b>${fmtDate(x.date)}</b><span style="float:right">${x.value>0?'+':''}${money(x.value)}</span></div>`).join('')||'<div class="empty">Brak transakcji.</div>'}`)}
function relationsView(){return `<section class="hero"><div class="eyebrow">RELACJE</div><h1>Ludzie, których poznajesz</h1><div class="muted">Relacje mają pamięć, poziom bliskości i kolejne sytuacje.</div></section><section class="section grid g3">${game.world.relations.map((r,i)=>`<div class="card"><div style="font-size:30px">${r.icon}</div><h3>${esc(r.name)}</h3><div class="muted">${r.type}</div><div class="progress" style="margin:10px 0"><i style="width:${r.level}%"></i></div><div class="row"><span>bliskość</span><b>${r.level}</b></div>${action('Porozmawiaj',`relationMeet(${i})`,'btn')}</div>`).join('')||'<div class="empty">Jeszcze nikogo tu nie ma. Miasto i szkoła będą tworzyć nowe kontakty.</div>'}${action('➕ Poznaj kogoś','meetPerson()','btn gold')}</section>`}

function specialistsView(){return `<section class="hero"><div class="eyebrow">SPECJALIŚCI</div><h1>Zdrowie i profesjonalne wsparcie</h1><div class="muted">Wizyty kosztują, zajmują czas i zapisują się w kalendarzu.</div></section><section class="section grid g3">${['Lekarz sportowy','Fizjoterapeuta','Psycholog sportu','Dietetyk','Dentysta','Trener indywidualny'].map((x,i)=>`<div class="card"><div style="font-size:34px">${['🩺','🦵','🧠','🥗','🦷','🏋️'][i]}</div><h3>${x}</h3><div class="muted">${80+i*25} zł • konsultacja 60 min</div>${action('Umów wizytę',`bookSpecialist('${x}',${80+i*25})`,'btn gold')}</div>`).join('')}</section>`}

function educationView(){return `<section class="hero"><div class="eyebrow">EDUKACJA</div><h1>Szkoła, języki i kursy</h1><div class="muted">Nauka konkuruje o czas z piłką, ale daje długoterminowe możliwości.</div></section><section class="section grid g3">${[['Angielski B1',80,60],['Niemiecki A2',65,60],['Montaż wideo',120,90],['Marketing',100,90],['Podstawy finansów',90,75],['Prawo sportowe',140,120]].map((x,i)=>`<div class="card"><h3>📚 ${x[0]}</h3><div class="muted">${money(x[1])} • ${x[2]} min</div>${action('Zapisz się',`takeCourse('${x[0]}',${x[1]},${x[2]})`,'btn')}</div>`).join('')}</section>`}
function takeCourse(name,cost,min){const key='course_'+name;if(!useActivity(key,min,1,3))return;if(game.player.money<cost)return toast('Brakuje pieniędzy.');if(hasEventConflict(min))return toast('Masz w tym czasie zaplanowane wydarzenie.');game.player.money-=cost;advance(min);game.player.education.courses.push({name,date:game.date,stage:1});const lang=name.includes('Angielski')?'Angielski':name.includes('Niemiecki')?'Niemiecki':null;if(lang)game.player.languages[lang]=clamp((game.player.languages[lang]||0)+8,0,100);addHistory('Edukacja','Ukończono jeden etap nauki.',name);save();render()}
function schoolTest(){const ev=game.world.calendar.find(e=>e.type==='schooltest'&&!e.done);if(!ev)return toast('Brak zaplanowanego sprawdzianu.');if(game.date!==ev.date||game.time<ev.time)return toast(`Sprawdzian jest ${fmtDate(ev.date)} o ${clockAt(ev.time)}.`);if(!useActivity('school_test',60,1,7))return;advance(60);const prepared=game.player.education.courses.length>0;const result=prepared?rand(['dobry','bardzo dobry','dobry']):rand(['dostateczny','dobry','dopuszczający']);ev.done=true;addHistory('Sprawdzian',`Wynik: ${result}.`,prepared?'Przygotowanie pomogło.':'Wynik bez dodatkowego przygotowania.');save();render()}
function settingsView(){return `<section class="hero"><div class="eyebrow">USTAWIENIA</div><h1>Gra i zapis</h1><div class="actions" style="margin-top:15px">${action('💾 Zapisz','save()','btn gold')}${action('📖 Samouczek','showTutorial()','btn')}${action('↩️ Ekran startowy','showStart()','btn')}${action('⚠️ Usuń ten zapis',`deleteCurrent()`,'btn red')}</div></section><section class="section card"><h2>Stan techniczny</h2><div class="muted">Jeden stan gry • slot ${game.slot}/5 • ostatni zapis ${new Date(game.updatedAt).toLocaleString('pl-PL')}</div></section>`}
function deleteCurrent(){if(confirm('Usunąć ten slot?')){clearSlot(game.slot);game=null;showStart()}}
function showStart(){document.getElementById('start').classList.remove('hidden');renderStart()}
function licenseTick(){ensureState(game);const l=game.player.license;if(l.bannedUntil&&game.date>=l.bannedUntil){l.status='prawo jazdy odzyskane';l.bannedUntil=null;game.world.notifications.unshift({id:uid('n'),date:game.date,text:'Możesz ponownie prowadzić samochód — okres zatrzymania prawa jazdy zakończył się.'});game.world.calendar.push({id:uid('ev'),date:game.date,time:10*60,title:'Powiadomienie: prawo jazdy odzyskane',type:'legal',duration:10,done:false});addHistory('Prawo jazdy','Okres zatrzymania prawa jazdy zakończony.','możesz ponownie prowadzić')}}
function generateWorldIncident(){ensureState(game);const p=game.player,l=p.license;const pool=[];if(p.age>=15)pool.push({title:'🏁 Wyścigi na torze',text:'Znajomi proponują wyjazd na legalne wydarzenie motoryzacyjne. Możesz kupić bilet i oglądać albo zostać na treningu.',opts:[['Jadę na tor','resolveLifeEvent("race_event")'],['Zostaję','resolveLifeEvent("decline")']]});if(p.age>=17&&l.status!=='zatrzymane'&&l.status!=='odebrane')pool.push({title:'🚗 Mandat za zbyt szybką jazdę',text:'Wracając z treningu, patrol zatrzymuje Cię do kontroli. Masz wybór: przyjąć mandat albo wyjaśnić sytuację.',opts:[['Przyjmuję mandat','resolveLifeEvent("speed_ticket")'],['Próbuję wyjaśnić','resolveLifeEvent("explain_ticket")']]});if(p.age>=18&&l.status==='brak prawa jazdy')pool.push({title:'🪪 Możesz rozpocząć kurs prawa jazdy',text:'Masz odpowiedni wiek. Kurs wymaga pieniędzy, czasu i późniejszego egzaminu.',opts:[['Zapisuję się','resolveLifeEvent("driving_course")'],['Jeszcze nie','resolveLifeEvent("decline")']]});if(p.age>=17&&l.status!=='zatrzymane')pool.push({title:'🛞 Pożyczasz auto znajomego',text:'Krótka przejażdżka może być niewinna, ale ryzyko mandatu lub szkody ponosisz Ty.',opts:[['Jadę spokojnie','resolveLifeEvent("safe_drive")'],['Jadę agresywnie','resolveLifeEvent("risky_drive")']]});if(!pool.length)return;const used=game.world.events.filter(e=>e.status==='pending').map(e=>e.title);const available=pool.filter(e=>!used.includes(e.title));if(!available.length)return;const x=rand(available);game.world.events.unshift({id:uid('evt'),date:game.date,title:x.title,text:x.text,opts:x.opts,status:'pending',kind:'world'});game.world.events=game.world.events.slice(0,60);game.world.notifications.unshift({id:uid('n'),date:game.date,text:x.title});save()}
function openLifeEvent(id){const e=game.world.events.find(x=>x.id===id&&x.status==='pending');if(!e)return toast('To wydarzenie już nie jest dostępne.');modal(`<div class="row"><div><div class="eyebrow">WYDARZENIE • ${fmtDate(e.date)}</div><h2>${esc(e.title)}</h2></div>${action('✕','closeModal()','close')}</div><p class="muted">${esc(e.text)}</p><div class="actions" style="margin-top:18px">${e.opts.map(o=>action(o[0],o[1],'btn gold')).join('')}</div>`)}
function carDocuments(i){const c=game.world.cars[i];if(!c)return;modal(`<div class="row"><h2>Dokumenty • ${esc(c.name)}</h2>${action('✕','closeModal()','close')}</div><div class="list"><div class="item"><b>Rok produkcji</b><span>${c.year}</span></div><div class="item"><b>Moc</b><span>${c.hp} KM</span></div><div class="item"><b>Silnik</b><span>${esc(c.engine)}</span></div><div class="item"><b>Przegląd</b><span>${c.inspection?'ważny':'wymaga wizyty'}</span></div><div class="item"><b>Ubezpieczenie</b><span>${c.insurance?'ważne':'brak'}</span></div></div>`)}
function serviceCar(i){const c=game.world.cars[i];if(!c)return;if(game.player.money<350)return toast('Serwis kosztuje 350 zł.');if(!useActivity('car_service_'+c.id,90,1,30))return;game.player.money-=350;c.condition=clamp(c.condition+20,0,100);c.insurance=true;c.inspection=true;advance(90);addHistory('Serwis auta',c.name,'-350 zł • stan +20');save();render()}
function driveCar(i){const c=game.world.cars[i];if(!c)return;const l=game.player.license;if(game.player.age<18)return toast('Nie masz jeszcze wieku do legalnego prowadzenia auta.');if(l.status==='zatrzymane'||l.status==='odebrane'||l.status==='brak prawa jazdy')return toast('Nie możesz legalnie prowadzić tego samochodu.');if(!c.insurance||!c.inspection)return toast('Auto nie ma ważnych dokumentów.');if(!useActivity('drive_'+c.id,60,1,1))return;advance(60);c.km+=Math.floor(15+Math.random()*85);c.condition=clamp(c.condition-(Math.random()<.22?3:1),0,100);const risk=Math.random();if(risk<.08){game.player.license.points+=2;game.player.money=Math.max(0,game.player.money-200);game.world.notifications.unshift({id:uid('n'),date:game.date,text:'Otrzymano mandat 200 zł i 2 punkty karne.'});addHistory('Mandat drogowy','Podczas jazdy otrzymano mandat.','-200 zł • +2 pkt')}else if(risk<.11){l.status='zatrzymane';l.bannedUntil=addDays(game.date,30);l.history.push({date:game.date,reason:'poważne wykroczenie',until:l.bannedUntil});game.world.notifications.unshift({id:uid('n'),date:game.date,text:'Prawo jazdy zatrzymane na 30 dni.'});game.world.calendar.push({id:uid('ev'),date:l.bannedUntil,time:10*60,title:'Możesz ponownie prowadzić — koniec zatrzymania prawa jazdy',type:'legal',duration:10,done:false});addHistory('Prawo jazdy zatrzymane','Poważne wykroczenie drogowe.','zakaz prowadzenia 30 dni')}else addHistory('Przejażdżka',c.name,`+${c.km} km`);save();render()}
function wardrobeView(){return `<section class="hero"><div class="eyebrow">SZAFA & SPRZĘT</div><h1>Wyposażenie zawodnika</h1><div class="muted">Konkretny model, konkretna technologia, zużycie i wpływ na trening. Założone wyposażenie może dawać niewielkie premie.</div></section><section class="section"><div class="store-note">Zdjęcia produktów są wizualnymi materiałami producentów; modele i parametry są oparte na aktualnych kartach produktów Nike/adidas. urlNike Academyhttps://www.nike.com/pl/w/nike-academy-1gdj0z3cii8z7yfbz9w87t</div><div class="actions" style="margin-top:14px">${action('🛍️ Sklep','wardrobeCatalog()','btn gold')}${action('🎒 Sprzęt dodatkowy','equipmentCatalog()','btn')}</div><div class="grid wardrobe-grid" style="margin-top:16px">${game.world.wardrobe.map((x,i)=>`<div class="wardrobe-item"><div class="wardrobe-photo" style="background-image:url('${esc(x.image||'')}')"></div><div class="wardrobe-body"><div class="eyebrow">${esc(x.brand||'MARKA')} ${x.equipped?'• ZAŁOŻONE':''}</div><h3>${esc(x.name)}</h3><div class="muted">${esc(x.category||'wyposażenie')}</div>${x.effects?.text?`<span class="gear-effect">${esc(x.effects.text)}</span>`:''}<div class="wear-bar"><i style="width:${clamp(x.durability??100,0,100)}%"></i></div><small class="muted">Zużycie: ${Math.round(x.durability??100)}%</small><div class="actions" style="margin-top:10px">${action(x.equipped?'Zdejmij':'Załóż',`toggleWear(${i})`,'btn')}${(x.durability??100)<75?action('Napraw / odśwież',`repairWear(${i})`,'btn gold'):''}</div></div></div>`).join('')||'<div class="empty">Nie masz jeszcze żadnego wyposażenia.</div>'}</div></section>`}
function wardrobeCatalog(){modal(`<div class="row"><div><div class="eyebrow">SKLEP SPORTOWY</div><h2>Odzież • obuwie • ochrona</h2></div>${action('✕','closeModal()','close')}</div><div class="store-note">Technologie mają znaczenie: Dri-FIT odprowadza wilgoć, Therma-FIT pomaga utrzymać ciepło, a ochraniacze wpływają na bezpieczeństwo. urlSprawdź przykładową ofertę Nike Academyhttps://www.nike.com/pl/w/nike-academy-1gdj0z3cii8z7yfbz9w87t</div><div class="grid g2" style="margin-top:14px">${CLOTH_DB.map((x,i)=>`<button class="car-card" onclick="buyWearReal(${i})"><div class="car-photo" style="background-image:url('${esc(x.image)}')"></div><div class="car-body"><div class="eyebrow">${esc(x.brand)}</div><h3>${esc(x.name)}</h3><div class="muted">${esc(x.category)}</div><div class="row" style="margin-top:8px"><span>${esc(x.effects?.text||'wyposażenie')}</span><b>${money(x.price)}</b></div></div></button>`).join('')}</div>`)}
function buyWearReal(i){const x=CLOTH_DB[i];if(!x)return;if(game.player.money<x.price)return toast('Brakuje pieniędzy.');if(!useActivity('clothing_'+x.name,30,1,0))return;game.player.money-=x.price;game.world.wardrobe.push({...x,date:game.date,durability:100,equipped:false});advance(30);closeModal();addHistory('Zakup wyposażenia',x.name,'-'+money(x.price));save();render()}
function toggleWear(i){const x=game.world.wardrobe[i];if(!x)return;x.equipped=!x.equipped;save();render()}
function repairWear(i){const x=game.world.wardrobe[i];if(!x)return;const cost=Math.max(20,Math.round((100-(x.durability??100))*2));if(game.player.money<cost)return toast('Brakuje pieniędzy na serwis.');if(!useActivity('repair_'+i,45,1,3))return;game.player.money-=cost;x.durability=100;advance(45);addHistory('Serwis wyposażenia','Odświeżono '+x.name,'-'+money(cost));save();render()}
function nationalityProfile(){ensureState(game);const p=game.player,f=game.world.family,candidates=[];const base=p.country||'Polska';candidates.push({country:base,reason:'obywatelstwo/miejsce życia',status:'potencjalnie dostępne'});f.parents.forEach(par=>{if(!candidates.some(x=>x.country===par.nationality))candidates.push({country:par.nationality,reason:'pochodzenie rodzica',status:'sprawdź dokumenty i związek z krajem'})});return candidates}
function nationalView(){const n=game.world.national,cands=nationalityProfile();return `<section class="hero"><div class="eyebrow">REPREZENTACJA</div><h1>Droga do kadry</h1><div class="muted">Etap ${esc(n.stage)} • ${esc(n.status)} • występy ${n.caps}</div></section><section class="section grid g2"><div class="card"><h2>Możliwe związki reprezentacyjne</h2>${cands.map(x=>`<div class="item"><div class="row"><b>${COUNTRY_DB[x.country]?.flag||'🌍'} ${esc(x.country)}</b><span class="badge">${esc(x.status)}</span></div><div class="muted">Podstawa: ${esc(x.reason)}</div></div>`).join('')}<p class="muted small">Gra rozróżnia obywatelstwo, urodzenie, pochodzenie i długość pobytu. Przy samym pobycie nie zakładamy automatycznie prawa do kadry.</p></div><div class="card"><h2>Raport sportowy</h2><p class="muted">Powołanie zależy od poziomu sportowego, formy, minut, pozycji, zaufania trenera i konkurencji.</p>${action('Sprawdź raport','nationalReport()','btn gold')}${action('Przygotuj dokumenty','prepareNationality()','btn')}</div></section><section class="section card"><h2>Zgrupowania i obozy</h2>${n.camps.map(x=>`<div class="item"><b>${esc(x.name)}</b><div class="muted">${fmtDate(x.date)} • ${esc(x.result||'')}</div></div>`).join('')||'<div class="empty">Brak zgrupowań.</div>'}</section>`}
function prepareNationality(){if(!useActivity('national_docs',45,1,14))return;advance(45);game.world.notifications.unshift({id:uid('n'),date:game.date,text:'Dokumenty reprezentacyjne przygotowane — sprawdź status obywatelstwa i związku z krajem.'});addHistory('Dokumenty reprezentacyjne','Przygotowano dokumenty dotyczące uprawnienia do reprezentowania kraju.');save();render()}

function newCareerPrompt(){const empty=allSlots().findIndex(x=>!x);if(empty>=0)return newCareerWizard(empty+1);toast('Wszystkie 5 slotów jest zajęte — usuń jeden zapis.');}

function newCareerWizard(slot){const f=firstM[0];modal(`<div class="row"><div><div class="eyebrow">NOWA KARIERA • SLOT ${slot}</div><h2>Utwórz zawodnika</h2></div>${action('✕','closeModal()','close')}</div><div class="wizard"><div class="field"><label>Imię</label><input id="nf" value="${f}"></div><div class="field"><label>Nazwisko</label><input id="nl" value="Nowak"></div><div class="field"><label>Wiek</label><select id="na"><option>15</option><option>16</option><option>17</option></select></div><div class="field"><label>Płeć</label><select id="ng"><option value="M">Mężczyzna</option><option value="K">Kobieta</option></select></div><div class="field"><label>Pozycja</label><select id="np">${POS.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Miasto</label><select id="nc">${cities.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="actions" style="margin-top:18px">${action('Stwórz świat','finishWizard('+slot+')','btn gold')}</div>`)}
function finishWizard(slot){const g=document.getElementById('ng').value,a=+document.getElementById('na').value;game=freshState(slot);game.player.first=document.getElementById('nf').value.trim()||'Nowy';game.player.last=surname(game.player.first,document.getElementById('nl').value.trim()||'Nowak',g);game.player.gender=g;game.player.age=a;game.player.position=document.getElementById('np').value;game.player.city=document.getElementById('nc').value;game.player.country=CITY_COUNTRY[game.player.city]||'Polska';const cc=COUNTRY_DB[game.player.country]||COUNTRY_DB.Polska;game.player.currency=cc.currency;game.player.currencySymbol=cc.symbol;game.player.languages={[cc.language]:100};game.world.side.forEach((j)=>{const d=sideDefs.find(x=>x.id===j.id);j.unlocked=a>=d.unlock});game.world.properties[0].city=game.player.city;game.slotMeta.name=game.player.first+' '+game.player.last;game.world.settings.tutorial=true;seedCalendar();closeModal();document.getElementById('start').classList.add('hidden');save();current='day';render();showTutorial()}
