<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Life 27</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.a{max-width:520px;margin:auto;padding-bottom:80px}.top{position:sticky;top:0;background:#091629ee;padding:14px;z-index:2;border-bottom:1px solid #29415d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.s,.c{background:#102139;border:1px solid #29415d;border-radius:15px;padding:12px;margin:9px 0}.s{text-align:center;font-size:10px}.s b{display:block;font-size:15px}.hero{background:linear-gradient(135deg,#174466,#102139)}button{width:100%;padding:12px;margin:5px 0;border:1px solid #355473;border-radius:12px;background:#19304b;color:#fff;font-weight:700;text-align:left}.g{background:#20bd69;color:#03160b}.y{background:#dba936;color:#211702}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#071321;padding:6px}.nav button{background:none;border:0;font-size:10px;text-align:center}.hide{display:none}.muted{color:#94a8bd;font-size:12px}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #253a52;font-size:12px}
</style><div class=a><header class=top><b>⚽ FOOTBALL LIFE 27</b><div class=muted id=date>Nowa kariera</div><div class=stats><div class=s><b id=en>82</b>⚡</div><div class=s><b id=mo>35€</b>💶</div><div class=s><b id=fo>58</b>📈</div><div class=s><b id=pr>5</b>📣</div></div></header><main id=main></main><nav class=nav id=nav></nav></div>
<script>
let K='FL27',s=JSON.parse(localStorage.getItem(K)||'null'),q=0,A=[],names=['Maja','Ola','Emma','Kuba','Michał','Nina','Lena','Bartek','Zosia','Igor','Sara','Antek','Julia','Filip','Natalia','Oskar'];
let Q=[['Płeć','Kobieta','Mężczyzna'],['Pozycja','BR','OB','PO','LP','ŚP','PP','LS','N','PS'],['Noga','Lewa','Prawa'],['Styl','Techniczna','Szybka','Fizyczna','Kreatywna'],['Klub','Lech Poznań','Barcelona','Real Madryt','Arsenal','Bayern'],['Wzór','Messi','Ronaldo','Bellingham','Mbappé','Alexia Putellas'],['Klub marzeń','Barcelona','Real Madryt','Manchester City','Bayern','Arsenal'],['Charakter','Ambitny/a','Spokojny/a','Towarzyski/a','Uparty/a'],['Ryzyko','Ostrożnie','Z głową','Ryzykuję'],['Cel','Kariera','Rodzina','Pieniądze','Sława']];
let r=x=>x[Math.floor(Math.random()*x.length)],save=()=>localStorage.setItem(K,JSON.stringify(s)),log=x=>(s.logs.unshift(s.day+'. dzień • '+x),s.logs=s.logs.slice(0,80));
function creator(){let x=Q[q];main.innerHTML='<div class=c><div class=muted>PYTANIE '+(q+1)+'/10</div><h2>'+x[0]+'</h2>'+x.slice(1).map(v=>'<button onclick="pick(this.innerText)">'+v+'</button>').join('')+'</div>'}
function pick(v){A[q++]=v;q<Q.length?creator():start()}
function start(){let z={tech:60,speed:60,pass:60,shoot:60,def:55,phys:55};if(A[3]=='Techniczna')z.tech+=12;if(A[3]=='Szybka')z.speed+=12;if(A[3]=='Fizyczna')z.phys+=12;if(A[3]=='Kreatywna')z.pass+=12;s={age:15,year:2015,day:1,hour:8,week:1,en:82,money:35,form:58,pr:5,skill:60,stats:z,gender:A[0],pos:A[1],foot:A[2],style:A[3],dream:A[6],club:'Akademia lokalna',school:'Szkoła sportowa',friends:['Rodzice','Trener'],rel:{Rodzice:55,Trener:35},matches:0,wins:0,draws:0,goals:0,assists:0,logs:[],training:false};log('Start kariery w wieku 15 lat.');save();show('home')}
function day(){s.day++;s.en=Math.min(100,s.en+8);s.money=Math.max(0,s.money-2);if(s.day%7==0)match(1);if(Math.random()<.55)event()}
function next(){s.hour=8;day();log('Następny dzień.');save();render()}
function sleep(){s.en=Math.min(100,s.en+50);s.form=Math.min(100,s.form+2);next()}
function train(sim){let cost=sim?8:18;if(s.en<cost)return alert('Za mało energii');if(sim&&!s.training)return alert('Najpierw wykonaj trening samodzielnie');s.en-=cost;s.skill=Math.min(99,s.skill+(sim?1:2));s.form=Math.min(100,s.form+5);s.training=true;s.hour=(s.hour+(sim?1:2))%24;log((sim?'Symulacja':'Trening')+' • rozwój +');save();render()}
function match(auto){if(!auto&&s.en<25)return alert('Za mało energii');if(!auto)s.en-=25;let x=s.skill+s.form/3+Math.random()*20-10,y=50+Math.random()*35,g=Math.max(0,Math.floor(x/35+Math.random()*2)),ga=Math.max(0,Math.floor(y/35+Math.random()*2));s.matches++;if(g>ga)s.wins++;else if(g==ga)s.draws++;s.goals+=Math.random()<.5?1:0;s.assists+=Math.random()<.3?1:0;s.form=Math.max(0,Math.min(100,s.form+(g>=ga?5:-5)));s.pr+=g>ga?2:1;log('Mecz '+g+':'+ga+' • '+(g>ga?'WYGRANA 🟢':g==ga?'REMIS 🟡':'PORAŻKA 🔴'));save();render()}
function event(){let E=[['Trener Cię chwali',()=>s.rel.Trener+=5],['Rodzice dają 20€',()=>s.money+=20],['Poznajesz nową osobę',()=>{let n=r(names.filter(x=>!s.friends.includes(x)));if(n){s.friends.push(n);s.rel[n]=15}}],['Dostajesz drobną pracę +30€',()=>s.money+=30],['Przeciążenie — tracisz energię',()=>s.en=Math.max(0,s.en-12)]];let e=r(E);e[1]();log('Wydarzenie: '+e[0]);save();render()}
function parents(){if(Math.random()<.5){s.money+=25;log('Rodzice dali 25€')}else{s.money+=60;log('Rodzice dali stałe kieszonkowe 60€')}save();render()}
function job(){s.money+=30;s.en=Math.max(0,s.en-15);log('Dorywcza praca +30€');save();render()}
function city(k){let c=k=='kino'?12:10;if(s.money<c)return alert('Za mało pieniędzy');s.money-=c;s.en=Math.max(0,s.en-6);if(Math.random()<.6){let n=r(names.filter(x=>!s.friends.includes(x)));if(n){s.friends.push(n);s.rel[n]=12;log('Poznajesz '+n+' na mieście')}}log(k=='kino'?'Kino -12€':'Wyjście na miasto -10€');save();render()}
function interview(){let x=prompt('Wywiad: jak odpowiadasz? PRACA / NAJLEPSZY / SPOKO');if(!x)return;x=x.toUpperCase();s.pr+=x.includes('NAJLEPSZY')?5:3;s.rel.Trener+=x.includes('PRACA')?4:2;log('Wywiad — odpowiedź zmieniła PR i relację z trenerem.');save();render()}
function show(id){main.innerHTML='';let d=document.createElement('div');d.id=id;d.className='c';main.appendChild(d);if(id=='home')home();if(id=='life')life();if(id=='city')cityPage();if(id=='career')career();if(id=='history')history();nav.innerHTML=['home','life','city','career','history'].map(x=>'<button onclick="show(\''+x+'\')">'+({'home':'🏠 Dziś','life':'❤️ Życie','city':'🌆 Miasto','career':'⚽ Kariera','history':'📖 Historia'}[x])+'</button>').join('')}
function home(){main.innerHTML='<div class="c"><div class=muted>'+s.year+' • '+s.age+' lat • '+s.club+'</div><h2>'+(s.gender=='Kobieta'?'Piłkarka':'Piłkarz')+' • '+s.pos+'</h2><p class=muted>'+s.style+' • klub marzeń: '+s.dream+'</p><div class=row><span>Forma</span><b>'+s.form+'</b></div></div><div class=c><div class=grid><button class=g onclick="train(0)">🏋️ Trening</button><button onclick="train(1)">⏩ Symuluj</button><button class=y onclick="match(0)">🏟️ Mecz</button><button onclick="sleep()">😴 Sen</button></div><button onclick="next()">➡️ Następny dzień</button><button onclick="interview()">🎙️ Wywiad</button><button onclick="event()">🎲 Losowe wydarzenie</button></div><div class=c><div class=row><span>OVR</span><b>'+s.skill+'</b></div><div class=row><span>Mecze</span><b>'+s.matches+'</b></div><div class=row><span>W / R</span><b>'+s.wins+' / '+s.draws+'</b></div><div class=row><span>Gole / asysty</span><b>'+s.goals+' / '+s.assists+'</b></div></div>'}
function life(){main.innerHTML='<div class=c><h2>❤️ Życie</h2><p class=muted>Znajomi pojawiają się i mieszają. Relacje pamiętają historię.</p><button onclick="parents()">👨‍👩‍👧 Poproś rodziców o pieniądze</button><button onclick="job()">💼 Dorywcza praca</button></div><div class=c><h3>Znajomi i rodzina</h3>'+s.friends.map(n=>'<div class=row><span>'+n+'</span><b>'+Math.round(s.rel[n]||10)+'</b></div>').join('')+'</div>'}
function cityPage(){main.innerHTML='<div class=c><h2>🌆 Miasto</h2><p class=muted>Wydajesz pieniądze i czas. Możesz poznawać nowych ludzi.</p><button onclick="city(\'miasto\')">🌃 Wyjście • 10€</button><button onclick="city(\'kino\')">🎬 Kino • 12€</button></div>'}
function career(){main.innerHTML='<div class=c><h2>⚽ Kariera</h2><div class=row><span>Klub</span><b>'+s.club+'</b></div><div class=row><span>Szkoła</span><b>'+s.school+'</b></div><div class=row><span>PR</span><b>'+s.pr+'</b></div><div class=row><span>Pieniądze</span><b>'+Math.floor(s.money)+'€</b></div><div class=row><span>Klub marzeń</span><b>'+s.dream+'</b></div></div>'}
function history(){main.innerHTML='<div class=c><h2>📖 Historia decyzji</h2>'+s.logs.map(x=>'<div class=row><span>'+x+'</span></div>').join('')+'</div><button onclick="if(confirm(\'Usunąć zapis?\')){localStorage.removeItem(K);location.reload()}">♻️ Nowa kariera</button>'}
function render(){if(!s){creator();return}date.textContent=s.day+'. dzień • '+s.year+' • tydzień '+s.week;energy.textContent=Math.round(s.en);money.textContent=Math.floor(s.money)+'€';form.textContent=Math.round(s.form);pr.textContent=Math.round(s.pr);show('home')}
render();
</script></html>
