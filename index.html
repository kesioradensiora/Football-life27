<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Football Life 27</title>
<style>
:root{
  --bg:#07080d;
  --bg2:#0d1019;
  --panel:#121722;
  --panel2:#171d2b;
  --panel3:#1c2434;
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.14);
  --text:#fbfcff;
  --muted:#9ba6b8;
  --red:#e63946;
  --red2:#ff5663;
  --redDark:#651c27;
  --redGlow:rgba(230,57,70,.22);
  --green:#38d996;
  --gold:#f5c451;
  --blue:#63a9ff;
  --shadow:0 18px 50px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{
 margin:0;min-height:100%;
 background:
 radial-gradient(700px 400px at 50% -120px,rgba(230,57,70,.16),transparent 68%),
 radial-gradient(600px 420px at 100% 30%,rgba(92,116,170,.10),transparent 70%),
 linear-gradient(180deg,#090b11 0%,#05060a 100%);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
 -webkit-font-smoothing:antialiased;
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
 background:linear-gradient(115deg,transparent 0 42%,rgba(255,255,255,.018) 50%,transparent 58%);
}
button,input{font:inherit}
button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:108px}

/* HEADER / HUD */
header{
 position:sticky;top:0;z-index:10;
 background:rgba(8,10,16,.92);
 backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
 border-bottom:1px solid var(--line);
 padding:13px 15px 14px;
 box-shadow:0 8px 30px rgba(0,0,0,.22);
}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand b{font-size:17px;font-weight:900;letter-spacing:.35px}
.save{
 font-size:9px;font-weight:850;letter-spacing:.4px;text-transform:uppercase;
 color:#ff9ba4;background:rgba(230,57,70,.09);
 border:1px solid rgba(230,57,70,.22);
 padding:5px 8px;border-radius:99px
}
.sub{color:var(--muted);font-size:11px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{
 position:relative;overflow:hidden;text-align:center;
 background:linear-gradient(145deg,#171d2a,#10141d);
 border:1px solid var(--line2);border-radius:17px;
 padding:10px 5px 9px;box-shadow:inset 0 1px rgba(255,255,255,.04)
}
.stat:first-child{border-color:rgba(230,57,70,.28)}
.stat:first-child:after{
 content:"";position:absolute;width:65px;height:65px;right:-32px;top:-32px;
 background:var(--redGlow);border-radius:50%;filter:blur(3px)
}
.stat b{display:block;font-size:18px;line-height:1.05;font-weight:900;position:relative;z-index:1}
.stat span{display:block;color:#8e99aa;font-size:9px;margin-top:5px;position:relative;z-index:1}

/* MAIN CARDS */
main{padding:15px}
.card{
 background:linear-gradient(145deg,rgba(22,28,40,.98),rgba(12,15,22,.98));
 border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:13px;
 box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.035)
}
.hero{
 position:relative;overflow:hidden;
 background:
 radial-gradient(280px 180px at 100% 0%,rgba(230,57,70,.30),transparent 70%),
 linear-gradient(135deg,#3a151d 0%,#21131b 45%,#11151f 100%);
 border-color:rgba(230,57,70,.28);
 padding:20px 17px 18px;
}
.hero:after{
 content:"";position:absolute;right:-40px;bottom:-55px;width:180px;height:180px;
 border:1px solid rgba(255,255,255,.07);border-radius:50%;
 box-shadow:0 0 0 28px rgba(255,255,255,.018),0 0 0 56px rgba(255,255,255,.012)
}
.hero:before{
 content:"⚽";position:absolute;right:-11px;top:-21px;font-size:112px;
 opacity:.055;transform:rotate(-14deg)
}
.hero>*{position:relative;z-index:1}
.kicker{
 color:#ff8c95;text-transform:uppercase;font-size:9px;letter-spacing:1.55px;font-weight:900
}
h1,h2,h3{margin:5px 0 8px;line-height:1.1}
h1{font-size:28px;letter-spacing:-.6px}
h2{font-size:20px;letter-spacing:-.25px}
h3{font-size:16px}
.hero h1{font-size:30px}
.hero p{margin:7px 0;color:#c6ccd7;font-size:13px;line-height:1.5}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.pill{
 padding:7px 10px;border-radius:99px;
 background:rgba(5,7,12,.38);border:1px solid rgba(255,255,255,.12);
 color:#e3e7ee;font-size:10px;font-weight:750
}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 10px}
.section-title b{font-size:14px}.section-title span{font-size:10px;color:var(--muted)}

/* BUTTONS */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions.three{grid-template-columns:repeat(3,1fr)}
.action{
 position:relative;overflow:hidden;text-align:left;
 border:1px solid rgba(255,255,255,.10);
 background:linear-gradient(145deg,#1b2331,#121821);
 border-radius:17px;padding:13px;min-height:72px;
 box-shadow:inset 0 1px rgba(255,255,255,.045);
 transition:transform .12s,filter .12s,border-color .12s
}
.action:after{
 content:"";position:absolute;left:0;top:0;width:3px;height:100%;
 background:rgba(255,255,255,.08)
}
.action.green{
 border-color:rgba(56,217,150,.30);
 background:linear-gradient(145deg,#17352d,#121d1b)
}
.action.green:after{background:var(--green)}
.action.gold{border-color:rgba(245,196,81,.28);background:linear-gradient(145deg,#302a1b,#191713)}
.action.gold:after{background:var(--gold)}
.action.red{
 border-color:rgba(230,57,70,.36);
 background:linear-gradient(145deg,#3a1820,#211318)
}
.action.red:after{background:var(--red)}
.action b,.action small{position:relative;z-index:1}
.action b{display:block;font-size:13px;font-weight:850}
.action small{display:block;color:#9ca8b9;font-size:10px;line-height:1.35;margin-top:5px}
.action:active,.choice:active{transform:scale(.985);filter:brightness(1.08)}
.progress{
 height:8px;background:#080b11;border-radius:99px;overflow:hidden;
 border:1px solid rgba(255,255,255,.08)
}
.progress i{
 display:block;height:100%;border-radius:99px;
 background:linear-gradient(90deg,var(--red),#ff7b83);
 box-shadow:0 0 14px rgba(230,57,70,.28)
}
.row{
 display:flex;justify-content:space-between;gap:12px;
 padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);
 font-size:12px
}
.row:last-child{border-bottom:0}
.row span{color:#929eaf}.row b{text-align:right}

/* EVENTS / CHOICES */
.log{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px;line-height:1.45}
.log:last-child{border:0}
.log em{font-style:normal;color:#ff8a93;font-size:10px;display:block;margin-bottom:3px}
.notice{
 padding:12px;border-radius:15px;
 background:linear-gradient(145deg,#1a202c,#11161f);
 border:1px solid rgba(255,255,255,.09);
 color:#cbd2dd;font-size:12px;line-height:1.45
}
.choice{
 width:100%;border:1px solid rgba(255,255,255,.10);
 background:linear-gradient(145deg,#1b2432,#121923);
 border-radius:16px;padding:13px;margin:7px 0;text-align:left;
 box-shadow:inset 0 1px rgba(255,255,255,.04);transition:.12s
}
.choice:hover{border-color:rgba(230,57,70,.42);background:linear-gradient(145deg,#271b23,#151922)}
.choice b{display:block;font-size:13px;font-weight:800}.choice span{display:block;color:#919dad;font-size:10px;line-height:1.35;margin-top:4px}
.empty{color:var(--muted);font-size:12px;padding:8px 0}

/* CREATOR */
.creator-screen header{background:rgba(8,10,16,.94)}
.creator-screen .stats{display:none}
.creator-screen main{padding-top:20px}
.creator-screen .hero{
 min-height:260px;display:flex;flex-direction:column;justify-content:flex-end
}
.creator-screen .hero .kicker{margin-bottom:auto}
.creator-screen .choice{min-height:55px;display:flex;flex-direction:column;justify-content:center}
.creator-screen input:focus{
 border-color:rgba(230,57,70,.72)!important;
 box-shadow:0 0 0 3px rgba(230,57,70,.11)
}

/* NAV */
nav{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(620px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
 padding:8px 9px calc(8px + env(safe-area-inset-bottom));
 background:rgba(8,10,15,.94);
 backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
 border-top:1px solid rgba(255,255,255,.08);z-index:20;
 box-shadow:0 -18px 45px rgba(0,0,0,.30)
}
nav button{
 border:1px solid transparent;background:transparent;padding:7px 2px;border-radius:15px;
 color:#7f8999;font-size:9px;transition:.12s
}
nav button.active{
 background:linear-gradient(145deg,#3a1820,#21131a);
 border-color:rgba(230,57,70,.28);color:#fff;
 box-shadow:inset 0 1px rgba(255,255,255,.05)
}
nav i{display:block;font-style:normal;font-size:19px;margin-bottom:3px}

/* MODALS / TOAST */
.overlay{
 position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:30;
 display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)
}
.modal{
 width:min(620px,100%);max-height:90vh;overflow:auto;
 background:linear-gradient(160deg,#171d29,#0d1118);
 border:1px solid rgba(255,255,255,.11);border-bottom:0;
 border-radius:25px 25px 0 0;padding:19px 16px calc(24px + env(safe-area-inset-bottom));
 box-shadow:0 -25px 70px rgba(0,0,0,.55)
}
.toast{
 position:fixed;left:50%;bottom:102px;transform:translate(-50%,15px);
 background:linear-gradient(145deg,#fff5f6,#ffe2e5);color:#3a0d12;
 border-radius:99px;padding:10px 15px;font-size:11px;font-weight:850;z-index:50;
 opacity:0;transition:.2s;pointer-events:none;box-shadow:0 10px 35px rgba(0,0,0,.3)
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:390px){
 main{padding:12px}.stats{gap:6px}.stat{padding:10px 3px}
 .stat b{font-size:16px}.stat span{font-size:8px}.hero h1{font-size:27px}.card{padding:14px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><b>⚽ FOOTBALL LIFE 27</b><span class="save" id="saveState">● Zapisano</span></div>
  <div class="sub" id="dateLine">—</div>
  <div class="stats">
    <div class="stat"><b id="money">€0</b><span>💶 Pieniądze</span></div>
    <div class="stat"><b id="energy">0</b><span>⚡ Energia</span></div>
    <div class="stat"><b id="form">0</b><span>🔥 Forma</span></div>
    <div class="stat"><b id="pr">0</b><span>📣 PR</span></div>
  </div>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
</div>

<script>
"use strict";

const KEY="footballLife27_v6";
const DRAFT_KEY="footballLife27_creatorDraft_v1";
let state=load();
let currentTab="home";
let creatorStarted=false;
let selectedAnswers=[];
let playerName="";

const QUESTIONS=[
 ["Płeć",["Kobieta","Mężczyzna"]],
 ["Płeć osób, którymi możesz być romantycznie zainteresowany/a",["Kobiety","Mężczyźni","Kobiety i mężczyźni","Na razie nikim — nie szukam związku"]],
 ["Pozycja na boisku",["Bramkarz (BR)","Lewy obrońca (LO)","Prawy obrońca (PO)","Środkowy obrońca (ŚO)","Lewy pomocnik (LP)","Środkowy pomocnik (ŚP)","Prawy pomocnik (PP)","Lewy skrzydłowy (LS)","Napastnik (N)","Prawy skrzydłowy (PS)"]],
 ["Dominująca noga",["Lewa","Prawa"]],
 ["Najbardziej naturalny styl gry",["Techniczny — drybling i kontrola","Szybki — sprint i gra za plecy obrony","Fizyczny — siła i pojedynki","Kreatywny — podania i wizja","Uniwersalny — potrafię robić wszystko po trochu"]],
 ["Gdzie zaczynasz?",["Lokalna akademia","Lech Poznań","Legia Warszawa","Barcelona","Arsenal","Bayern Monachium"]],
 ["Który zawodnik najbardziej Cię inspiruje?",["Lionel Messi","Cristiano Ronaldo","Jude Bellingham","Kylian Mbappé","Alexia Putellas","Mohamed Salah"]],
 ["Jaki jest Twój klub marzeń?",["FC Barcelona","Real Madryt","Manchester City","Bayern Monachium","Arsenal","Lech Poznań"]],
 ["Jak zachowujesz się pod presją?",["Walczę do końca","Zachowuję spokój","Biorę odpowiedzialność","Szukam wsparcia u drużyny","Czasem presja mnie blokuje"]],
 ["Co jest dla Ciebie najważniejsze w karierze?",["Rozwój i umiejętności","Trofea","Pieniądze","Sława i rozpoznawalność","Reprezentowanie Polski","Dobra atmosfera i ludzie"]],
 ["Jaki jest Twój największy cel?",["Zostać zawodnikiem/zawodniczką światowego poziomu","Zagrać w klubie marzeń","Zdobyć Ligę Mistrzów","Zagrać dla reprezentacji","Zbudować karierę i jednocześnie mieć normalne życie"]]
];

const NAMES=["Maja","Ola","Emma","Kuba","Michał","Nina","Lena","Bartek","Zosia","Igor","Sara","Antek","Julia","Filip","Oskar","Kacper","Laura","Tomek"];
const EVENT_POOL=[
 {title:"Trener widzi postęp",text:"Po treningu trener zatrzymuje Cię na chwilę. Mówi, że masz coraz lepszą technikę.",choices:[
  ["Zapytaj, co poprawić",()=>{S.skill+=2;S.rel.Trener+=6;log("Trener wskazał Ci konkretny element do poprawy.")}],
  ["Podziękuj i wróć do domu",()=>{S.form+=2;log("Spokojnie zakończyłeś/aś trening.")}]
 ]},
 {title:"Rodzice proponują układ",text:"Rodzice mówią, że mogą dać Ci szansę na dodatkowy zarobek zamiast zwykłego kieszonkowego.",choices:[
  ["Wezmę stałe kieszonkowe +20€ / tydzień",()=>{S.allowance=20;log("Rodzice ustawili stałe kieszonkowe: 20€ tygodniowo.")}],
  ["Wolę zarabiać sam/a",()=>{S.independent=true;log("Postanawiasz samodzielnie szukać pieniędzy.")}]
 ]},
 {title:"Nowa osoba w akademii",text:"Na treningu pojawia się nowa zawodniczka/zawodnik. Możecie się lepiej poznać.",choices:[
  ["Porozmawiaj",()=>{addFriend()}],
  ["Skup się na treningu",()=>{S.skill+=1;S.form+=2;log("Nie rozpraszasz się i robisz dobry trening.")}]
 ]},
 {title:"Drobna kontuzja",text:"Czujesz lekki ból po treningu. Możesz odpocząć albo zaryzykować.",choices:[
  ["Odpocznij",()=>{S.energy=Math.max(0,S.energy-4);S.form+=3;log("Odpoczynek zmniejszył ryzyko większego problemu.")}],
  ["Gram dalej",()=>{S.form-=5;if(Math.random()<.25){S.injury=2;log("Niestety przeciążenie wyłącza Cię na kilka dni.")}else log("Udało się uniknąć poważniejszego problemu.")}]
 ]},
 {title:"Dorywcza praca",text:"Znajomy rodziny proponuje Ci prostą pracę na kilka godzin.",choices:[
  ["Biorę 30€",()=>{S.money+=30;S.energy-=12;log("Dorywcza praca: +30€ i -12 energii.")}],
  ["Odmów — mam trening",()=>{S.form+=2;log("Wybierasz trening zamiast pracy.")}]
 ]},
 {title:"Oferta medialna",text:"Lokalna telewizja chce krótkiej wypowiedzi po meczu.",choices:[
  ["Mówię szczerze",()=>{S.pr+=4;log("Wywiad wypada naturalnie. PR +4.")}],
  ["Odpowiadam bardzo pewnie",()=>{S.pr+=6;S.rel.Trener-=1;log("Odważna wypowiedź daje PR +6, ale trener nie jest zachwycony tonem.")}]
 ]},
 {title:"Weekend z rodziną",text:"Rodzina proponuje wspólny dzień bez piłki.",choices:[
  ["Jadę z nimi",()=>{S.family+=7;S.form+=3;S.energy+=10;log("Spędzasz czas z rodziną. Relacje rosną.")}],
  ["Zostaję i trenuję",()=>{S.skill+=2;S.family-=2;S.energy-=8;log("Wybierasz dodatkową pracę nad sobą.")}]
 ]}
];

function fresh(){
 return {
  version:6, started:false,name:"",day:1,year:2015,month:9,dayOfMonth:1,age:15,hour:8,week:1,
  birthMonth:11,birthDay:30,

  money:0,energy:82,form:62,pr:5,skill:60,allowance:0,independent:false,
  gender:"",orientation:"",pos:"",foot:"",style:"",club:"Akademia lokalna",dream:"",
  school:"Szkoła",family:60,mental:60,health:90,injury:0,
  friends:["Rodzice","Trener"],rel:{Rodzice:60,Trener:35},
  matches:0,wins:0,draws:0,losses:0,goals:0,assists:0,
  trainingLevel:0,trainingUnlocked:false,logs:[]
 };
}
let S=state||fresh();
try{
  const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");
  if(d){ selectedAnswers=d.answers||[]; playerName=d.name||""; creatorStarted=!!d.started; }
}catch(e){}

function load(){
 try{
   const x=JSON.parse(localStorage.getItem(KEY)||"null");
   return x && x.version===6 ? x : null;
 }catch(e){return null}
}
function save(){
 localStorage.setItem(KEY,JSON.stringify(S));
 const el=document.getElementById("saveState");
 if(el){el.textContent="● Zapisano";el.style.color="#79e6ae";}
}
function saveSoon(){
 save();
 const el=document.getElementById("saveState");
 if(el){el.textContent="● Zapisuję…";setTimeout(()=>{el.textContent="● Zapisano"},350)}
}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function clamp(v,a=0,b=100){return Math.max(a,Math.min(b,v))}
function toast(t){
 const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");
 clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),1800)
}
function log(text){
 S.logs.unshift({day:S.day,year:S.year,text});
 S.logs=S.logs.slice(0,120);
}
function fmtDate(){
 const months=["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];
 return `${S.dayOfMonth} ${months[S.month-1]} ${S.year} • ${String(S.hour).padStart(2,"0")}:00 • ${S.age} lat`;
}
function updateHeader(){
 document.getElementById("dateLine").textContent=S.started?fmtDate():"Nowa kariera";
 document.getElementById("money").textContent="€"+Math.floor(S.money);
 document.getElementById("energy").textContent=Math.round(S.energy);
 document.getElementById("form").textContent=Math.round(S.form);
 document.getElementById("pr").textContent=Math.round(S.pr);
}

function applyGenderGrammar(){
  if(!S.started) return;
  const root=document.getElementById("main");
  if(!root) return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const old=n.nodeValue;
    const next=grammar(old);
    if(next!==old) n.nodeValue=next;
  });
}

function render(){
 document.body.classList.toggle("creator-screen",!S.started);
 updateHeader();
 if(!S.started){renderCreator();renderNav();return}
 renderTab(currentTab);
 renderNav();
 applyGenderGrammar();
}
function renderNav(){
 const items=[["home","🏠","Dziś"],["day","⏱️","Dzień"],["career","⚽","Kariera"],["life","❤️","Życie"],["history","📖","Historia"]];
 document.getElementById("nav").innerHTML=items.map(i=>`<button class="${currentTab===i[0]?'active':''}" onclick="go('${i[0]}')"><i>${i[1]}</i>${i[2]}</button>`).join("");
}
function go(tab){currentTab=tab;render()}

function isFemale(){
  return S.gender==="Kobieta" || S.gender==="Dziewczyna";
}
function genderWord(male,female){
  return isFemale()?female:male;
}
function genderVerb(male,female){
  return isFemale()?female:male;
}
function genderLabel(){
  return isFemale()?"piłkarka":"piłkarz";
}
function genderPossessive(){
  return isFemale()?"jej":"jego";
}
function genderSubject(){
  return isFemale()?"ona":"on";
}
function escText(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normalizeGender(v){
  return v==="Kobieta" ? "Kobieta" : "Mężczyzna";
}
function profileTitle(){
  return `${escText(S.name||"Moja kariera")} • ${genderLabel()}`;
}
function grammar(text){
  if(!text) return "";
  const female = isFemale();
  return text
    .replace(/\bPiłkarz\b/g,female?"Piłkarka":"Piłkarz")
    .replace(/\bpiłkarz\b/g,female?"piłkarka":"piłkarz")
    .replace(/\bPiłkarza\b/g,female?"Piłkarkę":"Piłkarza")
    .replace(/\bpiłkarza\b/g,female?"piłkarkę":"piłkarza")
    .replace(/\bPiłkarzem\b/g,female?"Piłkarką":"Piłkarzem")
    .replace(/\bpiłkarzem\b/g,female?"piłkarką":"piłkarzem")

function spend(cost,label){
 if(S.money<cost){toast("Nie masz na to pieniędzy 💸");return false}
 S.money-=cost;log(`${label}: -${cost}€`);return true
}
function advance(hours){
  const whole=Math.max(0,Math.floor(hours));
  S.hour+=whole;
  let daysPassed=0;
  while(S.hour>=24){
    S.hour-=24;
    S.day++;
    S.dayOfMonth++;
    daysPassed++;

    const daysInMonth=new Date(S.year,S.month,0).getDate();
    if(S.dayOfMonth>daysInMonth){
      S.dayOfMonth=1;
      S.month++;
      if(S.month>12){
        S.month=1;
        S.year++;
      }
    }

    S.week=Math.floor((S.day-1)/7)+1;

    // Natural daily recovery, but sleeping gives full recovery.
    S.energy=clamp(S.energy+10);
    S.form=clamp(S.form+1);

    // Weekly allowance: exactly every 7 days after the first week.
    if(S.allowance>0 && S.day>1 && (S.day-1)%7===0){
      S.money+=S.allowance;
      log(`Tygodniowe kieszonkowe: +${S.allowance}€ 💶`);
    }

    // Birthday is based on the in-game birth date.
    if(S.month===S.birthMonth && S.dayOfMonth===S.birthDay){
      S.age++;
      S.mental=clamp(S.mental+3);
      log(`Urodziny! Masz teraz ${S.age} lat. 🎂`);
    }
  }

  if(daysPassed>0) randomEventChance();
  saveSoon();
}
function sleep(){
 if(S.injury>0)S.injury--;
 S.energy=100;S.health=clamp(S.health+5);S.form=clamp(S.form+4);

 advance(16);toast("Nowy dzień 🌅");render()
}
function train(real=true){
 if(S.injury>0){toast("Masz uraz — najpierw regeneracja.");return}
 const cost=real?18:10;
 if(S.energy<cost){toast("Za mało energii ⚡");return}
 if(!real && !S.trainingUnlocked){toast("Najpierw wykonaj trening samodzielnie.");return}
 S.energy-=cost;S.form=clamp(S.form+ (real?6:3));S.skill=clamp(S.skill+(real?2:1));
 if(real){S.trainingUnlocked=true;S.trainingLevel=Math.min(10,S.trainingLevel+1);log(`Trening wykonany. Poziom treningu: ${S.trainingLevel}/10.`)}
 else log("Trening zasymulowany. Rozwój jest mniejszy niż przy ręcznym treningu.");
 advance(real?2:1);toast(real?"Trening wykonany 💪":"Trening zasymulowany ⏩");render()
}
function playMatch(){
 if(S.injury>0){toast("Nie możesz zagrać z urazem.");return}
 if(S.energy<28){toast("Za mało energii na mecz.");return}
 S.energy-=28;
 const rating=S.skill*.65+S.form*.25+S.mental*.1+(Math.random()*24-12);
 const opp=55+Math.random()*30;
 let gf=Math.max(0,Math.round((rating/42)+Math.random()*1.4-0.5));
 let ga=Math.max(0,Math.round((opp/42)+Math.random()*1.4-0.5));
 S.matches++;
 let result=gf>ga?"WYGRANA 🟢":gf===ga?"REMIS 🟡":"PORAŻKA 🔴";
 if(gf>ga){S.wins++;S.form=clamp(S.form+7);S.pr+=3}else if(gf===ga){S.draws++;S.form=clamp(S.form+2);S.pr+=1}else{S.losses++;S.form=clamp(S.form-5)}
 const personal=Math.random();
 if(personal<.45){S.goals++;S.pr+=2;log(`Mecz ${gf}:${ga} — ${result}. Strzelasz gola! ⚽`)}
 else if(personal<.72){S.assists++;S.pr+=1;log(`Mecz ${gf}:${ga} — ${result}. Notujesz asystę.`)}
 else log(`Mecz ${gf}:${ga} — ${result}.`);
 advance(2);toast(result);render()
}

 m.innerHTML=`<div class="card hero"><div class="kicker">Życie poza boiskiem</div><h1>Twoi ludzie</h1><p>Relacje nie są wyborem „jednego przyjaciela”. Poznajesz kolejne osoby, a wcześniejsze decyzje zostają w historii.</p></div>
 <div class="card"><div class="section-title"><b>Rodzina</b><span>${Math.round(S.family)}/100</span></div><div class="row"><span>Relacja z rodzicami</span><b>${Math.round(S.rel.Rodzice)}/100</b></div><div class="row"><span>Kieszonkowe</span><b>${S.allowance?S.allowance+"€ / tydzień":"nieustalone"}</b></div><button class="action" style="width:100%;margin-top:8px" onclick="askParents()"><b>👨‍👩‍👧 Porozmawiaj z rodzicami</b><small>pieniądze, praca albo kieszonkowe</small></button></div>
 <div class="card"><div class="section-title"><b>Znajomi</b><span>${S.friends.length} osób</span></div>${friendRows||'<div class="empty">Jeszcze nikogo nowego nie poznałeś/aś.</div>'}</div>
 <div class="card"><div class="section-title"><b>Psychika</b><span>${Math.round(S.mental)}/100</span></div><div class="progress"><i style="width:${S.mental}%"></i></div><p class="sub">W przyszłości decyzje życiowe, presja, relacje i sukces będą mocniej wpływać na ten parametr.</p></div>`;
}
function renderHistory(m){
 m.innerHTML=`<div class="card hero"><div class="kicker">Pamięć kariery</div><h1>Historia decyzji</h1><p>Gra nie zapomina ważnych wyborów.</p></div>
 <div class="card">${S.logs.length?S.logs.map(x=>`<div class="log"><em>${x.day}. dzień • ${x.year}</em>${esc(x.text)}</div>`).join(""):'<div class="empty">Historia jest jeszcze pusta.</div>'}</div>
 <div class="card"><button class="action red" style="width:100%" onclick="newGame()">♻️ Rozpocznij nową karierę<small>Usunie obecny zapis z telefonu.</small></button></div>`;
}
function newGame(){
 if(!confirm("Na pewno usunąć obecną karierę?"))return;
 localStorage.removeItem(KEY);localStorage.removeItem(DRAFT_KEY);S=fresh();selectedAnswers=[];playerName="";creatorStarted=false;currentTab="home";toast("Zapis usunięty");render()
}

render();
</script>
