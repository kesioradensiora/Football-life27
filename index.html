<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football Life 27 — Clean</title>
<style>
:root{--bg:#090b10;--panel:#11151d;--panel2:#161b24;--line:#29313d;--text:#f3f5f7;--muted:#9ca5b1;--gold:#d9ae55;--green:#65c98b;--red:#ef7777;--blue:#70a9ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}.app{min-height:100vh}.top{position:sticky;top:0;z-index:30;background:rgba(9,11,16,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:.5px}.brand span{color:var(--gold)}.date{font-size:12px;color:var(--muted);text-align:right}
.alerts{max-width:1100px;margin:12px auto 0;padding:0 16px}.alert{background:linear-gradient(135deg,#211d14,#151820);border:1px solid #5a4725;border-radius:16px;padding:12px;margin-bottom:8px;cursor:pointer}.alert b{display:block}.alert small{color:var(--muted)}
.wrap{max-width:1100px;margin:auto;padding:14px 16px 110px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:linear-gradient(145deg,var(--panel),#0e1218);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;overflow:hidden}.hero{grid-column:1/-1}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:1/-1}
.kicker{font-size:10px;letter-spacing:1.5px;color:var(--gold);font-weight:900;text-transform:uppercase}.title{font-size:25px;font-weight:900;margin:4px 0 7px}.sub{color:var(--muted);font-size:12px;line-height:1.55}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.metric{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:10px;border-radius:12px}.metric span{display:block;color:var(--muted);font-size:9px}.metric b{font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);min-width:0}.row:last-child{border-bottom:0}.row span{color:var(--muted);font-size:12px;min-width:0}.row b{text-align:right;min-width:0;overflow-wrap:anywhere}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;color:var(--muted)}
.actions{display:grid;gap:8px;margin-top:12px}.btn{width:100%;border:1px solid var(--line);border-radius:11px;background:#171c24;color:var(--text);padding:11px;text-align:left;cursor:pointer}.btn:hover{border-color:#687483}.btn.primary{background:linear-gradient(135deg,#3a2f1b,#171a20);border-color:#71582b}.btn.danger{border-color:#633535}.btn small{display:block;color:var(--muted);margin-top:3px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:13px;padding:11px;background:rgba(255,255,255,.025)}.item b{display:block}.item small{color:var(--muted);line-height:1.4}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(10,12,17,.98);border-top:1px solid var(--line);overflow:auto}.navin{max-width:1100px;margin:auto;display:flex;gap:2px;padding:7px 8px}.nav button{flex:1;min-width:72px;border:0;background:none;color:var(--muted);padding:8px 5px;border-radius:10px;font-size:10px;cursor:pointer}.nav button.active{background:#1b2028;color:var(--text)}.nav i{display:block;font-style:normal;font-size:17px;margin-bottom:2px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:14px}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#11151d;border:1px solid #3a424e;border-radius:20px;padding:19px;box-shadow:0 30px 80px #000}.modalbox h2{margin:5px 0 8px}.close{float:right;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.event{border:1px solid #6b552b;background:linear-gradient(145deg,#1d1912,#12161d)}.choice{font-weight:800}
.progress{height:7px;background:#222832;border-radius:9px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:var(--gold)}
.shopgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:14px;padding:12px;background:#141922}.product .emoji{font-size:25px}.product b{margin-top:6px}.product small{color:var(--muted);min-height:34px}.product .price{margin:8px 0;color:var(--gold);font-weight:800}.product .btn{margin-top:auto}
.fl{background:#0d1117;border:1px solid #26303b;border-radius:22px;overflow:hidden}.flhead{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.post{padding:15px;border-bottom:1px solid var(--line)}.posthead{display:flex;gap:9px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:#252c37;display:grid;place-items:center}.post img{width:100%;border-radius:14px;margin-top:10px}.postactions{display:flex;gap:14px;margin-top:10px;color:var(--muted)}.postactions button{background:none;border:0;color:inherit;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
@media(max-width:760px){.span4,.span6,.span8{grid-column:1/-1}.metrics{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.shopgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.title{font-size:22px}}
@media(max-width:430px){.shopgrid{grid-template-columns:1fr}.wrap{padding-left:11px;padding-right:11px}.alerts{padding:0 11px}.topin{padding:10px 11px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* CLEAN ENGINE V10: one state, one renderer, one click pipeline, no previous mechanisms. */
const KEY="FL27_CLEAN_V10";
const countries=["Polska","Hiszpania","Anglia","Niemcy","Włochy","Francja","Portugalia","Holandia","Belgia","USA","Brazylia","Argentyna","Chorwacja","Dania","Norwegia","Szwecja"];
const cities={Polska:["Poznań","Warszawa","Kraków","Wrocław","Gdańsk"],Hiszpania:["Barcelona","Madryt","Palma","Walencja"],Anglia:["Londyn","Manchester","Liverpool"],Niemcy:["Berlin","Monachium","Dortmund"],Włochy:["Mediolan","Rzym","Turyn"],Francja:["Paryż","Marsylia","Lyon"],Portugalia:["Lizbona","Porto"],Holandia:["Amsterdam","Rotterdam"],Belgia:["Bruksela","Brugia"],USA:["Los Angeles","Miami","New York"],Brazylia:["São Paulo","Rio de Janeiro"],Argentyna:["Buenos Aires"],Chorwacja:["Zagrzeb","Split"],Dania:["Kopenhaga"],Norwegia:["Oslo"],Szwecja:["Sztokholm"]};
const sideNames=["Muzyk","Twórca krótkich form","Twórca wideo","Streamer","Influencer"];
const products=[
["Kawa ☕","Mały wydatek, +1 szczęście",4,"happiness",1],["Restauracja 🍽️","Wyjście z jedzeniem",35,"happiness",3],["Koszulka 👕","Ubranie, +wizerunek",45,"image",1],
["Buty piłkarskie 👟","Lepszy sprzęt, +1 technika",180,"skill",1],["Korki premium ⚽","Sprzęt sponsora/zakup, +2 forma",350,"form",2],
["Telefon 📱","+wizerunek, odblokowuje część social",700,"image",3],["Laptop 💻","Potrzebny do części karier pobocznych",1100,"side",0],
["Konsola 🎮","+szczęście",450,"happiness",3],["Rower 🚲","Tańszy transport",500,"transport",1],["Samochód 🚗","Szybszy dojazd, koszty utrzymania",12000,"car",1],
["Zegarek ⌚","+wizerunek",2500,"image",3],["Biżuteria 💎","+wizerunek/prezent",5000,"image",5],["Tatuaż 🖋️","+wizerunek, ale może zmienić reakcje",900,"image",1],
["Mieszkanie 🏢","Możesz kupić, wynająć lub później sprzedać",90000,"home",0],["Dom 🏠","Więcej miejsca i możliwości rozbudowy",220000,"home",0],
["Rezydencja 🏰","Dużo pokoi, garaż, luksus",1200000,"home",0],["Jacht 🛥️","Mobilność i luksus",800000,"luxury",2],["Helikopter 🚁","Szybki transport",2500000,"luxury",2],
["Samolot ✈️","Dalekie podróże i własne loty",9000000,"luxury",3],["Wyspa 🏝️","Najwyższy poziom luksusu",25000000,"luxury",5]
];
let state=load();
function fresh(){return {started:true,day:1,year:2026,month:9,dayOfMonth:1,hour:8,age:15,name:"Alex Nowak",position:"Skrzydłowy",ovr:54,skill:54,form:72,energy:90,health:95,mental:70,happiness:70,popularity:1,image:50,money:120,marketValue:15000,totalEarned:0,totalSpent:0,
country:"Polska",city:"Poznań",club:"Akademia Poznań",injury:null,injuryDays:0,school:"Szkoła podstawowa",educationLevel:"uczeń",parentsTogether:true,
parents:[{name:"Piotr Nowak",job:"kucharz",income:1900,expenses:1450,housing:"wynajem",city:"Poznań",car:"stary hatchback",support:75,interest:80},{name:"Anna Nowak",job:"księgowa",income:2200,expenses:1550,housing:"wynajem",city:"Poznań",car:"brak",support:80,interest:85}],
relations:[],children:[],partner:null,exPartners:[],owned:[],rentals:[],investments:[],businesses:[],charity:0,sideCareers:[],courses:[],licenses:[],stats:{},trophies:[],history:[],news:[],offers:[],trials:[],events:[],messages:[],posts:[],calendar:[],tutorial:{started:false,done:[]},dating:"wszyscy",settings:{sound:true},pendingEvent:null,tab:"home",matchNext:7,matchCount:0};}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.started?x:fresh()}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(x){return "€"+Math.round(Number(x||0)).toLocaleString("pl-PL")}
function clamp(x,a=0,b=100){return Math.max(a,Math.min(b,x))}
function addHistory(title,text,impact=""){state.history.unshift({day:state.day,date:dateText(),title,text,impact});state.history=state.history.slice(0,200)}
function news(title,text,action=null){state.news.unshift({id:Date.now()+Math.random(),title,text,action,read:false});state.news=state.news.slice(0,30)}
function dateText(){return `${String(state.dayOfMonth).padStart(2,"0")}.${String(state.month).padStart(2,"0")}.${state.year}`}
function addRelation(name,type="znajomy",extra=""){if(!name)return;let r=state.relations.find(x=>x.name===name);if(!r){r={id:Date.now()+Math.random(),name,type,level:5,firstMet:dateText(),lastMet:dateText(),status:"aktywna",extra};state.relations.push(r)}else{r.lastMet=dateText();r.level=clamp(r.level+2)}return r}
function award(title,reason,club=state.club){state.trophies.push({title,reason,club,date:dateText()})}
function addEvent(title,text,choices){state.pendingEvent={title,text,choices};render()}
function decision(label,fn){return {label,fn}}
function advance(hours=1){
 state.hour+=hours;
 while(state.hour>=24){state.hour-=24;newDay()}
 save();render();
}
function newDay(){
 state.day++;state.dayOfMonth++;
 const max=[31,30,31,30,31,30,31,31,30,31,30,31][state.month-1]||30;
 if(state.dayOfMonth>max){state.dayOfMonth=1;state.month++;if(state.month>12){state.month=1;state.year++;}}
 state.hour=8;state.energy=clamp(state.energy+35);state.health=clamp(state.health+8);state.mental=clamp(state.mental+2);state.form=clamp(state.form+4);
 if(state.injuryDays>0){state.injuryDays--;if(state.injuryDays===0)state.injury=null}
 if(state.matchNext>0)state.matchNext--;
 familySimulation();calendarNews();
 if(state.matchNext===0){state.matchNext=7;news("⚽ Mecz dzisiaj","Masz mecz. Wejdź w „Przebieg dnia” i rozegraj go.");}
 randomEvent();
 save();
}
function sleep(){newDay();save();window.scrollTo(0,0);render();setTimeout(()=>window.scrollTo(0,0),0)}
function familySimulation(){
 state.parents.forEach(p=>{if(Math.random()<.10){let delta=Math.round((Math.random()*300)-100);p.income=Math.max(900,p.income+delta);news("🏠 Zmiana w rodzinie",`${p.name}: zarobki wynoszą teraz ${money(p.income)} miesięcznie.`)}});
 if(Math.random()<.06){state.parentsTogether=!state.parentsTogether;news("👨‍👩‍👧 Zmiana sytuacji rodziny",state.parentsTogether?"Rodzice znów próbują być razem.":"Rodzice rozstali się. Ich mieszkania, wydatki i relacje będą teraz liczone osobno.");}
}
function calendarNews(){
 if(state.month===9&&state.dayOfMonth===1)news("📚 Rozpoczęcie roku szkolnego","Pierwszy dzień szkoły. Wpływa na plan dnia, treningi i wydarzenia szkolne.");
 if(state.month===12&&state.dayOfMonth===24)news("🎄 Wigilia","Święto rodzinne — szkoła i większość pracy są wolne.");
 if(state.month===1&&state.dayOfMonth===1)news("🎆 Nowy Rok","Dzień wolny.");
}
function randomEvent(){
 if(Math.random()>.42)return;
 const pool=[];
 pool.push(()=>addEvent("Trener zatrzymuje Cię po treningu","Trener mówi, że widzi poprawę, ale chce żebyś popracował nad mentalem.",[
 decision("🔥 Zostaję dłużej i pracuję",()=>{state.skill=clamp(state.skill+2);state.energy=clamp(state.energy-8);addHistory("Dodatkowa praca","Zostałaś/eś po treningu.");}),
 decision("⚖️ Odpoczywam zgodnie z planem",()=>{state.health=clamp(state.health+2);addHistory("Regeneracja","Nie przeciążasz organizmu.");}),
 decision("💬 Pytam o dokładny feedback",()=>{state.mental=clamp(state.mental+2);news("🧠 Feedback trenera","Trener polecił pracę nad decyzjami boiskowymi.");})
 ]));
 pool.push(()=>addEvent("Nowa osoba na boisku","Po treningu podchodzi do Ciebie zawodnik z innego klubu.",[
 decision("🤝 Przedstawiam się",()=>{addRelation("Młody zawodnik z treningu","piłkarz","Poznany na boisku");state.popularity+=.2}),
 decision("👋 Tylko się witam",()=>addRelation("Młody zawodnik z treningu","piłkarz")),
 decision("🚶 Idę dalej",()=>{})
 ]));
 pool[Math.floor(Math.random()*pool.length)]();
}
function playMatch(){
 if(state.matchNext>0){alert("Najbliższy mecz za "+state.matchNext+" dni.");return}
 if(state.energy<25){alert("Masz za mało energii.");return}
 state.matchCount++;state.energy-=20;state.form=clamp(state.form+Math.round(Math.random()*8-1));let perf=clamp(Math.round(state.ovr+Math.random()*25-12),1,99);
 state.stats.matches=(state.stats.matches||0)+1;state.stats.ratingTotal=(state.stats.ratingTotal||0)+perf;
 addHistory("Mecz",`Występ oceniony na ${perf}/100.`,"forma, OVR i relacje mogą się zmienić");
 addRelation("Rywal z meczu","piłkarz","Kontakt poznany podczas meczu");
 state.matchNext=7;
 addEvent("⚽ Decyzja po meczu",`Twój występ: ${perf}/100. Co robisz po spotkaniu?`,[
 decision("🎙️ Rozmawiam z trenerem o występie",()=>{state.mental=clamp(state.mental+2);news("🧠 Feedback trenera","Trener omówił z Tobą występ.");}),
 decision("📱 Wrzucam post na FLgram",()=>{state.popularity+=.4;state.image=clamp(state.image+1);publish(`Mecz za mną. Ocena ${perf}/100 ⚽`);}),
 decision("🛌 Idę regenerować się",()=>{state.health=clamp(state.health+5);})
 ]);
}
function openScout(o){
 addEvent(`🔎 Skaut: ${o.club}`,`${o.country} • ${o.type}. Zauważono Cię podczas ${o.trigger||"obserwacji"}. Nie jest to jeszcze kontrakt.`,[
 decision("💬 Chcę poznać szczegóły",()=>{o.status="discussion";addHistory("Rozmowa ze skautem",`Pytasz ${o.club} o warunki.`);}),
 decision("⚽ Zgadzam się na test",()=>{if(state.age<18){parentDecision(o)}else{startTrial(o)}}),
 decision("🛑 Odrzucam",()=>{o.status="declined";addHistory("Odrzucona propozycja",o.club)})
 ]);
}
function parentDecision(o){
 addEvent("👨‍👩‍👧 Rozmowa z rodzicami",`Masz ${state.age} lat. Rodzice mogą realnie wpłynąć na wyjazd. ${state.parents[0].name}: ${state.parents[0].support}/100 wsparcia. ${state.parents[1].name}: ${state.parents[1].support}/100.`,[
 decision("❤️ Zgadzamy się",()=>{o.status="parent_ok";startTrial(o)}),
 decision("📋 Zgadzamy się, ale tylko z warunkami",()=>{o.status="conditions";addEvent("📋 Warunki rodziny","Rodzice chcą, żeby klub zapewnił szkołę, opiekę i rozsądną odległość.",[
 decision("🏠 Szukamy opcji bliżej",()=>{o.status="negotiating";news("📍 Negocjacje ze skautem","Poproszono o opcję bliżej domu.");}),
 decision("📚 Najważniejsza szkoła",()=>{o.status="school_condition";state.mental+=1;}),
 decision("⚽ Mimo wszystko próbuję",()=>{o.status="parent_ok";startTrial(o)})
 ])}),
 decision("🛑 Rodzice odmawiają",()=>{o.status="parents_refused";news("🛑 Rodzice odmówili",`Na razie nie zgadzają się na ${o.club}. Możesz wrócić do tematu.`)})
 ]);
}
function startTrial(o){state.trials.push({id:Date.now(),club:o.club,country:o.country,status:"oczekuje",day:state.day});news("⚽ Test skautingowy",`${o.club} przygotowuje dla Ciebie test. Wejdź w Karierę, żeby podjąć decyzję.`);addHistory("Test skautingowy",`Zaakceptowano etap testowy ${o.club}.`)}
function trialDecision(t){
 addEvent(`⚽ Test w ${t.club}`,"Trener oceni technikę, formę, mental i zachowanie. Wybierz sposób podejścia.",[
 decision("🔥 Daję z siebie wszystko",()=>{t.status="completed";state.ovr=clamp(state.ovr+2);state.skill=clamp(state.skill+2);news("🌟 Test udany",`${t.club} jest pod wrażeniem.`)}),
 decision("⚖️ Gram rozsądnie",()=>{t.status="completed";state.form=clamp(state.form+2);news("📝 Test zakończony",`${t.club} będzie dalej obserwować zawodnika.`)}),
 decision("✋ Rezygnuję",()=>{t.status="declined"})
 ]);
}
function activity(name,cost,hrs,delta){
 if(state.hour+hrs>22){alert("Nie ma już tyle czasu.");return}
 if(state.money<cost){alert("Brakuje pieniędzy.");return}
 state.money-=cost;state.totalSpent+=cost;Object.entries(delta||{}).forEach(([k,v])=>state[k]=clamp(Number(state[k]||0)+v));addHistory(name,`Wydano ${money(cost)}.`,`czas: ${hrs} h`);advance(hrs)
}
function publish(text){
 state.posts.unshift({text,likes:Math.floor(state.popularity*20+Math.random()*10),date:dateText()});state.popularity=clamp(state.popularity+.2);save()
}
function route(tab){state.tab=tab;save();render();window.scrollTo(0,0)}
function buy(p){
 if(state.money<p[2]){alert("Brakuje "+money(p[2]-state.money));return}
 state.money-=p[2];state.totalSpent+=p[2];state.owned.push({name:p[0],price:p[2],date:dateText()});
 if(p[3]&&p[4])state[p[3]]=clamp(Number(state[p[3]]||0)+p[4]);
 if(p[3]==="home")news("🏠 Nowa nieruchomość","Posiadłość pojawiła się w zakładce Życie. Możesz ją rozbudowywać.");
 addHistory("Zakup",p[0],`-${money(p[2])}`);save();render()
}
function resetCareer(){if(confirm("Restart kariery? Wszystkie dane tej kariery zostaną usunięte.")){state=fresh();save();render()}}
function newGame(){if(confirm("Nowa gra z losowymi danymi?")){state=fresh();state.name=["Kacper","Maja","Oskar","Lena","Adam","Julia"][Math.floor(Math.random()*6)]+" "+["Nowak","Kowalski","Wójcik","Mazur"][Math.floor(Math.random()*4)];save();render()}}
function repair(){save();render();alert("Stan gry zapisany i ekran odświeżony. Kariera nie została zresetowana.")}
function tutorDone(x){if(!state.tutorial.done.includes(x))state.tutorial.done.push(x);save()}
function ensureScout(){
 if(state.day%5===0 && !state.offers.some(o=>o.day===state.day)){let c=countries[Math.floor(Math.random()*countries.length)],club=({"Polska":"Lech Poznań","Hiszpania":"RCD Mallorca","Anglia":"Manchester City","Niemcy":"Borussia Dortmund","Włochy":"Juventus","Francja":"Olympique Lyon"}[c]||"Klub "+c);let o={id:Date.now(),club,country:c,type:state.age<18?"zaproszenie na obserwację":"rozmowa transferowa",trigger:state.matchCount?"meczu":"obserwacji",status:"new",day:state.day};state.offers.push(o);news("🔎 Skaut Cię zauważył",`${club} chce się Tobą zainteresować. Kliknij tutaj, żeby podjąć decyzję.`,()=>openScout(o))}
}
function calendarView(){

function settings(){
 return `<div class="grid"><div class="card hero"><div class="kicker">⚙️ USTAWIENIA</div><div class="title">Gra</div><div class="sub">Tutaj zmieniasz preferencje i zarządzanie karierą. „Napraw grę” nie kasuje kariery.</div></div>
 <div class="card span6"><div class="kicker">❤️ PREFERENCJE RANDKOWANIA</div>${["kobiety","mężczyźni","wszyscy","brak randkowania"].map(x=>`<button class="btn ${state.dating===x?"primary":""}" onclick="state.dating='${x}';save();render()">${x}</button>`).join("")}</div>
 <div class="card span6"><div class="kicker">💾 ROZGRYWKA</div><div class="actions"><button class="btn" onclick="resetCareer()">🔄 Restart kariery<small>Te same podstawowe dane rodziny, nowa ścieżka.</small></button><button class="btn" onclick="newGame()">🆕 Nowa gra<small>Nowe imię, nazwisko i rodzina.</small></button><button class="btn" onclick="newGamePlus()">✨ Nowa gra+<small>Ty ustalasz zawodnika, rodzina pozostaje automatyczna.</small></button><button class="btn" onclick="repair()">🔧 Napraw grę<small>Odświeża i zapisuje stan bez resetu.</small></button></div></div>
 <div class="card span12"><div class="kicker">📖 KODEKS / INSTRUKCJA</div><div class="sub">Każdy system ma znaczenie: czas → aktywności → energia → trening → mecze → wydarzenia → decyzje → relacje → rodzina → popularność/wizerunek → sponsorzy → finanse → zakupy → edukacja i kariery poboczne. Wydarzenia mogą generować nowe opcje, a te kolejne wydarzenia. Nie każda ścieżka pojawi się w każdej karierze.</div></div></div>`
}
function newGamePlus(){let old=fresh();let name=prompt("Imię i nazwisko:",state.name);if(!name)return;let pos=prompt("Pozycja:",state.position)||state.position;state=old;state.name=name;state.position=pos;save();render()}
function settingsRoute(){route("settings")}
function render(){
 ensureScout();
 let body=({home,career,stats,life,family,relations,history,flgram,finance,shop,settings,calendar:()=>calendarView()}[state.tab]||home)();
 document.getElementById("app").innerHTML=`<header class="top"><div class="topin"><div class="brand">FOOTBALL <span>LIFE 27</span></div><div class="date">Dzień ${state.day}<br>${dateText()} • ${String(state.hour).padStart(2,"0")}:00</div></div></header><div class="alerts">${state.news.filter(x=>!x.read).slice(0,2).map((n,i)=>`<div class="alert" onclick="openNews(${i})"><b>${esc(n.title)}</b><small>${esc(n.text)}</small></div>`).join("")}</div><main class="wrap">${body}</main><nav class="nav"><div class="navin">${[
["home","🏠","Dzień"],["career","⚽","Kariera"],["stats","📊","Statystyki"],["life","🧬","Życie"],["family","👨‍👩‍👧","Rodzina"],["relations","🤝","Relacje"],["history","📜","Historia"],["flgram","📱","FLgram"],["finance","💰","Finanse"],["shop","🛍️","Sklep"],["settings","⚙️","Ustawienia"]].map(x=>`<button class="${state.tab===x[0]?"active":""}" onclick="route('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join("")}</div></nav>${state.pendingEvent?eventModal():tutorialModal()}`;
}
function eventModal(){
 let e=state.pendingEvent;
 return `<div class="modal"><div class="modalbox event"><button class="close" onclick="state.pendingEvent=null;save();render()">×</button><div class="kicker">⚡ WYDARZENIE</div><h2>${esc(e.title)}</h2><p class="sub">${esc(e.text)}</p><div class="actions">${e.choices.map((c,i)=>`<button class="btn ${i===0?"primary":""} choice" onclick="choose(${i})">${esc(c.label)}</button>`).join("")}</div></div></div>`
}
function choose(i){let c=state.pendingEvent?.choices[i];state.pendingEvent=null;if(c){try{c.fn()}catch(e){console.error(e)}}save();render()}
function tutorialModal(){
 if(state.tutorial.done.length>=5)return "";
 return `<div class="modal"><div class="modalbox"><button class="close" onclick="state.tutorial.started=true;save();render()">×</button><div class="kicker">🎓 SAMOUCZEK</div><h2>Football Life 27</h2><p class="sub">Wykonuj zadania — każde odhacza się natychmiast. Gra działa offline, a zapis jest lokalny.</p>${[
["day","Zobacz przebieg dnia"],["career","Otwórz Karierę"],["life","Otwórz Życie"],["family","Otwórz Rodzinę"],["flgram","Otwórz FLgram"],["shop","Otwórz Sklep"],["finance","Otwórz Finanse"],["settings","Otwórz Ustawienia"]].map(x=>`<button class="btn ${state.tutorial.done.includes(x[0])?"primary":""}" onclick="tutorDone('${x[0]}');route('${x[0]}')">${state.tutorial.done.includes(x[0])?"✓":"○"} ${x[1]}</button>`).join("")}</div></div>`
}
function openNews(i){let n=state.news.filter(x=>!x.read)[i];if(!n)return;n.read=true;if(n.action){n.action();return}save();render()}
window._alert=openNews;
render();
</script>
</body>
</html>
